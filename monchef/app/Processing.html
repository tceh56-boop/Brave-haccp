<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обработка сырья</title>
<style>
:root{--wine:#6e1423;--wine2:#4a0c17;--gold:#b3893f;--bg:#f7f3f1;--card:#fff;--ink:#2a1a1d;--mut:#7d6b6e;--line:#eadfdc;--red:#a8231f;--red-bg:#f8e1df;--amber:#a86a12;--amber-bg:#fbefd9;--green:#2f7d4f;--green-bg:#e3f2e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}.tabs b{font-weight:700;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}.nm{font-weight:650}.meta{color:var(--mut);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}.r{background:var(--red-bg);color:var(--red)}.a{background:var(--amber-bg);color:var(--amber)}.g{background:var(--green-bg);color:var(--green)}
.form{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}.card.open .form{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d9cfcc;border-radius:9px;font:inherit;background:#fff}
textarea{min-height:56px}.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.chk input{width:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px inherit;cursor:pointer;background:#efe6e3;color:var(--ink)}
.btn.pri{background:var(--wine);color:#fff}.btn.bad{background:var(--red-bg);color:var(--red)}.btn:disabled{opacity:.5}
.msg{margin-top:10px;font-size:14px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:30px}.note{font-size:12px;color:var(--mut);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}.tbl th{font-size:12px;color:var(--mut)}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px}.steps span{background:#f3ece9;color:var(--mut);border-radius:999px;padding:3px 9px}.steps span.on{background:var(--wine);color:#fff}
.lnH,.lnG{display:grid;grid-template-columns:3fr 1fr .9fr 1fr 1.35fr 38px;gap:6px;align-items:center}.lnH{font-size:11.5px;color:var(--mut);margin-top:8px;padding:0 9px}
.ln{border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px;background:#fffdfc}.ln.bad{border-color:#e7b9b5}
.exp{font-size:12.5px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:4px}.exp select{width:auto;max-width:100%;padding:4px 6px;font-size:12.5px}.exp a{color:var(--wine)}
.mL{display:none}@media(max-width:640px){.lnH{display:none}.lnG{grid-template-columns:1fr 1fr 1fr;align-items:end}.lnG .nmI{grid-column:1/-1}.lnG .dtI{grid-column:span 2}.mL{display:block;margin:2px 0 2px}}
.sum{font-size:13px;margin-top:10px}.done{border-color:#bfe0cb}.bt{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}
.bt .inf{flex:1;min-width:200px}.bt .cp{display:flex;gap:6px;align-items:center;font-size:13px}.bt .cp input{width:64px;padding:6px}
.rc{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:9px 0}.rc input{width:auto;margin-top:3px}.rc .inf{flex:1;min-width:0}
.lbWrap{overflow-x:auto;max-width:100%}
.lp{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}.lp .grid{grid-template-columns:repeat(3,1fr)}@media(max-width:640px){.lp .grid{grid-template-columns:1fr 1fr}}
.ck{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;margin:2px 0}.ck i{font-style:normal;width:16px;flex:0 0 16px}.warnbox{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.okbox{background:var(--green-bg);color:var(--green);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}.ambox{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.oL{display:grid;grid-template-columns:3fr 1fr 70px 1.6fr 34px;gap:6px;align-items:center;margin-top:6px}@media(max-width:640px){.oL{grid-template-columns:1fr 1fr 70px}.oL .w{grid-column:1/-1}}
.bar{height:8px;border-radius:6px;background:#f0e6e3;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}.bar.a i{background:var(--amber)}.bar.r i{background:var(--red)}
.pl{border-top:1px solid var(--line);padding:9px 0}.pl:first-child{border-top:0}
</style></head><body><div class="wrap">
<h1>Обработка сырья</h1>
<div class="sub">Дефрост, зачистка, разбор на полуфабрикаты — с партией, сроком и этикеткой п/ф; план обработки из банкетов. Срок п/ф берётся с этикетки производителя сырья или утверждается ответственным — не придумывается.</div>
<div class="tabs" id="tabs"></div><div class="msg" id="msg"></div><div id="body"><div class="empty">Загрузка…</div></div>
</div>

    return '<div class="pl"><b>' + esc(x.pf) + '</b> — ' + q(x.qty, x.unit) + ' к ' + esc(x.prodDate) + '<div class="meta">из «' + esc(x.raw) + '»' + (x.rawQty ? ' ≈ ' + q(x.rawQty, x.unit) + ' сырья (выход ' + x.yieldPct + ' %, ' + esc(x.basis) + ')' : ' — ' + esc(x.basis)) + '</div></div>'; }).join('') : '<div class="empty">—</div>');
  if (P.shortages.length || P.otherShortages) h += sec('<span style="color:var(--red)">Не хватает сырья для обработки — нужно закупить</span>', P.shortages.map(function (x) { return '<div class="pl"><b>' + esc(x.product) + '</b> — не хватает ' + q(x.missing, x.unit) + ' к ' + esc(x.prodDate) + ((x.via || []).length ? ' (для п/ф ' + x.via.map(esc).join(', ') + ')' : '') + '<div class="meta">' + x.banquets.map(esc).join(', ') + '</div></div>'; }).join('') +
    (P.otherShortages ? '<div class="note">Ещё позиций с нехваткой, не связанных с обработкой: ' + P.otherShortages + ' — они в «Закупке».</div>' : ''));
  if (P.expiring.length) h += sec('Истекает, в плане не используется', P.expiring.map(function (x) { return '<div class="pl"><b>' + esc(x.product) + '</b> · ' + esc(x.batchId) + ' — ' + q(x.left, x.unit) + ', годен до ' + esc(x.expiry) + '<div class="meta">' + esc(x.note) + '</div></div>'; }).join(''));
  var nd = (P.unknownYield || []).map(function (x) { return esc(x.pf) + ': ' + esc(x.reason); }).concat((P.pfNoSource || []).map(function (x) { return esc(x.pf) + ': ' + esc(x.reason); })).concat((P.noData || []).map(function (x) { return 'банкет ' + esc(x.banquet) + ' (' + esc(x.date) + ') ' + esc(x.name) + ': ' + esc(x.reason); }));
  if (nd.length) h += sec('Нет данных для расчёта', nd.slice(0, 15).map(function (x) { return '<div class="ck"><i>⚠</i><span>' + x + '</span></div>'; }).join('') + (nd.length > 15 ? '<div class="note">и ещё ' + (nd.length - 15) + '</div>' : ''));
  if ((P.yields || []).length) h += sec('Фактический выход по актам', P.yields.map(function (y) { return '<div class="ck"><i>·</i><span>' + esc(y.raw) + ' → ' + esc(y.pf) + ': <b>' + y.yieldPct + ' %</b> (' + y.acts + ' акт.)</span></div>'; }).join(''));
  return h;
}
function pubTasks(btn) { btn.disabled = true; call('mcPublishDefrostTasks', [JSON.stringify(PLANF), TOKEN]).then(function (r) { btn.disabled = false; if (!okOf(r)) return msg(errText(r)); var d = dataOf(r); msg('Задач поставлено: ' + d.created + (d.total > d.created ? ' (остальные уже стоят)' : ''), true); }, function () { btn.disabled = false; msg('Нет связи'); }); }
/* ---------- решения по срокам ---------- */
function holdHtml() {
  if (!D.holds.length) return '<div class="empty">Партий, ждущих решения по сроку, нет</div>';
  return D.holds.map(function (x) { var id = esc(x.batchId);
    return '<div class="card"><div class="row" style="cursor:default"><div><div class="nm">' + esc(x.product) + ' · ' + esc(x.qty) + '</div><div class="meta">' + id + ' · ' + esc(x.kind) + (x.parent ? ' из партии ' + esc(x.parent) : '') + '</div></div><span class="chip r">не допущена</span></div><div class="ambox">' + esc(x.basis) + '</div>' +
      (D.canDecide ? '<div class="grid" style="margin-top:8px"><div><label>Срок, ч *</label><input id="hh_' + id + '" type="number" step="any"></div><div style="grid-column:span 2"><label>Основание *</label><input id="hb_' + id + '" placeholder="ТИ, документ производителя, решение HACCP-группы"></div></div>' +
        '<label class="chk"><input type="checkbox" id="hp_' + id + '">сделать правилом для «' + esc(x.product) + '»</label><div class="acts"><button class="btn pri" onclick="decide(\'' + id + '\',this)">Утвердить срок</button><a class="btn" target="_top" href="' + esc(cardUrl(x.batchId)) + '">Карточка</a></div>'
        : '<div class="note">Срок утверждает ответственный HACCP (шеф-повар, руководитель).</div>') + '</div>'; }).join('');
}
function decide(id, btn) { btn.disabled = true; call('mcSetProcessedExpiry', [JSON.stringify({ batchId: id, hours: v('hh_' + id), basis: v('hb_' + id), applyToProduct: document.getElementById('hp_' + id).checked }), TOKEN]).then(function (r) {
  btn.disabled = false; if (!okOf(r)) return msg(errText(r)); var d = dataOf(r); DONE = { title: 'Срок утверждён', label: d.label, type: '' }; reload(function () { view('do'); }); }, function () { btn.disabled = false; msg('Нет связи'); }); }
/* ---------- акты и правила ---------- */
function actsHtml() {
  if (!D.acts.length) return '<div class="empty">Актов обработки ещё нет</div>';
  return '<div class="card">' + D.acts.map(function (a) { var t = { TRIM: 'Зачистка', CUT: 'Разбор', DEFROST: 'Дефрост' }[a['Тип']] || 'Разбор (Mon Cher)';
    return '<div class="pl"><div><b>' + esc(t) + '</b> · ' + esc(a['ID']) + ' · ' + esc(a['Дата']) + ' · ' + esc(a['Сотрудник']) + (a['ТребуетПроверки'] === true || a['ТребуетПроверки'] === 'TRUE' ? ' <span class="chip r">требует проверки</span>' : '') + ' <span class="chip">' + esc(a['Статус']) + '</span></div>' +
      '<div class="meta">' + esc(a['Продукт']) + ' · партия ' + esc(a['ПартияИсточник']) + (a['ПроцентОтход'] !== '' ? ' · отходы ' + esc(a['ПроцентОтход']) + ' %' + (a['НормаПроцент'] !== '' ? ' (норма ' + esc(a['НормаПроцент']) + ' %)' : '') : '') + (a['Детали'] ? ' · ' + esc(a['Детали']) : '') + '</div>' +
      (a.lines || []).map(function (l) { return '<div class="meta">' + (l.type === 'waste' ? '— отходы: ' : '→ ') + esc(l.name) + ' ' + esc(l.qty) + ' ' + esc(l.unit) + (l.batchId ? ' · <a target="_top" href="' + esc(cardUrl(l.batchId)) + '">' + esc(l.batchId) + '</a>' : '') + (l.expiry ? ' · до ' + esc(l.expiry) : '') + (l.reason ? ' · ' + esc(l.reason) : '') + '</div>'; }).join('') + '</div>'; }).join('') + '</div>';
}
function rulesHtml() {
  var s = D.settings, h = '<div class="card"><div class="nm">Правила п/ф и дефроста продукта</div><div class="meta">Решение ответственного HACCP с основанием. Срок с этикетки сырья («после вскрытия») по умолчанию применяется к п/ф, кроме фарша и рубленых.</div>' +
    '<div class="grid" style="margin-top:8px"><div style="grid-column:span 2"><label>Продукт или п/ф *</label><input id="rn" list="pfl2"><datalist id="pfl2">' + PROD.slice(0, 3000).map(function (n) { return '<option value="' + esc(typeof n === 'string' ? n : n.name) + '">'; }).join('') + '</datalist></div>' +
    '<div><label>Срок с этикетки сырья</label><select id="ri"><option value="">по умолчанию</option><option value="да">да</option><option value="нет">нет</option></select></div>' +
    '<div><label>Срок п/ф, ч</label><input id="rs" type="number" step="any"></div><div style="grid-column:span 2"><label>Основание срока п/ф</label><input id="rsb"></div>' +
    '<div><label>Срок после размораживания, ч</label><input id="ra" type="number" step="any"></div><div style="grid-column:span 2"><label>Основание</label><input id="rab"></div><div><label>Длительность дефроста, ч</label><input id="rd" type="number" step="any" max="' + esc(s.maxH) + '"></div></div>' +
    (D.canDecide ? '<div class="acts"><button class="btn pri" onclick="saveRule(this)">Сохранить правило</button></div>' : '<div class="note">Правила задаёт ответственный HACCP.</div>') + '</div>';
  h += '<div class="card"><div class="nm">Дефрост (ККТ 4)</div><div class="grid" style="margin-top:8px"><div><label>Не дольше, ч</label><input id="sm" type="number" value="' + esc(s.maxH) + '"></div><div><label>Замер каждые, ч</label><input id="si" type="number" value="' + esc(s.measureH) + '"></div>' +
    '<div><label>t° в толще не выше, °C</label><input id="sc" type="number" step="0.1" value="' + esc(s.coreMax === null ? '' : s.coreMax) + '" placeholder="из вашей НД"></div><div><label>Начало производства</label><input id="sp" value="' + esc(s.prodStart) + '"></div><div style="grid-column:span 2"><label>Основание</label><input id="sb" value="' + esc(s.basis) + '"></div></div>' +
    (D.canDecide ? '<div class="acts"><button class="btn" onclick="saveSet(this)">Сохранить</button></div>' : '') + '</div>';
  h += '<div class="card"><div class="nm">Нормы отходов</div>' + (D.norms || []).map(function (n) { return '<div class="ck"><i>·</i><span>' + esc(n.name) + ': не больше ' + esc(n.maxWastePercent) + ' %</span></div>'; }).join('') + '</div>';
  return h;
}
function saveRule(btn) { btn.disabled = true; call('mcSaveProcessingProfile', [JSON.stringify({ name: v('rn'), inheritLabel: v('ri') || undefined, shelfH: v('rs'), shelfBasis: v('rsb'), afterDefrostH: v('ra'), afterDefrostBasis: v('rab'), defrostH: v('rd') }), TOKEN]).then(function (r) {
  btn.disabled = false; if (!okOf(r)) return msg(errText(r)); var d = dataOf(r); msg('Сохранено: «' + d.name + '» — срок с этикетки сырья: ' + (d.inheritLabel ? 'да' : 'нет'), true); }, function () { btn.disabled = false; }); }
function saveSet(btn) { btn.disabled = true; call('mcSaveProcessingSettings', [JSON.stringify({ maxH: v('sm'), measureH: v('si'), coreMax: v('sc'), prodStart: v('sp'), basis: v('sb') }), TOKEN]).then(function (r) {
  btn.disabled = false; if (!okOf(r)) return msg(errText(r)); D.settings = dataOf(r); msg('Сохранено', true); }, function () { btn.disabled = false; }); }
boot();
</script></body></html>
