<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зал и бронирование</title>
<!-- MON CHEF V101 Restaurant Service — зал, столы, бронирование, предзаказ.
     Собственность Слепцова Дениса Владимировича. Разработчик кода — Слепцов Денис Владимирович.
     Все проверки (пересечения, вместимость, права) — на сервере; страница только показывает и отправляет. -->
<style>
:root{--wine:#6e1423;--wine2:#4a0c17;--gold:#b3893f;--bg:#f7f3f1;--card:#fff;--ink:#2a1a1d;--mut:#7d6b6e;--line:#eadfdc;--red:#a8231f;--red-bg:#f8e1df;--amber:#a86a12;--amber-bg:#fbefd9;--green:#2f7d4f;--green-bg:#e3f2e8;--blue:#2f5f9e;--blue-bg:#e2ecf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.bar>div{flex:1 1 130px;min-width:120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button,.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;min-height:40px}
.tabs button.on,.seg button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.meta{color:var(--mut);font-size:13px}.nm{font-weight:650}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d9cfcc;border-radius:9px;font:inherit;background:#fff;min-height:40px}
textarea{min-height:56px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px inherit;cursor:pointer;background:#efe6e3;color:var(--ink);min-height:42px}
.btn.pri{background:var(--wine);color:#fff}.btn.bad{background:var(--red-bg);color:var(--red)}.btn.ok{background:var(--green-bg);color:var(--green)}.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#efe6e3}
.st-NEW{background:var(--blue-bg);color:var(--blue)}.st-CONFIRMED{background:var(--green-bg);color:var(--green)}.st-WAITING{background:var(--amber-bg);color:var(--amber)}
.st-ARRIVED,.st-SEATED{background:#f1e4c8;color:#7a5512}.st-CLOSED{background:#eee;color:#666}.st-CANCELLED,.st-NO_SHOW{background:var(--red-bg);color:var(--red)}
.asg{font-size:11px;margin-top:2px;opacity:.8}.asg.me{font-weight:700;color:var(--gold)}.msg{margin:8px 0;font-size:14px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:24px}
/* схема зала */
.plan{display:grid;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto}
.cell{min-height:56px}
.tbl{border-radius:12px;border:2px solid transparent;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font-size:13px;text-align:center}
.tbl b{font-size:17px}.tbl.round{border-radius:50%}.tbl.rect{border-radius:8px}
.s-free{background:var(--green-bg);color:var(--green)}.s-order{background:var(--wine);color:#fff}.s-order.mine{box-shadow:0 0 0 3px var(--gold) inset}.s-soon{background:var(--amber-bg);color:var(--amber)}.s-booked{background:var(--blue-bg);color:var(--blue)}.s-seated{background:#f1e4c8;color:#7a5512}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:8px 0}.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* календарь */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.month .d{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:58px;padding:4px;font-size:12px;cursor:pointer}
.month .d.out{opacity:.4}.month .d.today{border-color:var(--wine)}.month .h{font-size:11px;color:var(--mut);text-align:center}
.month .n{font-weight:700;color:var(--wine)}
.bk{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;cursor:pointer}
.bk .t{font-weight:700;min-width:96px}
.week h3{font-size:14px;margin:12px 0 6px}
/* окно */
.ov{position:fixed;inset:0;background:rgba(30,10,14,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}@media(min-width:720px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:720px){.sheet{border-radius:16px}}
.sheet h2{margin:0 0 8px;font-size:19px}
.tpick{display:flex;flex-wrap:wrap;gap:6px}.tpick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;color:var(--ink);font-size:14px;margin:0}
.tpick label.busy{opacity:.55}.tpick input{width:auto;min-height:0}
.items .it{display:grid;grid-template-columns:2fr .7fr .8fr .8fr .6fr auto;gap:6px;align-items:end;margin-bottom:6px}
@media(max-width:640px){.items .it{grid-template-columns:1fr 1fr 1fr}}
.items .it .nm{align-self:center}
table.f{width:100%;border-collapse:collapse;font-size:14px}table.f td,table.f th{border-bottom:1px solid var(--line);padding:6px;text-align:left}table.f th{color:var(--mut);font-weight:600;font-size:12px}
.hist div{border-left:3px solid var(--line);padding:2px 8px;margin:4px 0;font-size:13px}
</style></head>
<body><div class="wrap">
<h1>Зал и бронирование</h1>
<div class="sub">Схема зала, заказы столов, брони гостей и предзаказ. Нажмите на стол: открыть стол, заказ, бронь.</div>
<div class="bar">
  <div><label>Площадка</label><select id="site"></select></div>
  <div><label>Дата</label><input type="date" id="date"></div>
  <div><label>Время</label><input type="time" id="time" step="300"></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="msg"></div>
<div id="view"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
var S = { tab: 'plan', mode: 'day', data: null, list: null, dishes: null, hall: '', pend: {} };
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function pad(n) { return ('0' + n).slice(-2); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ru(day) { return day ? day.split('-').reverse().join('.') : ''; }
function addDays(day, n) { var p = day.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return iso(d); }
function uuid() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
function note(t, ok) { $('msg').innerHTML = t ? '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + esc(t) + '</div>' : ''; if (t && ok) setTimeout(function () { if ($('msg').textContent === t) note(''); }, 4000); }
/** Вызов сервера. Ответ — {success, data | error}. */
function call(fn, data, done, fail) {
  google.script.run.withSuccessHandler(function (r) {
    var x; try { x = typeof r === 'string' ? JSON.parse(r) : r; } catch (e) { x = { success: false, error: { message: String(r) } }; }
    if (x && x.success) done(x.data); else (fail || function (m) { note(m); })(x && x.error ? (x.error.message || x.error) : (x && x.message) || 'Ошибка');
  }).withFailureHandler(function (e) { (fail || function (m) { note(m); })('Нет связи с сервером. Повторите — повтор не создаст дубль: ' + (e && e.message || e)); })[fn](JSON.stringify(data || {}));
}
/** Записывающий вызов с ключом операции: ключ живёт до ответа сервера, повтор после обрыва связи идёт с тем же ключом. */
function act(slot, fn, data, done, fail) {
  var k = S.pend[slot] || (S.pend[slot] = uuid()); data.idem = k;
  call(fn, data, function (r) { delete S.pend[slot]; done(r); }, function (m) { if (!/Нет связи/.test(m)) delete S.pend[slot]; (fail || note)(m); });
}
var ST = { NEW: 'новое', CONFIRMED: 'подтверждено', WAITING: 'ожидание', ARRIVED: 'гость пришёл', SEATED: 'стол занят', CLOSED: 'закрыто', CANCELLED: 'отменено', NO_SHOW: 'не пришёл' };
var NEXT = { NEW: ['CONFIRMED', 'WAITING', 'ARRIVED', 'SEATED', 'CANCELLED', 'NO_SHOW'], CONFIRMED: ['ARRIVED', 'SEATED', 'WAITING', 'CANCELLED', 'NO_SHOW'], WAITING: ['CONFIRMED', 'CANCELLED'], ARRIVED: ['SEATED', 'CANCELLED'], SEATED: ['CLOSED'] };
var ACT_RU = { CONFIRMED: 'Подтвердить', WAITING: 'В лист ожидания', ARRIVED: 'Гость пришёл', SEATED: 'Стол занят', CLOSED: 'Закрыть', CANCELLED: 'Отменить бронь', NO_SHOW: 'Гость не пришёл' };
function chip(st) { return '<span class="chip st-' + esc(st) + '">' + esc(ST[st] || st) + '</span>'; }

/* ---------- загрузка ---------- */
function load() {
  call('rsHallData', { siteId: $('site').value, date: $('date').value, time: $('time').value }, function (d) {
    S.data = d;
    if (!$('site').options.length) $('site').innerHTML = d.sites.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('');
    $('site').value = d.siteId;
    if (!S.hall || !d.halls.some(function (h) { return h.id === S.hall; })) S.hall = (d.halls.filter(function (h) { return h.status === 'ACTIVE'; })[0] || {}).id || '';
    tabs(); render();
  });
}
function tabs() {
  var t = [['plan', 'Зал']];
  if (S.data && S.data.can.order) t.push(['mine', S.data.can.orderAll ? 'Заказы' : 'Мои заказы']);
  t = t.concat([['book', 'Брони'], ['fc', 'Прогноз по предзаказам']]);
  if (S.data && S.data.can.stopgo) t.push(['stop', 'Stop/Go']);
  if (S.data && S.data.can.shift) t.push(['shift', 'Смена']);
  if (S.data && S.data.can.manage) t.push(['setup', 'Настройка зала']);
  $('tabs').innerHTML = t.map(function (x) { return '<button class="' + (S.tab === x[0] ? 'on' : '') + '" onclick="S.tab=\'' + x[0] + '\';tabs();render()">' + x[1] + '</button>'; }).join('');
}
function render() { ({ plan: rPlan, mine: rMine, book: rBook, fc: rFc, setup: rSetup, stop: rStopH, shift: rShift })[S.tab](); }
/* смена: оплаты, журнал продаж, Z-отчёт, food cost, расхождения (этап 7) */
var PM = { CASH: 'наличные', CARD: 'карта', OTHER: 'другое' };
/* этап 9: смена из графика (V98) на схеме зала и закрепление столов за официантами */
function shiftLine(d) {
  var sh = d.shift; if (!sh) return '';
  if (!sh.has) return d.can.orderAll ? '<div class="meta" style="margin-top:4px">График смен на ' + ru(d.date) + ' не заполнен — раздел «График смен».</div>' : '';
  var g = function (k, nm) { var l = sh.list.filter(function (x) { return x.group === k; }); return l.length ? '<b>' + nm + ':</b> ' + l.map(function (x) { return esc(x.name.split(' ').slice(0, 2).join(' ')) + ' ' + esc(x.start) + '–' + esc(x.end) + (x.now ? '' : ' (не сейчас)'); }).join(', ') : ''; };
  return '<div class="meta" style="margin-top:4px">На смене · ' + [g('hall', 'зал'), g('kitchen', 'кухня'), g('bar', 'бар')].filter(Boolean).join(' · ') + (sh.me ? '' : d.can.order && !d.can.orderAll ? ' · <span style="color:var(--red)">вас нет в графике на сегодня</span>' : '') + '</div>';
}
function rTasg() {
  if (!$('tasg')) return;
  call('rsShiftTables', { siteId: $('site').value, date: $('date').value }, function (r) {
    S.tasg = r; if (!$('tasg')) return;
    var tb = (S.data.tables || []).filter(function (t) { return t.status === 'ACTIVE'; }).sort(function (a, b) { return (a.hallId + ('000' + a.number).slice(-4)) < (b.hallId + ('000' + b.number).slice(-4)) ? -1 : 1; });
    var h = '<div class="card"><div class="nm">Закрепление столов · ' + ru(r.date) + '</div><div class="meta">' + (r.schedule.has ? 'Официанты из графика смен на этот день.' : 'Графика смен на этот день нет — закрепить можно любого официанта. Заполните «График смен».') + '</div>';
    if (!r.waiters.length) h += '<div class="meta">Официантов нет.</div>';
    h += r.waiters.map(function (w) {
      return '<div style="border-top:1px solid var(--line);padding:6px 0"><b>' + esc(w.name) + '</b>' + (w.start ? ' <span class="meta">смена ' + esc(w.start) + '–' + esc(w.end) + '</span>' : '') + '<div>' + tb.map(function (t) {
        var a = r.assign[t.id], on = a && a.waiterId === w.id;
        return '<label style="margin-right:10px;white-space:nowrap"><input type="checkbox" class="ta_' + esc(w.id) + '" value="' + esc(t.id) + '"' + (on ? ' checked' : '') + (r.can.edit ? '' : ' disabled') + '> № ' + esc(t.number) + (a && !on ? ' <span class="meta">(' + esc(a.waiter.split(' ')[0]) + ')</span>' : '') + '</label>';
      }).join('') + '</div>' + (r.can.edit ? '<button class="btn" onclick="tasgSave(\'' + esc(w.id) + '\')">Сохранить столы</button>' : '') + '</div>';
    }).join('') + '</div>';
    $('tasg').innerHTML = h;
  }, function () {});
}
function tasgSave(wid) {
  var ts = [].slice.call(document.querySelectorAll('.ta_' + wid)).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
  act('tasg-' + wid, 'rsShiftTablesSave', { siteId: $('site').value, date: $('date').value, waiterId: wid, tables: ts }, function (r) {
    note('Столы ' + r.waiter + ': ' + (r.tables.join(', ') || 'нет') + (r.moved.length ? '. Переданы: ' + r.moved.map(function (m) { return '№ ' + m.table + ' от ' + m.from; }).join(', ') : ''), true); load(); rTasg();
  }, note);
}
function rShift() {
  $('view').innerHTML = '<div class="empty">Загрузка…</div>';
  call('rsShiftReport', { siteId: $('site').value, date: $('date').value }, function (r) {
    S.shift = r;
    var h = '<div class="card"><div class="nm">Смена ' + ru(r.date) + '</div><div class="meta">' + esc(r.note) + '</div>' +
      '<table class="f" style="margin-top:8px"><tr><td>Заказов открыто / закрыто / сейчас открыто</td><td>' + r.orders.opened + ' / ' + r.orders.closed + ' / ' + r.orders.open + '</td></tr>' +
      '<tr><td>Оплачено по счетам (' + r.paid.bills + ')</td><td><b>' + money(r.paid.kop) + '</b> ' + Object.keys(r.paid.byMethod).map(function (k) { return '<span class="meta">' + PM[k] + ': ' + money(r.paid.byMethod[k]) + '</span>'; }).join(' · ') + '</td></tr>' +
      (r.refunds.bills ? '<tr><td>Возвраты (' + r.refunds.bills + ')</td><td>−' + money(r.refunds.kop) + '</td></tr>' : '') +
      '<tr><td>Проведено в журнал продаж из зала</td><td><b>' + money(r.journal.hallKop) + '</b> <span class="meta">всего в журнале за день: ' + money(r.journal.allKop) + '</span></td></tr>' +
      '<tr><td>Z-отчёт кассы</td><td>' + (r.z ? money(Math.round(r.z.z * 100)) + ' — ' + (r.z.status === 'MATCH' ? '<span class="chip st-CONFIRMED">сходится</span>' : '<span class="chip st-CANCELLED">расхождение ' + r.z.diff + ' ₽</span>') : '<span class="meta">не загружен</span>') + '</td></tr>' +
      (r.cost ? '<tr><td>Себестоимость проданного / произведённого / потери при отменах</td><td>' + money(r.cost.soldKop) + ' / ' + money(r.cost.producedKop) + ' / ' + money(r.cost.lossKop) + '</td></tr><tr><td>Food cost</td><td><b>' + (r.foodCostPct === null ? '—' : r.foodCostPct + ' %') + '</b></td></tr>' : '') +
      '</table></div>';
    h += r.issues.length ? '<div class="card"><div class="nm">Расхождения и что сделать</div>' + r.issues.map(function (x) { return '<div class="msg ' + (x.severity === 'info' ? '' : 'err') + '" style="margin:4px 0">' + esc(x.text) + '</div>'; }).join('') + '</div>' : '<div class="card msg ok">Расхождений нет</div>';
    h += r.closed.length ? '<div class="card"><div class="nm">Закрытые заказы</div>' + r.closed.map(function (o) {
      return '<div style="border-top:1px solid var(--line);padding:6px 0"><b>Стол № ' + esc(o.table) + '</b> · ' + esc(o.waiter) + o.bills.map(function (b) {
        return '<div class="bk" style="cursor:default"><div>' + esc(b.name) + ' · ' + money(b.totalKop) + ' · ' + esc(PM[b.method] || '') + (b.status === 'REFUNDED' ? ' · <span class="chip st-CANCELLED">возврат</span>' : '') + '</div>' +
          (r.can.refund && b.status === 'PAID' ? '<button class="btn bad" onclick="refund(\'' + b.id + '\')">Возврат по счёту</button>' : '') + '</div>'; }).join('') + '</div>'; }).join('') + '</div>' : '';
    $('view').innerHTML = '<div id="tasg"></div>' + h; rTasg();
  }, function (m) { $('view').innerHTML = '<div id="tasg"></div>'; note(m); rTasg(); });
}
function refund(id) {
  var b = null; S.shift.closed.forEach(function (o) { o.bills.forEach(function (x) { if (x.id === id) b = x; }); });
  var why = prompt('Возврат по счёту «' + b.name + '» на ' + money(b.totalKop) + ': в журнале продаж будет сторно, продукты на склад не возвращаются (блюда приготовлены). Деньги гостю возвращает касса. Причина:');
  if (!why) return;
  act('refund-' + id, 'rsBillRefund', { billId: id, version: b.version, reason: why }, function (r) { note('Возврат оформлен: ' + r.doc + ', ' + r.sum + ' ₽', true); rShift(); }, note);
}
/* Stop/Go для зала — просмотр; ставят и снимают кухня и бар (экран «Кухня и бар») */
function rStopH() {
  $('view').innerHTML = '<div class="empty">Загрузка…</div>';
  call('rsStopList', {}, function (d) {
    var ru = { STOP: 'STOP', LIMITED: 'ограничено', REVIEW: 'на проверке' };
    $('view').innerHTML = d.current.length ? d.current.map(function (r) { return '<div class="card bk" style="cursor:default"><div><span class="nm">' + esc(r.name) + '</span><div class="meta">' + (r.dept === 'BAR' ? 'бар' : 'кухня') + ' · ' + esc(r.reason) + (r.comment ? ' · ' + esc(r.comment) : '') + ' · с ' + esc(r.since) + '</div></div><span class="chip ' + (r.status === 'LIMITED' ? 'st-WAITING' : 'st-CANCELLED') + '">' + esc(ru[r.status] || r.status) + (r.status === 'LIMITED' ? ': ' + r.left : '') + '</span></div>'; }).join('')
      : '<div class="empty">Все блюда и напитки доступны</div>';
  }, function (m) { $('view').innerHTML = ''; note(m); });
}

/* ---------- зал ---------- */
function rPlan() {
  var d = S.data, halls = d.halls.filter(function (h) { return h.status === 'ACTIVE'; });
  if (!halls.length) { $('view').innerHTML = '<div class="empty">Залов пока нет.' + (d.can.manage ? ' Заведите зал и столы во вкладке «Настройка зала».' : ' Залы заводит администратор.') + '</div>'; return; }
  var h = halls.filter(function (x) { return x.id === S.hall; })[0] || halls[0];
  var tb = d.tables.filter(function (t) { return t.hallId === h.id && t.status === 'ACTIVE'; });
  var html = '<div class="seg">' + halls.map(function (x) { return '<button class="' + (x.id === h.id ? 'on' : '') + '" onclick="S.hall=\'' + x.id + '\';render()">' + esc(x.name) + '</button>'; }).join('') +
    (d.can.booking ? '<button onclick="openBk(null)">+ Новая бронь</button>' : '') + '</div>';
  html += '<div class="legend"><span><i class="s-free"></i>свободен</span><span><i class="s-soon"></i>бронь в ближайшие 2 ч</span><span><i class="s-booked"></i>забронирован</span><span><i class="s-seated"></i>гости за столом</span><span><i class="s-order"></i>заказ (рамка — мой)</span></div>';
  var cells = {}; tb.forEach(function (t) { cells[t.x + ':' + t.y] = t; });

  var m = S.dishes.filter(function (d) { return d.name.toLowerCase().indexOf(q) >= 0 || d.category.toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
  l.innerHTML = m.map(function (d) { return '<div class="card bk" onclick="addItem(\'' + esc(d.code) + '\')"><div><span class="nm">' + esc(d.name) + '</span><div class="meta">' + esc(d.category) + (d.yield ? ' · ' + d.yield + ' ' + esc(d.yunit) : '') + ' · ' + (d.dept === 'BAR' ? 'бар' : 'кухня') + '</div></div><span class="chip">добавить</span></div>'; }).join('') || '<div class="meta">Не найдено</div>';
}
function addItem(code) { var d = S.dishes.filter(function (x) { return x.code === code; })[0]; F.items.push({ code: code, name: d.name, qty: 1, unit: 'порц', amount: d.yield || null, amountUnit: d.yunit || '', course: null, comment: '' }); $('f_dq').value = ''; $('f_dl').innerHTML = ''; items(); }
function items() {
  var box = $('f_items'), ed = !!$('f_dq');

    var u = ['порц', 'шт', 'г', 'мл'].map(function (x) { return '<option' + (it.unit === x ? ' selected' : '') + '>' + x + '</option>'; }).join('');

      '<div><label>Ед.</label><select onchange="F.items[' + i + '].unit=this.value">' + u + '</select></div>' +
      '<div><label>Вес/объём, ' + esc(it.amountUnit || '') + '</label><input type="number" value="' + esc(it.amount || '') + '" onchange="F.items[' + i + '].amount=this.value"></div>' +
      '<div><label>Курс</label><input type="number" min="1" max="9" value="' + esc(it.course || '') + '" onchange="F.items[' + i + '].course=this.value"></div>' +

      '<div style="grid-column:1/-1"><input placeholder="Комментарий к позиции" value="' + esc(it.comment || '') + '" onchange="F.items[' + i + '].comment=this.value"></div></div>';

/* ---------- блокнот официанта (этап 3) ---------- */
function money(k) { if (k === null || k === undefined) return '—'; var r = (k / 100).toFixed(2).split('.'); return r[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (r[1] === '00' ? '' : ',' + r[1]) + ' ₽'; }
var O = null, MENU = null, OV = 'items';   // открытый заказ, меню, вкладка заказа
var IT_ST = { DRAFT: 'не отправлено', SENT: 'на кухне', WAIT_COURSE: 'ждёт курса', COOKING: 'готовится', READY: 'готово', SERVED: 'подано', CANCELLED: 'отменено', PROBLEM: 'проблема' };
var REPL = null;   // позиция, которую заменяем (вкладка «+ Добавить блюдо» в режиме замены)
function oServe(ids) { act('serve-' + ids.join(','), 'rsItemServe', { orderId: O.id, items: ids, itemIds: ids }, function (r) { reloadOrder('Подано: ' + r.served); }, fmsg); }
function oReplace(id) { REPL = findIt(id); OV = 'add'; renderOrder(); }

    b.disabled = false; note('Стол № ' + r.table + ' открыт' + (r.waiter ? ' · официант ' + r.waiter : '') + (r.fromPreorder ? ', из предзаказа: ' + r.fromPreorder + ' поз.' : '') + (r.skipped && r.skipped.length ? '. Не перенесено: ' + r.skipped.join('; ') : '') +
      (r.warnings && r.warnings.length ? '. Внимание: ' + r.warnings.join('; ') : ''), !(r.warnings && r.warnings.length));
    load(); openOrder(r.orderId);
  }, function (m) { b.disabled = false; fmsg(m); });
}
function rMine() {
  $('view').innerHTML = '<div class="empty">Загрузка…</div>';
  call('rsOrderList', { siteId: $('site').value, all: S.data.can.orderAll }, function (l) {
    $('view').innerHTML = l.length ? l.map(function (o) {
      return '<div class="card bk" onclick="openOrder(\'' + o.id + '\')"><div><span class="t">Стол № ' + esc(o.table) + '</span> ' + o.guests + ' гост. · ' + esc(o.waiter) +
        '<div class="meta">открыт ' + esc(o.openedAt) + ' · на кухне: ' + o.waiting + (o.draft ? ' · не отправлено: ' + o.draft : '') + '</div></div><div style="text-align:right"><div class="nm">' + money(o.totalKop) + '</div>' +
        (o.ready ? '<span class="chip st-CONFIRMED">готово: ' + o.ready + '</span>' : '') + '</div></div>';
    }).join('') : '<div class="empty">Открытых заказов нет. Откройте стол на схеме зала.</div>';
  }, function (m) { $('view').innerHTML = ''; note(m); });
}
function openOrder(id) {
  call('rsOrderGet', { id: id }, function (o) { O = o; renderOrder(); if (!MENU) call('rsMenuForOrder', {}, function (m) { MENU = m; }); }, note);
}
function reloadOrder(msg) { if (msg) note(msg, true); openOrder(O.id); load(); }
function oAct(slot, fn, data, msg) { act(slot + '-' + O.id, fn, data, function () { reloadOrder(msg); }, function (m) { fmsg(m); }); }
function renderOrder() {
  if (OV !== 'add') REPL = null;
  S.ordShown = true;
  var o = O, h = '<h2>Стол № ' + esc(o.table) + ' · ' + o.guests + ' гост. <span class="chip">' + esc(o.statusRu) + '</span></h2>' +
    '<div class="meta">Официант ' + esc(o.waiter) + ' · открыт ' + esc(o.openedAt) + (o.bookingId ? ' · по брони' : '') + (o.comment ? ' · ' + esc(o.comment) : '') + '</div>' +
    '<div class="card" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><div class="nm">Сумма заказа</div><div class="nm" style="font-size:20px">' + money(o.totalKop) + '</div></div>' +
    '<div class="seg">' + [['items', 'Позиции'], ['add', '+ Добавить блюдо'], ['bill', 'Счёт']].filter(function (x) { return x[0] !== 'add' || (o.can.edit && o.status === 'OPEN'); })
      .map(function (x) { return '<button class="' + (OV === x[0] ? 'on' : '') + '" onclick="OV=\'' + x[0] + '\';renderOrder()">' + x[1] + '</button>'; }).join('') + '</div><div id="f_msg"></div>';
  h += OV === 'items' ? oItems() : OV === 'add' ? oAdd() : oBill();
  h += '<div class="acts"><button class="btn" onclick="closeOv()">Закрыть</button>' + (o.status === 'OPEN' && o.can.edit ? '<button class="btn" onclick="oClose()">Закрыть заказ</button>' : '') +
    (o.status === 'OPEN' && o.can.all ? '<button class="btn bad" onclick="oCancel()">Отменить заказ</button>' : '') + '</div>';
  openOv(h); S.ordShown = true;
  if (OV === 'add') menuList();
}
function oItems() {
  var o = O, live = o.items.filter(function (x) { return x.status !== 'CANCELLED'; }), draft = live.filter(function (x) { return x.status === 'DRAFT'; });
  var h = '';
  if (o.can.send && draft.length) h += '<div class="card"><div class="nm">Не отправлено: ' + draft.length + '</div><div class="acts"><button class="btn pri" onclick="oSend(\'all\')">Отправить на кухню</button>' +
    '<button class="btn" onclick="oSend(\'all\',false)">Отправить все курсы сразу</button></div><div class="meta">«Отправить на кухню»: первый ждущий курс готовят сразу, следующие ждут вашей команды «Следующий курс».</div></div>';
  var groups = [{ n: 0, name: 'Без курса (сразу)' }].concat(o.courses.map(function (c) { return { n: c.n, name: c.name, status: c.status }; }));
  groups.forEach(function (g) {
    var its = o.items.filter(function (x) { return x.course === g.n; }); if (!its.length) return;
    var lv = its.filter(function (x) { return x.status !== 'CANCELLED'; });
    h += '<div class="card"><div class="bk" style="cursor:default"><div class="nm">' + (g.n ? 'Курс ' + g.n + ' · ' + esc(g.name) : g.name) + '</div>' +
      (g.n ? (g.status === 'FIRED' ? '<span class="chip st-CONFIRMED">готовят</span>' : '<span class="chip st-WAITING">ждёт команды</span>') : '') + '</div>';
    if (g.n && o.can.send && o.status === 'OPEN') {
      var hasDraft = lv.some(function (x) { return x.status === 'DRAFT'; }), hasWait = lv.some(function (x) { return x.status === 'WAIT_COURSE'; });
      h += '<div class="acts" style="margin-top:6px">' + (hasDraft ? '<button class="btn" onclick="oSend(\'course\',null,' + g.n + ')">Отправить курс ' + g.n + '</button>' : '') +
        (g.status !== 'FIRED' && hasWait ? '<button class="btn pri" onclick="oFire(' + g.n + ')">Следующий курс: ' + esc(g.name) + '</button>' : '') +
        (g.status === 'FIRED' ? '<button class="btn" onclick="oHold(' + g.n + ')">Отложить курс</button>' : '') + '</div>';
    }
    var rdy = lv.filter(function (x) { return x.status === 'READY'; });
    if (rdy.length > 1 && o.can.edit) h += '<div class="acts" style="margin-top:6px"><button class="btn ok" onclick="oServe([' + rdy.map(function (x) { return '\'' + x.id + '\''; }).join(',') + '])">Подано всё готовое (' + rdy.length + ')</button></div>';
    h += its.map(itemRow).join('') + '</div>';
  });
  return h || '<div class="empty">Позиций нет. Нажмите «+ Добавить блюдо».</div>';
}
function itemRow(x) {
  var o = O, cls = x.status === 'READY' ? 'st-CONFIRMED' : x.status === 'CANCELLED' ? 'st-CANCELLED' : x.status === 'DRAFT' ? 'st-NEW' : x.status === 'WAIT_COURSE' ? 'st-WAITING' : 'st-SEATED';
  var amt = x.weighted ? (x.factAmount !== null ? x.factAmount + ' ' + esc(x.amountUnit) + ' (факт)' : x.planAmount + ' ' + esc(x.amountUnit) + ' (план)') : x.qty + ' ' + esc(x.unit);
  var h = '<div style="border-top:1px solid var(--line);padding:8px 0"><div class="bk" style="cursor:default"><div><span class="nm">' + esc(x.name) + '</span> · ' + amt +
    '<div class="meta">' + (x.guest ? 'гость ' + x.guest : 'общее') + ' · ' + (x.dept === 'BAR' ? 'бар' : 'кухня') + (x.modifiers.length ? ' · ' + esc(x.modifiers.join(', ')) : '') + (x.comment ? ' · ' + esc(x.comment) : '') +
    (x.cancelReason && x.status === 'CANCELLED' ? ' · отмена: ' + esc(x.cancelReason) + (x.consumption && x.consumption.mode && x.consumption.mode !== 'NONE' ? ' (расход: ' + (x.consumption.mode === 'FULL' ? 'полностью' : 'частично') + ')' : '') : '') +
    (x.sentAt ? ' · отправлено ' + esc(x.sentAt) : '') + (x.readyAt ? ' · готово ' + esc(x.readyAt) : '') + (x.servedAt ? ' · подано ' + esc(x.servedAt) : '') + '</div>' +
    (x.problem && x.status === 'PROBLEM' ? '<div class="msg err" style="margin:4px 0">Кухня: ' + esc(x.problem) + '</div>' : '') + (x.cancelRequest && x.status !== 'CANCELLED' ? '<div class="meta">Запрошена отмена: ' + esc(x.cancelRequest) + '</div>' : '') + '</div>' +
    '<div style="text-align:right"><div>' + money(x.factKop !== null ? x.factKop : x.planKop) + '</div><span class="chip ' + cls + '">' + esc(IT_ST[x.status] || x.status) + '</span></div></div>';
  if (o.status === 'OPEN' && o.can.edit && x.status !== 'CANCELLED') {
    h += '<div class="acts" style="margin-top:4px">';
    if (x.weighted) h += '<button class="btn" onclick="oWeight(\'' + x.id + '\')">Фактический вес</button>';
    h += '<button class="btn" onclick="oGuest(\'' + x.id + '\')">Гость</button>';
    if (x.status === 'DRAFT') h += '<button class="btn" onclick="oReprice(\'' + x.id + '\')" title="взять цену меню на сегодня">Обновить цену</button>';
    if (x.status === 'READY') h += '<button class="btn ok" onclick="oServe([\'' + x.id + '\'])">Подано</button>';
    if (['SENT', 'WAIT_COURSE', 'PROBLEM'].indexOf(x.status) >= 0) h += '<button class="btn" onclick="oReplace(\'' + x.id + '\')">Заменить</button>';
    if (['DRAFT', 'SENT', 'WAIT_COURSE', 'COOKING', 'READY', 'PROBLEM'].indexOf(x.status) >= 0 && !x.cancelRequest) h += '<button class="btn bad" onclick="oCancelItem(\'' + x.id + '\')">Отменить</button>';
    h += '</div>';
  }
  return h + '</div>';
}
function findIt(id) { return O.items.filter(function (x) { return x.id === id; })[0]; }
function oSend(mode, holdNext, course) {
  if (!confirm(mode === 'course' ? 'Отправить курс ' + course + '? Кухня начнёт его готовить.' : 'Отправить неотправленные позиции на кухню и в бар?')) return;
  var d = { orderId: O.id, mode: mode, course: course }; if (holdNext === false) d.holdNext = false;
  act('send-' + O.id, 'rsOrderSend', d, function (r) { reloadOrder('Отправлено: ' + r.sent + ' (кухня ' + r.kitchen + ', бар ' + r.bar + ')' + (r.waiting ? ', ждут курса: ' + r.waiting : '')); }, fmsg);
}
function oFire(n) { if (confirm('Дать кухне команду готовить курс ' + n + '?')) oAct('fire' + n, 'rsCourseFire', { orderId: O.id, course: n }, 'Курс ' + n + ' — готовят'); }
function oHold(n) { if (confirm('Отложить курс ' + n + '? Кухня его ещё не начала — задания снова будут ждать команды.')) oAct('hold' + n, 'rsCourseHold', { orderId: O.id, course: n }, 'Курс ' + n + ' отложен'); }
function oWeight(id) { var x = findIt(id), a = prompt('Фактический вес «' + x.name + '», ' + x.amountUnit + ' (план ' + x.planAmount + '):', x.factAmount || ''); if (a) oAct('w-' + id, 'rsItemWeight', { itemId: id, version: x.version, amount: a.replace(',', '.') }, 'Вес внесён, сумма пересчитана'); }
function oGuest(id) { var x = findIt(id), g = prompt('Номер гостя (1–' + O.guests + '), 0 — общее:', x.guest || 0); if (g !== null && g !== '') oAct('g-' + id, 'rsItemUpdate', { itemId: id, version: x.version, guest: g }, 'Гость изменён'); }
function oReprice(id) { var x = findIt(id); oAct('rp-' + id, 'rsItemUpdate', { itemId: id, version: x.version, reprice: true }, 'Цена обновлена'); }
function oCancelItem(id) {
  var x = findIt(id), reason = '';
  if (x.status !== 'DRAFT') { reason = prompt(['COOKING', 'READY', 'PROBLEM'].indexOf(x.status) >= 0 ? '«' + x.name + '» кухня уже приняла: отмену подтвердит кухня и укажет расход. Причина:' : '«' + x.name + '» уже на кухне (ещё не начата). Отмена снимет задание, расхода не будет. Причина:'); if (!reason) return; }
  else if (!confirm('Убрать «' + x.name + '» из заказа?')) return;
  act('c-' + id + '-' + O.id, 'rsItemCancel', { itemId: id, version: x.version, reason: reason }, function (r) { reloadOrder(r && r.requested ? 'Кухня уже готовит — запрос отмены отправлен кухне' : 'Позиция отменена'); }, fmsg);
}
function oClose() { if (confirm('Закрыть заказ? Все счета должны быть оплачены. Оплаты будут проведены в журнал продаж.')) act('close-' + O.id, 'rsOrderClose', { orderId: O.id, version: O.version }, function (r) { closeOv(); note('Заказ закрыт, в журнал продаж проведено строк: ' + r.sales, true); load(); }, fmsg); }
function oCancel() { var r = prompt('Отменить заказ целиком? Возможно, только если ничего не ушло на кухню. Причина:'); if (r) oAct('cancel', 'rsOrderCancel', { orderId: O.id, version: O.version, reason: r }, 'Заказ отменён'); }

/* добавление блюд */
var ADDQ = '', ADDCAT = '';
function oAdd() {
  return (REPL ? '<div class="msg err">Замена для «' + esc(REPL.name) + '» — выберите блюдо. <a href="#" onclick="REPL=null;renderOrder();return false">Отменить замену</a></div>' : '') + '<div class="grid"><div style="grid-column:span 2"><input id="m_q" placeholder="Найти блюдо или напиток" value="' + esc(ADDQ) + '" oninput="ADDQ=this.value;menuList()"></div>' +
    '<div><select id="m_g" title="гость"><option value="0">общее</option>' + O.guestsList.map(function (g) { return '<option value="' + g.n + '">гость ' + g.n + '</option>'; }).join('') + '</select></div>' +
    '<div><select id="m_c" title="курс"><option value="0">без курса (сразу)</option>' + O.courses.map(function (c) { return '<option value="' + c.n + '">' + c.n + ' · ' + esc(c.name) + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="seg" id="m_cats" style="margin-top:8px"></div><div id="m_list"></div>';
}
function menuList() {
  var box = $('m_list'); if (!box) return;
  if (!MENU) { box.innerHTML = '<div class="meta">Меню загружается…</div>'; setTimeout(menuList, 400); return; }
  var cats = []; MENU.dishes.forEach(function (d) { if (cats.indexOf(d.category) < 0) cats.push(d.category); });
  $('m_cats').innerHTML = ['<button class="' + (!ADDCAT ? 'on' : '') + '" onclick="ADDCAT=\'\';menuList()">Все</button>'].concat(cats.map(function (c) { return '<button class="' + (ADDCAT === c ? 'on' : '') + '" onclick="ADDCAT=\'' + esc(c) + '\';menuList()">' + esc(c || 'Без категории') + '</button>'; })).join('');
  var q = ADDQ.trim().toLowerCase();
  var l = MENU.dishes.filter(function (d) { return (!ADDCAT || d.category === ADDCAT) && (!q || d.name.toLowerCase().indexOf(q) >= 0); }).slice(0, 60);
  box.innerHTML = l.map(function (d) {
    var off = d.stop === 'STOP' || d.priceKop === null;
    return '<div class="card bk" style="' + (off ? 'opacity:.55;cursor:default' : '') + '" ' + (off ? '' : 'onclick="addDish(\'' + esc(d.code) + '\')"') + '><div><span class="nm">' + esc(d.name) + '</span><div class="meta">' + esc(d.category) +
      (d.yield ? ' · ' + d.yield + ' ' + esc(d.yunit) : '') + ' · ' + (d.dept === 'BAR' ? 'бар' : 'кухня') + (d.weighted ? ' · весовое' : '') + '</div></div><div style="text-align:right">' +
      (d.priceKop !== null ? '<div class="nm">' + money(d.priceKop) + '</div><div class="meta">за ' + esc(d.priceFor) + '</div>' : '<span class="meta">нет цены</span>') +
      (d.stop === 'STOP' ? '<span class="chip st-CANCELLED">STOP</span>' : d.stop === 'LIMITED' ? '<span class="chip st-WAITING">осталось ' + d.left + '</span>' : '') + '</div></div>';
  }).join('') || '<div class="meta">Не найдено</div>';
}
function addDish(code) {
  var d = MENU.dishes.filter(function (x) { return x.code === code; })[0], x = { code: code, guest: $('m_g').value, course: $('m_c').value };
  if (REPL) {
    var why = prompt('Заменить «' + REPL.name + '» на «' + d.name + '»? Что решил гость (запишется в историю):', 'гость согласен на замену'); if (!why) return;
    var r0 = REPL; act('repl-' + r0.id, 'rsItemReplace', { itemId: r0.id, version: r0.version, code: code, reason: why }, function () { REPL = null; OV = 'items'; reloadOrder('Замена добавлена — отправьте её на кухню'); }, fmsg);
    return;
  }
  if (d.weighted) { var a = prompt('«' + d.name + '» — весовое (' + money(d.priceKop) + ' за ' + d.priceFor + '). Вес или объём, ' + d.weightUnit + ':', d.yield || ''); if (!a) return; x.amount = a.replace(',', '.'); }
  else { var q = prompt('«' + d.name + '» — количество:', '1'); if (!q) return; x.qty = q; }
  var c = prompt('Комментарий или модификаторы через запятую (можно пусто):', ''); if (c === null) return;
  if (c) { var parts = c.split(','); x.modifiers = parts.slice(1).map(function (s) { return s.trim(); }); x.comment = parts[0].trim(); }
  act('add-' + O.id, 'rsItemAdd', { orderId: O.id, items: [x] }, function () { note('Добавлено: ' + d.name, true); openOrder(O.id); }, fmsg);
}

/* счёт */
function oBill() {
  var o = O, h = '<div class="meta">Внутренний счёт MON CHEF — не фискальный чек. Оплату подтверждают по кассе; сверка — с Z-отчётом смены.</div>';
  var open = o.status === 'OPEN', anyPaid = (o.bills || []).some(function (b) { return b.status === 'PAID'; });
  if (open && o.can.split && !anyPaid) h += '<div class="acts"><button class="btn" onclick="split(\'one\')">Один счёт</button><button class="btn" onclick="splitEq()">Поровну</button>' +
    '<button class="btn" onclick="split(\'guests\')">Каждый за себя</button><button class="btn" onclick="manualSplit()">Разделить вручную</button></div>';
  if (o.unallocated && o.unallocated.length) h += '<div class="card"><div class="nm">Не распределено по счетам</div>' + o.unallocated.map(function (u) { return '<div class="meta">• ' + esc(u.name) + ' — ' + u.rest.num + '/' + u.rest.den + '</div>'; }).join('') +
    ((o.bills || []).some(function (b) { return b.status === 'OPEN'; }) && o.can.split ? '<div class="acts">' + o.bills.filter(function (b) { return b.status === 'OPEN'; }).map(function (b) { return '<button class="btn" onclick="assignRest(\'' + b.id + '\')">В «' + esc(b.name) + '»</button>'; }).join('') + '</div>' : '') + '</div>';
  (o.bills || []).forEach(function (b) {
    h += '<div class="card"><div class="bk" style="cursor:default"><div class="nm">' + esc(b.name) + '</div><span class="chip ' + (b.status === 'PAID' ? 'st-CONFIRMED' : 'st-NEW') + '">' + esc(b.statusRu) + '</span></div>' +
      b.lines.map(function (l) { return '<div class="bk" style="cursor:default"><div>' + esc(l.name) + (l.num !== l.den ? ' · ' + l.num + '/' + l.den : '') + '</div><div>' + money(l.kop) + '</div></div>'; }).join('') +
      '<div class="meta" style="margin-top:6px">Сумма ' + money(b.subtotalKop) + (b.discountKop ? ' · скидка −' + money(b.discountKop) + ' (' + esc(b.discountReason) + ')' : '') + (b.serviceKop ? ' · сбор +' + money(b.serviceKop) + ' (' + esc(b.serviceReason) + ')' : '') + '</div>' +
      '<div class="bk" style="cursor:default;margin-top:4px"><div class="nm">Итого</div><div class="nm" style="font-size:18px">' + money(b.totalKop) + '</div></div>' +
      (b.status === 'PAID' ? '<div class="meta">Оплачено: ' + esc({ CASH: 'наличные', CARD: 'карта', OTHER: 'другое' }[b.method] || b.method) + (b.receipt ? ', чек ' + esc(b.receipt) : '') + ' · ' + esc(b.confirmedBy) + ' ' + esc(b.confirmedAt) + '</div>' : '') +
      (b.status === 'OPEN' && open ? '<div class="acts">' + (o.can.discount ? '<button class="btn" onclick="adjust(\'' + b.id + '\')">Скидка / сбор</button>' : '') + (o.can.pay ? '<button class="btn ok" onclick="pay(\'' + b.id + '\')">Оплата подтверждена</button>' : '') + '</div>' : '') + '</div>';
  });
  var openBills = (o.bills || []).filter(function (b) { return b.status === 'OPEN'; });
  if (open && o.can.split && openBills.length > 1) h += '<div class="acts"><button class="btn" onclick="mergeAll()">Объединить неоплаченные счета</button></div>';
  if (!(o.bills || []).length) h += '<div class="empty">Счёт ещё не сформирован — выберите вариант выше.</div>';
  return h;
}
function split(mode, extra) { var d = { orderId: O.id, mode: mode }; for (var k in (extra || {})) d[k] = extra[k]; act('split-' + O.id, 'rsBillSplit', d, function () { OV = 'bill'; reloadOrder('Счёт сформирован'); }, fmsg); }
function splitEq() { var n = prompt('На сколько частей поровну?', O.guests); if (n) split('equal', { parts: n }); }
function assignRest(billId) { act('asg-' + billId, 'rsBillAssign', { orderId: O.id, billId: billId, items: O.unallocated.map(function (u) { return { itemId: u.itemId }; }) }, function () { reloadOrder('Добавлено в счёт'); }, fmsg); }
function mergeAll() { if (confirm('Объединить все неоплаченные счета в один?')) act('merge-' + O.id, 'rsBillMerge', { orderId: O.id, billIds: O.bills.filter(function (b) { return b.status === 'OPEN'; }).map(function (b) { return b.id; }) }, function () { reloadOrder('Счета объединены'); }, fmsg); }
function adjust(id) {
  var b = O.bills.filter(function (x) { return x.id === id; })[0];
  var dv = prompt('Скидка: «10%» или сумма «200». Пусто — без скидки.', b.discountType === 'PERCENT' ? b.discountValue + '%' : b.discountType === 'SUM' ? b.discountValue : ''); if (dv === null) return;
  var dr = dv ? prompt('Причина скидки:', b.discountReason) : ''; if (dv && !dr) return;
  var sv = prompt('Сервисный сбор: «10%» или сумма. Пусто — без сбора.', b.serviceType === 'PERCENT' ? b.serviceValue + '%' : b.serviceType === 'SUM' ? b.serviceValue : ''); if (sv === null) return;
  var sr = sv ? prompt('Основание сбора:', b.serviceReason) : ''; if (sv && !sr) return;
  var p = function (v) { v = String(v || '').trim().replace(',', '.'); return !v ? ['NONE', ''] : /%$/.test(v) ? ['PERCENT', v.slice(0, -1)] : ['SUM', v]; }, a = p(dv), c = p(sv);
  act('adj-' + id, 'rsBillAdjust', { billId: id, version: b.version, discountType: a[0], discountValue: a[1], discountReason: dr, serviceType: c[0], serviceValue: c[1], serviceReason: sr }, function () { reloadOrder('Счёт пересчитан'); }, fmsg);
}
function pay(id) {
  var b = O.bills.filter(function (x) { return x.id === id; })[0];
  var m = prompt('Счёт «' + b.name + '» на ' + money(b.totalKop) + ' оплачен в кассе?\nСпособ: 1 — наличные, 2 — карта, 3 — другое', '2'); if (!m) return;
  var method = { 1: 'CASH', 2: 'CARD', 3: 'OTHER' }[m.trim()]; if (!method) { fmsg('Способ: 1, 2 или 3'); return; }
  var rc = method === 'CASH' ? (prompt('Номер чека (можно пусто):', '') || '') : prompt('Номер чека или операции:', ''); if (method !== 'CASH' && !rc) return;
  act('pay-' + id, 'rsBillPay', { billId: id, version: b.version, method: method, receipt: rc, amountKop: b.totalKop }, function () { reloadOrder('Оплата подтверждена'); }, fmsg);
}
/* ручное разделение: у каждой позиции — части по счетам (1 и 1 — пополам; 2 и 1 — две трети и треть) */
var MS = null;
function manualSplit() {
  var live = O.items.filter(function (x) { return x.status !== 'CANCELLED'; });
  var n = Math.max(2, O.guests);
  MS = { bills: [], w: {} };
  for (var i = 1; i <= n; i++) MS.bills.push('Гость ' + i);
  live.forEach(function (x) { MS.w[x.id] = MS.bills.map(function (_, i) { return x.guest === i + 1 ? 1 : 0; }); if (!x.guest) MS.w[x.id][0] = 1; });
  drawMs();
}
function drawMs() {
  var live = O.items.filter(function (x) { return x.status !== 'CANCELLED'; });
  var h = '<h2>Разделить вручную</h2><div class="meta">У каждой позиции укажите части по счетам: 1 и 1 — пополам, 2 и 1 — две трети и треть (например, 3 бокала: 2 одному, 1 другому). Сумма делится без потери копеек.</div>' +
    '<div class="acts"><button class="btn" onclick="MS.bills.push(\'Счёт \'+(MS.bills.length+1));for(var k in MS.w)MS.w[k].push(0);drawMs()">+ Счёт</button></div><div style="overflow-x:auto"><table class="f"><tr><th>Позиция</th>' +
    MS.bills.map(function (b, i) { return '<th><input style="min-width:90px" value="' + esc(b) + '" onchange="MS.bills[' + i + ']=this.value"></th>'; }).join('') + '</tr>' +
    live.map(function (x) { return '<tr><td>' + esc(x.name) + '<div class="meta">' + money(x.factKop !== null ? x.factKop : x.planKop) + (x.qty > 1 ? ' · ' + x.qty + ' ' + esc(x.unit) : '') + '</div></td>' +
      MS.bills.map(function (_, i) { return '<td><input type="number" min="0" style="width:70px" value="' + (MS.w[x.id][i] || 0) + '" onchange="MS.w[\'' + x.id + '\'][' + i + ']=+this.value||0"></td>'; }).join('') + '</tr>'; }).join('') +
    '</table></div><div id="f_msg"></div><div class="acts"><button class="btn pri" onclick="saveMs()">Разделить</button><button class="btn" onclick="renderOrder()">Назад</button></div>';
  openOv(h);
}
function saveMs() {
  var bills = MS.bills.map(function (name) { return { name: name, items: [] }; });
  Object.keys(MS.w).forEach(function (id) { var w = MS.w[id], tot = w.reduce(function (a, b) { return a + b; }, 0); w.forEach(function (v, i) { if (v > 0) bills[i].items.push({ itemId: id, num: v, den: tot }); }); });
  bills = bills.filter(function (b) { return b.items.length; });
  act('split-' + O.id, 'rsBillSplit', { orderId: O.id, mode: 'manual', bills: bills }, function () { OV = 'bill'; reloadOrder('Счёт разделён'); }, fmsg);
}

/* ---------- старт ---------- */
(function () {
  var n = new Date(); $('date').value = iso(n); $('time').value = pad(n.getHours()) + ':' + pad(n.getMinutes());
  ['site', 'date', 'time'].forEach(function (k) { $(k).addEventListener('change', function () { if (S.tab === 'book') rBook(); else if (S.tab === 'fc') rFc(); load(); }); });
  load();
  // обновление: раз в 15 с спрашиваем метку «данные изменились»; изменилось — обновляем схему или открытый заказ (не во время ввода)
  setInterval(function () {
    if (document.hidden) return;
    call('rsGen', {}, function (g) {
      if (!g.gen || g.gen === S.gen) return; var first = !S.gen; S.gen = g.gen; if (first) return;
      var ovOn = $('ov').classList.contains('on');
      if (ovOn && S.ordShown && O && OV !== 'add' && !document.activeElement.closest('.sheet input,.sheet select,.sheet textarea')) openOrder(O.id);
      else if (!ovOn && (S.tab === 'plan' || S.tab === 'mine' || S.tab === 'stop')) { load(); if (S.tab !== 'plan') render(); }
    }, function () {});
  }, 15000);
})();
</script>
</body></html>
