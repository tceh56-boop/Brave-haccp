<!doctype html><script>window.MONCHEF_V40_PRODUCTS=[{"no":1,"name":"Maitake","type":"грибы","storage":"Хранить в бумажном пакете в холодильнике.","roomRaw":"Не более 3-4 часов.","fridgeRaw":"5-7 дней.","freezerRaw":"До 8 месяцев.","roomH":4.0,"fridgeH":168.0,"freezerH":5840.0,"spoilage":"темные пятна; слизь; гнилостный запах","notes":"Перед приготовлением можно разрезать на более мелкие части.; Грибы не рекомендуется хранить рядом с продуктами, активно поглощающими запахи."},{"no":2,"name":"Ruby шоколад","type":"кондитерское изделие","storage":"В прохладном, сухом, темном месте при температуре 14-18°C","roomRaw":"10-12 месяцев","fridgeRaw":"10-12 месяцев","freezerRaw":"Не рекомендуется","roomH":8760.0,"fridgeH":8760.0,"freezerH":null,"spoilage":"изменение цвета на более тусклый; неприятный затхлый запах; появление белого налета; плесень","notes":"Относительно новый продукт, может иметь специфические требования к хранению; Не хранить рядом с продуктами, имеющими сильный запах"},{"no":3,"name":"Абрикос","type":"фрукт косточковый","storage":"Незрелые твердые абрикосы хранить при комнатной температуре для дозревания. Спелые мягкие абрикосы — в холодильнике в один слой, не накрывая. Очень нежные, легко мнутся и повреждаются.","roomRaw":"2-5 дней до созревания; 1-2 дня","fridgeRaw":"3-5 дней (при 0...+2°C); 1-2 дня (сбрызнуть лимонным соком, в герметичном контейнере)","freezerRaw":"До 12 месяцев (половинки без косточек, в сиропе или сухой заморозкой)","roomH":120.0,"fridgeH":120.0,"freezerH":8760.0,"spoilage":"Кожица становится морщинистой; Появление мягких коричневых пятен; Кислый или спиртовой запах; Плесень (часто серая) у плодоножки; Вытекание сока","notes":"Согласно СанПиН, абрикосы выделяют этилен и чувствительны к нему. Для равномерного созревания храните в один слой.; Определить спелость можно по легкому аромату и небольшой податливости при нажатии.; Не храните абрикосы в полиэтиленовых пакетах без вентиляции — это вызывает конденсат и плесень."},{"no":4,"name":"Авокадо","type":"фрукт/овощ","storage":"При комнатной температуре до созревания, затем в холодильнике","roomRaw":"3-5 дней (незрелый)","fridgeRaw":"3-5 дней (зрелый)","freezerRaw":"Не рекомендуется","roomH":120.0,"fridgeH":120.0,"freezerH":null,"spoilage":"Потемнение мякоти, черные пятна, неприятный запах","notes":"Ускоряет созревание других фруктов, богат калием и витамином E"},{"no":5,"name":"Агар-агар","type":"загуститель","storage":"В сухом месте","roomRaw":"Неограничен","fridgeRaw":"Не требуется","freezerRaw":"Не требуется","roomH":null,"fridgeH":null,"freezerH":null,"spoilage":"Комкование, потеря желирования","notes":"В 8-10 раз сильнее желатина"},{"no":6,"name":"Агар-агар (порошок/хлопья/пластины)","type":"растительный желирующий агент","storage":"Хранить в сухом, прохладном, тёмном месте в герметичной таре. Чрезвычайно гигроскопичен. Влажность приводит к комкованию и потере желирующей силы.","roomRaw":"Неограниченный при сухости (технически несколько лет)","fridgeRaw":"","freezerRaw":"","roomH":null,"fridgeH":null,"freezerH":null,"spoilage":"Комкование, образование твёрдых комков; Появление постороннего запаха (впитывание); Потеря желирующей силы (не застывает даже при правильной концентрации)","notes":"Перед использованием обязательно растворить в жидкости и довести до кипения, кипятить 1-2 минуты для активации.; Кислая среда (лимонный сок, вино) снижает желирующую силу — увеличьте дозу на 20-30%.; Не заменяйте желатин агаром 1:1. Обычно требуется 4-5 раз меньше агара."},{"no":7,"name":"Аджика","type":"острая паста, приправа","storage":"Хранить в холодильнике после вскрытия. Неоткрытую можно хранить в прохладном, тёмном месте. Домашнюю сырую аджику нужно хранить только в холодильнике.","roomRaw":"12-24 месяца; 1-2 месяца (в холодильнике); 6-12 месяцев (в стерилизованных банках)","fridgeRaw":"3-6 месяцев","freezerRaw":"","roomH":17520.0,"fridgeH":4380.0,"freezerH":null,"spoilage":"Появление плесени; Неприятный кислый или прогорклый запах; Изменение цвета (потемнение); Расслоение, появление жидкости","notes":"Чем больше соли и уксуса, тем дольше хранится аджика.; Аджику можно заморозить порционно — она хорошо сохраняет вкус.; При изготовлении домашней аджики тщательно стерилизуйте банки."},{"no":8,"name":"Адыгейский","type":"рассольный сыр","storage":"Хранить в рассоле при температуре от +2°C до +6°C.","roomRaw":"Не хранить","fridgeRaw":"7-10 дней после вскрытия","freezerRaw":"Не рекомендуется","roomH":null,"fridgeH":240.0,"freezerH":null,"spoilage":"Появление слизи; Кислый запах; Потеря формы","notes":"Подавать с овощами; Использовать в салатах; Не перебарщивать с солью при приготовлении"},{"no":9,"name":"Айва","type":"фрукт семечковый","storage":"Хранить в прохладном, сухом, темном, хорошо вентилируемом месте. Айва хорошо хранится благодаря твердой текстуре. Можно хранить при комнатной температуре или в холодильнике. Не хранить рядом с другими фруктами (сильный аромат).","roomRaw":"2-3 недели (в прохладном, темном месте); До 3 месяцев (при 0...+2°C, завернутая в бумагу)","fridgeRaw":"1-2 месяца (при 0...+4°C)","freezerRaw":"До 12 месяцев (бланшированные ломтики или пюре)","roomH":504.0,"fridgeH":1460.0,"freezerH":8760.0,"spoilage":"Сморщивание, потеря влаги; Появление темных пятен, которые становятся мягкими; Плесень (часто серая) на поверхности; Неприятный запах (отличный от характерного айвового); Размягчение до состояния кашицы","notes":"Согласно СанПиН, айва выделяет сильный аромат, который может передаваться другим продуктам — храните отдельно.; Айва созревает при хранении — после сбора становится мягче и ароматнее.; Поврежденные плоды портятся быстро — храните только целые, неповрежденные."},{"no":10,"name":"Айран","type":"кисломолочное","storage":"При 2...+6°C","roomRaw":"Не хранить","fridgeRaw":"24 часа","freezerRaw":"Не рекомендуется","roomH":null,"fridgeH":24.0,"freezerH":null,"spoilage":"Резкий кислый запах","notes":"Утоляет жажду"},{"no":11,"name":"Акави","type":"рассольный сыр","storage":"Хранить в прохладном, сухом месте.","roomRaw":"Не хранить","fridgeRaw":"2-3 недели","freezerRaw":"Не рекомендуется","roomH":null,"fridgeH":504.0,"freezerH":null,"spoilage":"Появление плесени; Гнилостный запах; Потеря вкуса","notes":"Нарезать тонкими ломтиками; Подавать с вином; Использовать в салатах"},{"no":12,"name":"Акациевый мёд","type":"мёд","storage":"Хранить в прохладном, сухом, темном месте в герметичной емкости.","roomRaw":"24 месяца","fridgeRaw":"30 месяцев","freezerRaw":"36 месяцев","roomH":17520.0,"fridgeH":21900.0,"freezerH":26280.0,"spoilage":"ферментация; изменение вкуса и запаха","notes":"Акациевый мёд медленнее кристаллизуется, чем большинство других сортов.; Соблюдайте сроки годности и условия хранения, указанные на упаковке производителем."},{"no":13,"name":"Акула мако стейк","type":"рыба морская","storage":"На льду при 0...+2°C","roomRaw":"Не хранить","fridgeRaw":"24 часа","freezerRaw":"До 3 месяцев","roomH":null,"fridgeH":24.0,"freezerH":2190.0,"spoilage":"Аммиачный запах, серость","notes":"Вымачивают в молоке для удаления запаха"},{"no":14,"name":"Алыча","type":"фрукт","storage":"При комнатной температуре до созревания","roomRaw":"2-5 дней","fridgeRaw":"3-5 дней","freezerRaw":"12 месяцев","roomH":120.0,"fridgeH":120.0,"freezerH":8760.0,"spoilage":"Мягкие пятна, плесень, кислый запах","notes":"Богата витамином C и пектином"},{"no":15,"name":"Амарант","type":"псевдозерновая культура","storage":"Содержит жиры, в том числе сквален. Хранить в герметичной таре в холодильнике или морозильнике для предотвращения прогоркания. Свет и тепло — враги.","roomRaw":"3-6 месяцев (в темном прохладном шкафу)","fridgeRaw":"9-12 месяцев","freezerRaw":"До 18 месяцев","roomH":4380.0,"fridgeH":8760.0,"freezerH":13140.0,"spoilage":"Прогорклый запах; Горький вкус; Изменение цвета; Появление насекомых (редко)","notes":"Перед варкой амарант нужно промыть. Варится быстро, 15-20 минут, сильно разваривается и дает гелеобразную текстуру.; Можно проращивать для увеличения питательной ценности.; Амарантовая мука хранится в холодильнике не более 3-4 месяцев."},{"no":16,"name":"Амарант листья","type":"зелень","storage":"В холодильнике во влажном полотенце","roomRaw":"Не более 12 часов","fridgeRaw":"2-3 дня","freezerRaw":"До 6 месяцев (бланшированные)","roomH":12.0,"fridgeH":72.0,"freezerH":4380.0,"spoilage":"Увядание, пожелтение","notes":"Богаты кальцием и железом"},{"no":17,"name":"Амур","type":"Речная рыба","storage":"Хранить в холодильнике при температуре 0-4°C","roomRaw":"Не более 2 часов","fridgeRaw":"1-2 дня","freezerRaw":"6-12 месяцев","roomH":2.0,"fridgeH":48.0,"freezerH":8760.0,"spoilage":"Резкий неприятный запах; Мутные глаза; Вялость и отсутствие упругости мышц","notes":"Мясо амура плотное, белое, без мелких костей, что делает его удобным для приготовления; Рыбные продукты следует хранить отдельно от других продуктов во избежание перекрёстного загрязнения."},{"no":18,"name":"Ананас","type":"тропический фрукт","storage":"Целый ананас хранить при комнатной температуре для дозревания (не дозревает после сбора, но становится слаще). Спелый ананас — в холодильнике. Разрезанный ананас — только в холодильнике в герметичном контейнере.","roomRaw":"2-3 дня (для дозревания), 3-5 дней (спелый)","fridgeRaw":"3-5 дней (при 7-10°C); 3-5 дней (в герметичном контейнере)","freezerRaw":"До 12 месяцев (кусочки в сиропе или сухой заморозкой)","roomH":72.0,"fridgeH":120.0,"freezerH":8760.0,"spoilage":"Появление темных мягких пятен на кожуре; Кислый или спиртовой запах от основания; Мякоть становится водянистой, темнеет; Появление плесени (часто черной) на кожуре или у листьев; Листья легко выдергиваются (перезрелый)","notes":"Согласно СанПиН, ананас выделяет этилен и чувствителен к нему. Храните отдельно от других фруктов.; Спелость можно определить по сладкому аромату у основания и легкому выдергиванию центральных листьев.; Бромелайн разрушается при нагревании выше 70°C."},{"no":19,"name":"Ананасы консервированные","type":"фруктовые консервы","storage":"Хранить в прохладном, сухом месте, вдали от прямых солнечных лучей.","roomRaw":"24 месяца","fridgeRaw":"Не применимо","freezerRaw":"Не применимо","roomH":17520.0,"fridgeH":null,"freezerH":null,"spoilage":"вздутие крышки; посторонний запах; кисловатый вкус; изменение цвета","notes":"После открытия хранить в холодильнике не более 3-х дней; При комнатной температуре Ананасы консервированные дозревает быстрее, в холодильнике — хранится дольше."},{"no":20,"name":"Аннато семена (ачиоте)","type":"специя","storage":"В герметичной таре в темноте","roomRaw":"2-3 года","fridgeRaw":"До 4 лет","freezerRaw":"Не рекомендуется","roomH":26280.0,"fridgeH":35040.0,"freezerH":null,"spoilage":"Потеря цвета, плесень","notes":"Настаивают в масле для окрашивания"},{"no":21,"name":"Апельсин","type":"цитрусовый фрукт","storage":"Хранить в прохладном, сухом, хорошо вентилируемом месте. В холодильнике — в отсеке для фруктов. Благодаря толстой кожуре хранится хорошо. Не хранить в полиэтиленовых пакетах без вентиляции.","roomRaw":"1-2 недели (в прохладном, темном месте)","fridgeRaw":"3-4 недели (при 5-8°C); 2-3 дня (в герметичном контейнере)","freezerRaw":"До 12 месяцев (дольки без кожуры и пленок, в сиропе или сухой заморозкой)","roomH":336.0,"fridgeH":672.0,"freezerH":8760.0,"spoilage":"Кожура становится мягкой, появляются вмятины; Плесень (обычно зеленая или синяя) на поверхности; Кожура выглядит «пустой», отделяется от долек; Неприятный кислый запах, особенно у плодоножки; Сухая, пористая мякоть","notes":"Согласно СанПиН, апельсины выделяют этилен в небольших количествах, но сами к нему устойчивы.; Апельсины с толстой пористой кожурой (пупковые) хранятся лучше, чем с тонкой гладкой.; Не храните апельсины в плотно закрытых пакетах — выделяемая влага вызывает плесень."},{"no":22,"name":"Арбуз","type":"бахчевая культура, ягода","storage":"Целый арбуз хранить при комнатной температуре до разрезания. Разрезанный — только в холодильнике, плотно завернутый в пищевую пленку или в герметичном контейнере. Целые а
