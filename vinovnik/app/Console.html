<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* ==========================================================================
   MON CHEF — работа при пропадании интернета.
   Встаёт между экраном и сервером (google.script.run):

     связи складываются в очередь на устройстве и отправляются сами, как только
     связь вернётся. Время записи — время на устройстве, когда её сделали.
   Ограничение платформы Google: открыть приложение без интернета нельзя —

  var QUEUE = { addJournalEntry: 'Запись журнала', answerJournalCheck: 'Ответ на проверку',

<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINOVNIK</title>
<style>
:root{
  --wine:#6e1423; --wine-d:#4a0c17; --wine-dd:#36080f; --wineghost:#f3e3e1;
  --gold:#b3893f; --gold-l:#e9d6ae; --bg:#f5efe6; --paper:#fffdf9; --ink:#241c17; --muted:#8a7b6a; --line:#eadfcf;
  --green:#2f7d4f; --green-bg:#e3f2e8; --amber:#a86a12; --amber-bg:#fbefd9; --red:#a8231f; --red-bg:#f8e1df;
  --blue:#2f5f9e; --blue-bg:#e2ecf8; --grey-bg:#efebe5;
  --shadow:0 10px 30px -18px rgba(60,30,20,.45); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fffaf2 0,#efe3d0 70%);z-index:50;padding:16px}
.login-card{width:min(360px,100%);text-align:center}
.login-card img{width:190px;max-width:70%}
.login-sub{color:var(--muted);margin:6px 0 18px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wine);display:block}
.pin-dots i.on{background:var(--wine)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto}
.pad button{height:62px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pad button:active{background:var(--wineghost)}
.pad .ghost{background:transparent;border:0;box-shadow:none;font-size:15px;color:var(--muted)}
.login-err{min-height:22px;color:var(--red);margin-top:12px;font-weight:600}

/* ---------- layout ---------- */
#app{display:none;min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:linear-gradient(180deg,var(--wine-d),var(--wine-dd));color:#f6e9e4;display:flex;flex-direction:column;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand img{width:56px;height:56px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.side .brand b{display:block;font:700 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.08em}
.side .brand small{display:block;color:var(--gold-l);font-size:11px;margin-top:3px}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#f1e1dc;padding:9px 12px;border-radius:10px;text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(233,214,174,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side .foot a{color:var(--gold-l);text-decoration:none;display:block;margin:3px 0}
.main{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(255,253,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px}
.burger svg{width:24px;height:24px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search input{border:0;outline:0;flex:1;font:inherit;background:none;min-width:0}
.search svg{width:16px;height:16px;opacity:.5}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.user b{display:block;font-size:13px}
.user small{display:block;color:var(--muted);font-size:12px}
.content{padding:22px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font:700 26px/1.15 Georgia,"Times New Roman",serif;color:var(--wine-d)}
.head .sub{color:var(--muted);margin-top:4px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.wine:before{background:var(--wine)}.kpi.red:before{background:var(--red)}.kpi.green:before{background:var(--green)}.kpi.gold:before{background:var(--gold)}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:700 30px/1.1 Georgia,serif;margin-top:4px}.kpi .v.vw{font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.kpi .h{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rdcard{margin-bottom:16px}.rdcard .ch{display:flex;justify-content:space-between;align-items:center;gap:10px}.rdnote{font-size:12px;color:var(--muted,#7d6b6e);margin:4px 0 8px}.rdrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line,#eadfdc);cursor:pointer}.rdrow:hover{background:rgba(110,20,35,.04)}.rdt{font-weight:650}.rdd{font-size:12px;color:var(--muted,#7d6b6e)}.rdb{font-size:11px;color:var(--red,#a8231f);font-weight:600}.rdmdl{padding:6px 4px}.rdmdl p{margin:8px 0;font-size:14px;word-break:break-word}.rdmdl .btn{display:inline-block;margin-top:8px}.rdft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted,#7d6b6e)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .ch h3{margin:0;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--muted);font-weight:600}

     Сначала появляется бокал, от него раскрываются мозг (влево) и схема (вправо),
     по логотипу проходит золотой блик, выплывает надпись. Затем шкала до 100%. */
  #mcxScreen{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;
    transition:opacity .5s ease;background:#f7f0e5;
    background-image:radial-gradient(120% 80% at 100% -10%,rgba(110,20,35,.10),transparent 55%),
      radial-gradient(90% 60% at -10% 0%,rgba(179,137,63,.14),transparent 50%),
      radial-gradient(60% 50% at 50% 42%,#fffaf1,transparent 70%)}
  #mcxScreen.on{display:flex}
  #mcxScreen.fadeout{opacity:0}
  .mcx-loader{width:100%;max-width:420px;padding:28px;text-align:center}
  .mcx-mark{position:relative;width:min(240px,62vw);aspect-ratio:1/1;margin:0 auto}
  .mcx-mark img,.mcx-glint{position:absolute;inset:0;width:100%;height:100%;display:block}
  .mcx-c{opacity:0;clip-path:inset(0 41% 0 41%);transform:translateY(12px);
    animation:mcxGlass .9s cubic-bezier(.2,.8,.25,1) .15s forwards}
  @keyframes mcxGlass{to{opacity:1;transform:none}}
  .mcx-l{clip-path:inset(0 59% 0 41%);animation:mcxL 1.3s cubic-bezier(.5,.05,.2,1) .85s forwards}
  @keyframes mcxL{to{clip-path:inset(0 59% 0 0)}}
  .mcx-r{clip-path:inset(0 41% 0 59%);animation:mcxR 1.3s cubic-bezier(.5,.05,.2,1) 1s forwards}
  @keyframes mcxR{to{clip-path:inset(0 0 0 59%)}}
  .mcx-parts{position:absolute;inset:0;animation:mcxOut .35s ease 2.45s forwards}
  @keyframes mcxOut{to{opacity:0}}
  .mcx-full{opacity:0;animation:mcxIn .35s ease 2.45s forwards,mcxGlow 2.8s ease-in-out 2.8s infinite}
  @keyframes mcxIn{to{opacity:1}}
  @keyframes mcxGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(179,137,63,0))}50%{filter:drop-shadow(0 0 14px rgba(179,137,63,.45))}}
  .mcx-glint{pointer-events:none;opacity:0;
    background:linear-gradient(105deg,transparent 38%,rgba(255,246,222,.95) 50%,transparent 62%) no-repeat;
    background-size:260% 100%;background-position:160% 0;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
    animation:mcxGlint 1.5s ease-in-out 2.6s forwards,mcxGlintLoop 3.2s ease-in-out 4.4s infinite}
  @keyframes mcxGlint{0%{opacity:1;background-position:160% 0}100%{opacity:1;background-position:-60% 0}}
  @keyframes mcxGlintLoop{0%{opacity:1;background-position:160% 0}45%,100%{opacity:1;background-position:-60% 0}}
  .mcx-word{display:block;width:min(250px,66vw);margin:10px auto 0;opacity:0;transform:translateY(8px);
    animation:mcxUp .8s ease 1.9s forwards}
  @keyframes mcxUp{to{opacity:1;transform:none}}
  .mcx-bar{width:100%;max-width:260px;height:3px;background:rgba(110,20,35,.10);
    border-radius:3px;margin:22px auto 10px;overflow:hidden}
  .mcx-bar-fill{height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#6e1423,#a8323f 55%,#c9a15a);
    transition:width .55s cubic-bezier(.3,.7,.3,1)}
  .mcx-pct{font-size:.76rem;color:#8a7b6a;font-variant-numeric:tabular-nums}
  .mcx-step{font-size:.82rem;color:#6b5a4a;min-height:20px;margin-top:6px;transition:opacity .2s}
  @media (prefers-reduced-motion:reduce){
    .mcx-c,.mcx-l,.mcx-r,.mcx-parts,.mcx-full,.mcx-glint,.mcx-word{animation:none!important}
    .mcx-parts,.mcx-glint{opacity:0}.mcx-full,.mcx-word{opacity:1;transform:none}}

            '<div class="vnwide vnaddm"><input data-k="url" placeholder="Ссылка на фото или видео: Google Диск, YouTube Shorts, Rutube, VK, mp4, jpg"> <select data-k="mtype"><option value="">авто</option><option value="photo">фото</option><option value="video">видео</option></select> ' + vBtn('Добавить ссылку', 'media', m.code) +
            '<label class="btn">Загрузить файл<input type="file" accept="image/*,video/*" data-up="' + esc(m.code) + '" hidden></label></div></div></details>';
        }).join(''));
      }).join('') || '<div class="empty">Меню пусто — добавьте блюда из ТТК ниже.</div>';
      var N = d.notInMenu || [];
      if (N.length) h += vCard('Блюда ТТК, которых нет в меню — ' + N.length, '<div class="vnadd">' + N.map(function (x) { return '<label><input type="checkbox" class="vnadd_c" value="' + esc(x.code) + '"> ' + esc(x.name) + ' <small>' + esc(x.section) + ' · ' + esc(x.station) + (x.price ? ' · ' + vnMoney(x.price) : '') + '</small></label>'; }).join('') + '</div>',
        vBtn('Добавить выбранные', 'addSel', '', true) + ' ' + vBtn('Добавить все', 'addAll'));
      h += vCard('Товар без ТТК (вино, вода, покупной десерт)', vForm([['gn', 'Название — как на складе', 'text', ''], ['gs', 'Раздел', 'text', 'Напитки'], ['gst', 'Станция', 'select', 'Бар', ['Бар', 'Кухня']], ['gp', 'Цена, ₽', 'number', ''], ['gy', 'Порция', 'number', '1'], ['gu', 'Ед. порции', 'select', 'шт', ['шт', 'мл', 'г']]]) +
        '<div class="mvbar">' + vBtn('Добавить товар', 'addGoods', '', true) + '</div><div class="dnote">Порция 150 мл — бокал вина: при закрытии счёта со склада спишется 150 мл бутылки. «шт» — бутылка или упаковка целиком.</div>');
      h += vCard('Страница для гостей', vForm([['sn', 'Название', 'text', S.name], ['ssub', 'Подпись', 'text', S.subtitle], ['sph', 'Телефон', 'tel', S.phone], ['sad', 'Адрес', 'text', S.address], ['so', 'Открытие', 'time', S.open], ['scl', 'Закрытие', 'time', S.close],
        ['sbm', 'Бронь, мин по умолчанию', 'number', S.bookDur], ['scm', 'Норма приготовления, мин', 'number', S.serviceTime], ['sgb', 'Заявки на бронь с QR-меню', 'check', S.guestBooking], ['shs', 'Скрывать позиции в стопе', 'check', S.hideStop]]) + '<div class="mvbar">' + vBtn('Сохранить настройки', 'saveS', '', true) + '</div>');
      vBody(h);
      [].forEach.call(document.querySelectorAll('input[data-up]'), function (inp) { inp.onchange = function () { VIEWS.vnmenu.h.upload(inp.getAttribute('data-up'), inp); }; });
    },
    val: function (code, k) { var box = document.querySelector('.vnmf[data-c="' + code + '"]'), e = box && box.querySelector('[data-k="' + k + '"]'); return !e ? undefined : e.type === 'checkbox' ? e.checked : e.value; },
    saveI: function (a, btn) {
      var g = function (k) { return VIEWS.vnmenu.h.val(a, k); };
      vDo(btn, 'vnMenuSave', [JSON.stringify({ items: [{ code: a, price: g('price'), section: g('section'), station: g('station'), yield: g('yield'), yieldUnit: g('yieldUnit'), order: g('order'), byWeight: g('byWeight'), per: g('per'), guest: g('guest'), desc: g('desc'), tags: g('tags') }] })], 'Сохранено', function () { VIEWS.vnmenu.h.load(); });
    },
    addSel: function (a, btn) { var c = [].map.call(document.querySelectorAll('.vnadd_c:checked'), function (x) { return x.value; }); if (!c.length) { vMsg('Отметьте блюда', 'err'); return; } vDo(btn, 'vnMenuSync', [JSON.stringify({ codes: c })], function (d) { return 'Добавлено в меню: ' + d.added; }, function () { VIEWS.vnmenu.h.load(); }); },
    addAll: function (a, btn) { vDo(btn, 'vnMenuSync', [JSON.stringify({ all: true })], function (d) { return 'Добавлено в меню: ' + d.added; }, function () { VIEWS.vnmenu.h.load(); }); },
    addGoods: function (a, btn) { vDo(btn, 'vnMenuSave', [JSON.stringify({ items: [{ code: 'G-' + Date.now().toString(36).toUpperCase(), kind: 'GOODS', name: vV('gn'), section: vV('gs'), station: vV('gst'), price: vV('gp'), yield: vV('gy'), yieldUnit: vV('gu') }] })], 'Товар добавлен в меню', function () { VIEWS.vnmenu.h.load(); }); },
    media: function (a, btn) { var u = VIEWS.vnmenu.h.val(a, 'url'), t = VIEWS.vnmenu.h.val(a, 'mtype'); if (!u) { vMsg('Вставьте ссылку', 'err'); return; } vDo(btn, 'vnMediaAdd', [JSON.stringify({ code: a, url: u, type: t })], 'Добавлено', function () { VIEWS.vnmenu.h.load(); }); },
    upload: function (code, inp) {
      var f = inp.files && inp.files[0]; if (!f) return;
      if (f.size > 40 * 1024 * 1024) { vMsg('Файл больше 40 МБ — загрузите видео на Google Диск или YouTube и добавьте ссылкой', 'err'); return; }
      vMsg('Загружаю ' + f.name + '…');
      var rd = new FileReader(); rd.onload = function () { vDo(null, 'vnMediaUpload', [JSON.stringify({ code: code, name: f.name, mime: f.type, b64: String(rd.result) })], function (d) { return 'Загружено' + (d.warn ? '. ' + d.warn : ''); }, function () { VIEWS.vnmenu.h.load(); }); };
      rd.readAsDataURL(f);
    },
    mRm: function (a, btn) { var p = String(a).split('|'); vDo(btn, 'vnMediaRemove', [JSON.stringify({ code: p[0], index: +p[1] })], 'Убрано из ленты (файл на Диске остался)', function () { VIEWS.vnmenu.h.load(); }); },
    mCover: function (a, btn) { var p = String(a).split('|'); vDo(btn, 'vnMediaRemove', [JSON.stringify({ code: p[0], index: +p[1], cover: true })], 'Обложка изменена', function () { VIEWS.vnmenu.h.load(); }); },
    saveS: function (a, btn) { vDo(btn, 'vnSettings', [JSON.stringify({ name: vV('sn'), subtitle: vV('ssub'), phone: vV('sph'), address: vV('sad'), open: vV('so'), close: vV('scl'), bookMin: vV('sbm'), cookMin: vV('scm'), guestBooking: vV('sgb'), hideStop: vV('shs') })], 'Настройки сохранены', function () { VIEWS.vnmenu.h.load(); }); }
  }
};

/* ---------- QR-коды меню ---------- */
VIEWS.vnqr = {
  title: 'QR-коды меню',
  sub: 'Общий QR для входа и витрины и отдельный QR на каждый стол (гость видит номер стола, заявка на бронь помечается столом). Распечатайте и поставьте на столы.',
  acts: [['Печать', 'print'], ['Обновить', 'load']],
  open: function () { this.h.load(); },
  h: {
    load: function () { var V = VIEWS.vnqr; vLoading(); vCall('vnQrData', []).then(function (r) { var e = vErr(r); if (e) { vMsg(e, 'err'); vBody(''); return; } V._d = vData(r) || {}; V.h.draw(); }); },
    draw: function () {
      var d = VIEWS.vnqr._d || {}, base = d.menuUrl || '';
      if (!base) { vBody('<div class="empty">Адрес веб-приложения неизвестен: QR появится после публикации (установщик публикует веб-приложение сам).</div>'); return; }
      var L = [{ t: '', l: 'Меню — общий' }].concat((d.tables || []).map(function (t) { return { t: t.table, l: 'Стол ' + t.table }; }));
      vBody('<div class="dnote">Адрес меню: <a href="' + esc(base) + '" target="_blank" rel="noopener">' + esc(base) + '</a></div><div class="vnqrs" id="vnqrs">' + L.map(function (x, i) {
        return '<div class="vnqr"><div class="vnqrn">' + esc((d.settings || {}).name || 'VINOVNIK') + '</div><div class="vnqrc" id="qr_' + i + '" data-u="' + esc(base + (x.t ? '&t=' + encodeURIComponent(x.t) : '')) + '"></div><b>' + esc(x.l) + '</b><small>Наведите камеру — меню, фото и видео блюд, бронь стола</small></div>';
      }).join('') + '</div>');
      VIEWS.vnqr.h.render();
    },
    render: function () {
      var go = function () { [].forEach.call(document.querySelectorAll('.vnqrc'), function (el) { el.innerHTML = ''; try { new QRCode(el, { text: el.getAttribute('data-u'), width: 168, height: 168, colorDark: '#4a0c17', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { el.innerHTML = '<a href="' + esc(el.getAttribute('data-u')) + '">ссылка</a>'; } }); };
      if (window.QRCode) { go(); return; }
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = go; s.onerror = function () { [].forEach.call(document.querySelectorAll('.vnqrc'), function (el) { el.innerHTML = '<div class="dnote">QR не построен (нет связи с библиотекой) — ссылка: <a href="' + esc(el.getAttribute('data-u')) + '">открыть</a></div>'; }); };
      document.head.appendChild(s);
    },
    print: function () { document.body.classList.add('vnprint'); setTimeout(function () { window.print(); document.body.classList.remove('vnprint'); }, 100); }
  }
};
</script>

function pwEv(id) { var f = null; (PW.week.days || []).forEach(function (d) { d.events.forEach(function (e) { if (String(e.id) === String(id)) f = e; }); }); return f; }
function pwTtkLines(lines, lvl) {
  return lines.map(function (l) {
    var row = '<tr' + (l.pf ? ' class="pf"' : '') + '><td style="padding-left:' + (6 + lvl * 16) + 'px">' + (lvl ? '↳ ' : '') + esc(l.name) + (l.pf ? ' <span class="chip a" style="font-size:10px">п/ф</span>' : '') + (l.doubled ? ' <span class="chip r" style="font-size:10px">состав задвоен</span>' : '') + '</td><td class="n">' + pwQ(l.brutto, l.unit) + '</td><td class="n">' + pwQ(l.netto, l.unit) + '</td></tr>';
    return row + (l.sub ? pwTtkLines(l.sub, lvl + 1) : '');
  }).join('');
}
function pwWeekDraw(box) {
  var w = PW.week, h = '';
  h += '<div class="ebar" style="flex-wrap:wrap;align-items:center;margin-bottom:10px"><button class="btn" onclick="pwWeekGo(-1)">← Неделя</button><b style="margin:0 8px">' + esc(bqDate(w.from)) + ' — ' + esc(bqDate(w.to)) + '</b><button class="btn" onclick="pwWeekGo(1)">Неделя →</button>' +
    (PW.off ? '<button class="btn" onclick="PW.off=0;pwWeekGo(0)">Текущая</button>' : '') + '<span class="lblr" style="margin-left:auto">банкетов ' + w.totals.events + ' · порций ' + n2(w.totals.portions) + '</span></div>';
  h += '<div class="pwdays">' + w.days.map(function (d) {
    return '<div class="pwday' + (d.date === w.today ? ' today' : '') + '"><div class="pwdh"><b>' + pwDay(d.date) + '</b><span>' + esc(bqDate(d.date)) + '</span></div>' +
      (d.events.length ? d.events.map(function (e) { return '<div class="pwevr' + (PW.sel === String(e.id) ? ' on' : '') + '" onclick="pwSel(\'' + esc(e.id) + '\')"><span><b>' + esc(e.name) + '</b><small>' + esc([e.time, e.place, e.guests ? e.guests + ' гост.' : ''].filter(Boolean).join(' · ')) + '</small></span><span class="chip">' + n2(e.portions) + ' порц.</span></div>'; }).join('') : '<div class="pwnone">нет банкетов</div>') + '</div>';
  }).join('') + '</div>';
  var selEv = PW.sel ? pwEv(PW.sel) : null;
  if (selEv) h += '<div class="card pwsel" id="pwSelCard">' + pwEvHtml(selEv) + '</div>';
  if (w.weekPfFromStock.length) h += '<div class="warn" style="background:#eaf3ec;border-color:#bfe0c8;color:#245c3d">✓ Учтён готовый п/ф со склада: ' + w.weekPfFromStock.map(function (p) { return esc(p.name) + ' — ' + p.qty + ' ' + esc(p.unit); }).join(', ') + '</div>';
  h += '<div class="lblrow"><span>Закупка на неделю</span><span class="lblr">все банкеты недели по ТТК · ' + w.weekPurchase.length + ' поз.</span></div>';
  h += w.weekPurchase.length ? '<details class="draw"><summary>Показать список</summary><table class="bqt"><tbody>' + w.weekPurchase.map(function (p) { return '<tr><td>' + esc(p.name) + '</td><td class="n">' + n2(p.qty) + ' ' + esc(p.unit) + '</td></tr>'; }).join('') + '</tbody></table></details>' +
    '<div class="ebar"><button class="btn" onclick="pwWeekXls(this)">⬇ Закупка на неделю в Excel</button></div>' : '<div class="empty">На этой неделе банкетов с ТТК нет</div>';
  h += '<div class="lblrow"><span>Заявка на закупку</span><span class="lblr">потребность − остаток склада + минимальный запас</span></div>';
  h += w.purchaseRequest.length ? '<table class="bqt"><thead><tr><th>Продукт</th><th class="n">Купить</th><th class="n hm">На складе</th><th class="n hm">Мин. запас</th><th class="hm">Почему</th></tr></thead><tbody>' + w.purchaseRequest.map(function (p) {
    return '<tr class="buy"><td>' + esc(p.name) + '</td><td class="n"><b>' + n2(p.qty) + ' ' + esc(p.unit) + '</b></td><td class="n hm">' + n2(p.stock.qty) + ' ' + esc(p.stock.unit) + '</td><td class="n hm">' + (p.min ? n2(p.min.qty) + ' ' + esc(p.min.unit) : '—') + '</td><td class="hm">' + esc(p.reason) + '</td></tr>';
  }).join('') + '</tbody></table><div class="ebar"><button class="btn" onclick="pwReqXls(this)">⬇ Заявку в Excel</button></div>' : '<div class="empty">✓ На складе достаточно продуктов для всех банкетов недели (с учётом минимального запаса)</div>';
  box.innerHTML = '<div class="pwwrap">' + h + '</div>';
}
function pwEvHtml(e) {
  var id = esc(e.id);
  return '<div class="pwselh"><h3>' + esc(e.name) + ' · ' + esc(pwDay(e.raw.date)) + ', ' + esc(bqDate(e.raw.date)) + '</h3><span><span class="chip">' + n2(e.portions) + ' порц.</span> <button class="btn" onclick="pwSel(\'' + id + '\')">Свернуть</button></span></div>' +
    '<div class="sub">' + esc([e.time, e.place, e.guests ? e.guests + ' гостей' : ''].filter(Boolean).join(' · ')) + '</div>' +
    '<div class="pwevb">' + (e.contact ? '<div class="sub">☎ ' + esc(e.contact) + '</div>' : '') + (e.comment ? '<div class="sub">✎ ' + esc(e.comment) + '</div>' : '') +
    (e.missing.length ? '<div class="warn">Без ТТК (в расчёт не вошли): ' + esc(e.missing.join(', ')) + '</div>' : '') +
    '<div class="ebar" style="flex-wrap:wrap"><button class="btn" onclick="openBanquet(\'' + id + '\')">Карточка и заказ</button><button class="btn" onclick="pwEvXls(\'' + id + '\',this)">⬇ Excel</button><button class="btn" onclick="pwEvTtk(\'' + id + '\',this)">📋 ТТК на Диск</button>' +
    (PW.week.canConsume ? '<button class="btn" onclick="pwConsume(\'' + id + '\',this)" title="Снять резерв и списать продукты со склада по факту производства">✅ Списать по факту</button>' : '') +
    (e.blank ? '<a class="btn" href="' + esc(e.blank) + '" target="_blank">📄 Бланк</a>' : '') + '</div>' +
    '<div class="lblrow"><span>Меню</span><span class="lblr">' + e.menu.length + ' блюд</span></div>' + e.menu.map(function (m) { return '<div class="irow' + (m.found ? ' clk' : '') + '"' + (m.found ? ' onclick="openDish(\'' + esc(m.code) + '\',' + (Number(m.qty) || 1) + ')"' : '') + '><span>' + esc(m.name) + (m.out ? '<small>выход ' + n2(m.out) + ' ' + esc(m.outUnit) + '</small>' : '') + '</span><b>' + n2(m.qty) + ' порц.</b></div>'; }).join('') +
    '<div class="lblrow"><span>ТТК на банкет</span><span class="lblr">состав × порции; п/ф раскрыты по своей карте</span></div>' + e.ttk.map(function (t) {
      return '<details class="draw"><summary>' + esc(t.name) + ' — ' + n2(t.qty) + ' порц.' + (t.doubled ? ' <span class="chip r">состав задвоен</span>' : '') + '</summary>' + (t.doubled ? '<div class="warn">Состав карты записан дважды подряд — сырьё удвоено. Исправьте карту (новая версия ТТК).</div>' : '') + '<table class="bqt"><thead><tr><th>Ингредиент</th><th class="n">Брутто</th><th class="n">Нетто</th></tr></thead><tbody>' + pwTtkLines(t.lines, 0) + '</tbody></table></details>';
    }).join('') +
    '<div class="lblrow"><span>Закупка на банкет</span><span class="lblr">сырьё по ТТК · ' + e.purchase.length + ' поз.</span></div>' +
    (e.pfFromStock.length ? '<div class="sub">✓ готовые п/ф со склада: ' + e.pfFromStock.map(function (p) { return esc(p.name) + ' ' + n2(p.qty) + ' ' + esc(p.unit); }).join(', ') + '</div>' : '') +
    '<table class="bqt"><tbody>' + e.purchase.map(function (p) { return '<tr><td>' + esc(p.name) + '</td><td class="n">' + n2(p.qty) + ' ' + esc(p.unit) + '</td></tr>'; }).join('') + '</tbody></table></div>';
}
function pwEvXls(id, btn) {
  var e = pwEv(id); if (!e) return;
  var blank = [['Поле', 'Значение'], ['Формат', e.name], ['Дата', bqDate(e.raw.date)], ['Время', e.time], ['Зал / место', e.place], ['Гостей', e.guests], ['Контакт', e.contact], ['Пожелания', e.comment], ['', ''], ['Позиция', 'Порций']]
    .concat(e.menu.map(function (m) { return [m.name, m.qty]; }));
  var ttk = [['Блюдо', 'Порций', 'Ингредиент', 'Брутто', 'Нетто', 'Ед.']];
  e.ttk.forEach(function (t) { (function rec(lines, lvl) { lines.forEach(function (l) { ttk.push([t.name, t.qty, (lvl ? '↳ ' : '') + l.name, l.brutto, l.netto, l.unit]); if (l.sub) rec(l.sub, lvl + 1); }); })(t.lines, 0); });
  pwExport('Банкет ' + e.name + ' ' + bqDate(e.raw.date), { 'Бланк банкета': blank, 'ТТК на банкет': ttk, 'Закупка': [['Продукт', 'Кол-во', 'Ед.']].concat(e.purchase.map(function (p) { return [p.name, p.qty, p.unit]; })) }, btn);
}
function pwEvTtk(id, btn) {
  var e = pwEv(id); if (!e) return;
  var old = btn.textContent; btn.disabled = true; btn.textContent = '… формирую ТТК';
  run('exportTTKBanquet', [JSON.stringify(e.raw), JSON.stringify(e.ttkAgg), TOKEN], function (x) {
    btn.disabled = false; btn.textContent = old; var j = pwJ(x);
    if (!j || j.error || j.success === false || !j.url) { alert('ТТК не сформирована: ' + pwMsg(j)); return; }
    window.open(j.url, '_blank');
  }, function (er) { btn.disabled = false; btn.textContent = old; alert(String(er && er.message || er)); });
}
function pwConsume(id, btn) {
  if (!confirm('Списать продукты этого банкета со склада по факту производства?\n\nРезерв снимется, вместо него появится реальный расход. Действие попадёт в журнал операций и аудит.')) return;
  var old = btn.textContent; btn.disabled = true; btn.textContent = '… списываю';
  run('consumeEventReservations', [id, TOKEN], function (x) {
    btn.disabled = false; btn.textContent = old; var j = pwJ(x);
    if (!pwOk(j)) { alert('Не списано: ' + pwMsg(j)); return; }
    alert('Списано позиций: ' + ((j.data && j.data.consumed) || 0)); PW.week = null; var b = pwBox(); if (b) PANELS.week(b);
  }, function (er) { btn.disabled = false; btn.textContent = old; alert(String(er && er.message || er)); });
}
function pwWeekXls(btn) {
  var w = PW.week, byDay = [['Дата', 'Банкет', 'Время', 'Гостей', 'Порций']];
  w.days.forEach(function (d) { d.events.forEach(function (e) { byDay.push([bqDate(d.date), e.name, e.time, e.guests, e.portions]); }); });
  pwExport('Закупка на неделю ' + bqDate(w.from) + '–' + bqDate(w.to), { 'Закупка на неделю': [['Продукт', 'Кол-во', 'Ед.']].concat(w.weekPurchase.map(function (p) { return [p.name, p.qty, p.unit]; })), 'Банкеты недели': byDay }, btn);
}
function pwReqXls(btn) {
  var w = PW.week;
  pwExport('Заявка на закупку ' + bqDate(w.from) + '–' + bqDate(w.to), { 'Заявка': [['Продукт', 'Купить', 'Ед.', 'На складе', 'Мин. запас', 'Почему']].concat(w.purchaseRequest.map(function (p) {
    return [p.name, p.qty, p.unit, p.stock.qty + ' ' + p.stock.unit, p.min ? p.min.qty + ' ' + p.min.unit : '', p.reason]; })) }, btn);
}

</script>
