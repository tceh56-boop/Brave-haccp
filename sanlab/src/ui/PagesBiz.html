<script>
/* San.Lab — клиенты, финансы, документы, аналитика, сотрудники, настройки, аудит */

/* ---------- Клиенты и объекты ---------- */
var CLIENT_FIELDS = [
  { name: 'legal_name', label: 'Наименование', required: true, full: true, placeholder: 'ООО «…»' }, { name: 'inn', label: 'ИНН', inputmode: 'numeric' },
  { name: 'status', label: 'Статус', type: 'select', options: [], value: 'ACTIVE' }, { name: 'contact_person', label: 'Контактное лицо' }, { name: 'contact_phone', label: 'Телефон', type: 'tel' },
  { name: 'contact_email', label: 'E-mail', type: 'email' }, { name: 'manager_id', label: 'Ответственный менеджер', type: 'select', options: [] },
  { name: 'legal_address', label: 'Юридический адрес', full: true }, { name: 'notes', label: 'Заметки', type: 'textarea' }];
function clientFields() {
  return CLIENT_FIELDS.map(function (f) { var c = {}; for (var k in f) c[k] = f[k]; if (c.name === 'status') c.options = dictOpts(S.lk.dict.client); if (c.name === 'manager_id') c.options = S.lk.employees.filter(function (e) { return e.active && ['OWNER', 'COORDINATOR'].indexOf(e.role) >= 0; }).map(function (e) { return [e.id, e.name]; }); return c; });
}
function reloadLookups() { return call('lookups.get').then(function (l) { S.lk = l; }); }
Pages.clients = {
  title: 'Клиенты и объекты',
  load: function (p) { return call('clients.list', { q: p.q, includeArchived: p.arch }); },
  sub: function (d) { return d.length + ' ' + plural(d.length, 'клиент', 'клиента', 'клиентов'); },
  view: function (d, p) {
    var adm = ['OWNER', 'COORDINATOR'].indexOf(S.me.role) >= 0, fin = d.length && d[0].debt !== undefined;
    return '<div class="filters"><input class="inp" style="min-width:240px" placeholder="Название, ИНН, контакт" value="' + esc(p.q || '') + '" data-enter="clQ"><label class="chips" style="padding:3px 8px"><input type="checkbox" data-c="clArch"' + (p.arch ? ' checked' : '') + '> Показать архив</label><div style="flex:1"></div>' + (adm ? '<button class="btn pri" data-a="clientNew">' + ic('plus') + 'Создать клиента</button>' : '') + '</div>' +
      '<section class="card"><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Клиент</th><th>ИНН</th><th>Контакт</th><th class="r">Объекты</th><th>Менеджер</th>' + (fin ? '<th class="r">Долг</th>' : '') + '<th>Статус</th></tr></thead><tbody>' +
      (d.length ? d.map(function (c) {
        return '<tr class="click" ' + link('client', { client_id: c.client_id }) + '><td><b>' + esc(c.legal_name) + '</b><span class="t2 mono">' + c.client_id + '</span></td><td class="mono">' + esc(c.inn || '—') + '</td><td>' + esc(c.contact_person || '—') + '<span class="t2">' + esc(c.contact_phone || '') + '</span></td><td class="r">' + c.sites_count + '</td><td>' + esc(shortName(c.manager_name)) + '</td>' +
          (fin ? '<td class="r num">' + (c.debt ? '<b>' + money(c.debt) + '</b>' : '<span class="muted">—</span>') + '</td>' : '') + '<td>' + pill(S.lk.dict.client[c.status], c.status === 'ACTIVE' ? 'ok' : 'mute') + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="empty">Клиентов не найдено</td></tr>') + '</tbody></table></div></section>';
  }
};
A.clQ = function (el) { S.params.q = el.value; render(true); };
A.clArch = function (el) { S.params.arch = el.checked; render(true); };
A.clientNew = function (el, ev, cur) {
  openForm({ title: cur ? 'Клиент ' + cur.client_id : 'Новый клиент', fields: clientFields(), values: cur || { status: 'ACTIVE', manager_id: S.me.employee_id }, wide: true,
    intro: cur ? '' : '<div class="alert small">Система присвоит ID, проверит дубли по ИНН и названию и создаст папку клиента в Drive.</div>',
    submit: function (v) { if (cur) { v.client_id = cur.client_id; v.row_version = cur.row_version; } return call('clients.save', v); },
    done: function (c) { reloadLookups().then(function () { toast('Сохранено: ' + c.client_id, 'ok'); go('client', { client_id: c.client_id }, { noPush: !!cur }); }); } });
};
Pages.client = {
  menu: 'clients',
  title: function (p, d) { return d ? d.client.legal_name : 'Клиент'; },
  sub: function (d) { return d.client.client_id + (d.client.inn ? ' · ИНН ' + d.client.inn : ''); },
  load: function (p) { return call('clients.get', { client_id: p.client_id }); },
  view: function (d) {
    var c = d.client, adm = ['OWNER', 'COORDINATOR'].indexOf(S.me.role) >= 0;
    var sites = '<div class="list">' + (d.sites.length ? d.sites.map(function (s) {
      return '<div class="li"><span class="sev ' + (String(s.active) === 'false' ? '' : 'ok') + '"></span><div class="txt"><b>' + esc(s.site_name) + '</b> <span class="mono muted small">' + s.site_id + '</span><div class="t2">' + esc(s.address) + '</div><div class="t2">' + esc(s.contact_name || '') + ' ' + esc(s.contact_phone || '') + (s.service_frequency ? ' · ' + esc(s.service_frequency) : '') + (s.drive_folder_id ? ' · папка Drive ✓' : ' · <span style="color:var(--bad)">папка не создана</span>') + '</div></div>' +
        (adm && String(s.active) !== 'false' ? '<button class="btn sm" data-a="visitFromSite" data-id="' + s.site_id + '">Выезд</button><button class="btn sm" data-a="siteEdit" data-id="' + s.site_id + '">Изменить</button>' : '') + '</div>';
    }).join('') : emptyLine('Объектов нет')) + '</div>';
    var contracts = d.contracts.length ? '<div class="list">' + d.contracts.map(function (k) { return '<div class="li"><span class="sev ' + (k.status === 'ACTIVE' ? 'ok' : '') + '"></span><div class="txt"><b>№ ' + esc(k.number) + '</b> · ' + esc(S.lk.dict.contract[k.status]) + '<div class="t2">' + fD(k.start_date) + ' — ' + fD(k.end_date) + (k.amount ? ' · ' + money(k.amount) : '') + '</div><div class="t2">' + esc(k.terms) + '</div></div>' + (adm ? '<button class="btn sm" data-a="contractEdit" data-id="' + k.contract_id + '">Изменить</button>' : '') + '</div>'; }).join('') + '</div>' : emptyLine('Договоров нет');
    var fin = d.finance ? '<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + kpi('Начислено', money(d.finance.accrued)) + kpi('Оплачено', money(d.finance.paid)) + kpi('Выставлено счетов', money(d.finance.invoiced)) + kpi('Задолженность', money(d.finance.debt), '', d.finance.debt ? 'warn' : 'good') + '</div>' : '';
    return '<div class="row"><button class="back" data-a="back">' + ic('back') + 'Назад</button><div style="flex:1"></div>' + (adm ? '<button class="btn" data-a="clientEdit">Изменить</button><button class="btn" data-a="siteNew">' + ic('plus') + 'Объект</button><button class="btn" data-a="contractNew">' + ic('plus') + 'Договор</button>' + (c.status !== 'ARCHIVED' ? '<button class="btn danger" data-a="clientArchive">В архив</button>' : '') : '') + '</div>' +
      '<div class="grid g-main"><div class="stack" style="gap:16px">' + card('Объекты', sites) + card('Выезды', d.visits.length ? '<div class="list">' + d.visits.slice(0, 15).map(function (v) { return visitLi(v, { day: true }); }).join('') + '</div>' : emptyLine('Выездов не было')) + '</div>' +
      '<div class="stack" style="gap:16px">' + card('Реквизиты', '<dl class="kv"><dt>Статус</dt><dd>' + pill(S.lk.dict.client[c.status], c.status === 'ACTIVE' ? 'ok' : 'mute') + '</dd><dt>ИНН</dt><dd class="mono">' + esc(c.inn || '—') + '</dd><dt>Контакт</dt><dd>' + esc(c.contact_person || '—') + '<br>' + esc(c.contact_phone || '') + ' ' + esc(c.contact_email || '') + '</dd><dt>Адрес</dt><dd>' + esc(c.legal_address || '—') + '</dd><dt>Папка Drive</dt><dd>' + (c.drive_folder_id ? 'создана' : '—') + '</dd>' + (c.notes ? '<dt>Заметки</dt><dd>' + esc(c.notes) + '</dd>' : '') + '</dl>') +
      (S.me.role !== 'SPECIALIST' ? card('Договоры', contracts) : '') + (fin ? card('Расчёты', fin) : '') +
      (d.documents.length ? card('Документы', '<div class="list">' + d.documents.map(docLi).join('') + '</div>') : '') + '</div></div>';
  }
};
A.clientEdit = function () { A.clientNew(null, null, S.data.client); };
A.clientArchive = function () {
  openForm({ title: 'Перевести клиента в архив', okTone: 'danger', okText: 'В архив', intro: '<div class="alert small">Запись не удаляется: история выездов, документов и расчётов сохраняется.</div>', fields: [{ name: 'reason', label: 'Причина', type: 'textarea', required: true }],
    submit: function (v) { return call('clients.archive', { client_id: S.data.client.client_id, reason: v.reason }); }, done: function () { render(true); } });
};
function siteFields(clientId) {
  return [{ name: 'site_name', label: 'Название объекта', required: true }, { name: 'address', label: 'Адрес', required: true }, { name: 'contact_name', label: 'Контакт на объекте' }, { name: 'contact_phone', label: 'Телефон', type: 'tel' },
    { name: 'service_frequency', label: 'Периодичность обслуживания', placeholder: '2 раза в месяц' }, { name: 'contract_id', label: 'Договор', type: 'select', options: S.lk.contracts.filter(function (k) { return k.client_id === clientId; }).map(function (k) { return [k.id, '№ ' + k.number]; }) },
    { name: 'service_ids', label: 'Услуги по объекту', type: 'checks', full: true, options: S.lk.services.filter(function (s) { return s.active; }).map(function (s) { return [s.id, s.name]; }) },
    { name: 'instructions', label: 'Особенности объекта', type: 'textarea', placeholder: 'Пропускной режим, санитарный день, парковка' }];
}
A.siteNew = function (el, ev, cur) {
  var cid = S.data.client.client_id;
  openForm({ title: cur ? 'Объект ' + cur.site_id : 'Новый объект', wide: true, fields: siteFields(cid), values: cur || {},
    submit: function (v) { v.client_id = cid; if (cur) { v.site_id = cur.site_id; v.row_version = cur.row_version; v.active = cur.active; } return call('sites.save', v); },
    done: function (s) { reloadLookups().then(function () { toast('Объект ' + s.site_id + ' сохранён' + (s.drive_folder_id ? ', папка Drive создана' : ''), 'ok'); render(true); }); } });
};
A.siteEdit = function (el) { var s = S.data.sites.filter(function (x) { return x.site_id === el.getAttribute('data-id'); })[0]; A.siteNew(el, null, s); };
A.visitFromSite = function (el) { var s = siteById(el.getAttribute('data-id')); A.visitNew(el, null, { client_id: s.client_id, site_id: s.id }); };
A.contractNew = function (el, ev, cur) {
  var cid = S.data.client.client_id;
  openForm({ title: cur ? 'Договор № ' + cur.number : 'Новый договор', fields: [{ name: 'number', label: 'Номер', required: true }, { name: 'status', label: 'Статус', type: 'select', options: dictOpts(S.lk.dict.contract), value: 'ACTIVE' }, { name: 'start_date', label: 'Начало', type: 'date', required: true }, { name: 'end_date', label: 'Окончание', type: 'date' }, { name: 'amount', label: 'Сумма по договору, ₽', type: 'number' }, { name: 'terms', label: 'Условия', type: 'textarea' }],
    values: cur || { start_date: new Date().toISOString() },
    submit: function (v) { v.client_id = cid; if (cur) { v.contract_id = cur.contract_id; v.row_version = cur.row_version; } return call('contracts.save', v); },
    done: function () { reloadLookups().then(function () { toast('Договор сохранён', 'ok'); render(true); }); } });
};
A.contractEdit = function (el) { A.contractNew(el, null, S.data.contracts.filter(function (x) { return x.contract_id === el.getAttribute('data-id'); })[0]); };

/* ---------- Финансы ---------- */
Pages.finance = {
  title: 'Финансы',
  load: function (p) {
    var tab = p.tab || 'summary';
    var from = p.from || startOfDayIso(-30), to = p.to || startOfDayIso(1);
    if (tab === 'summary' || tab === 'unbilled') return call('finance.summary', { from: from, to: to }).then(function (s) { return { tab: tab, s: s }; });
    var q = { q: p.q };
    if (tab === 'invoices') q.operation_type = 'INVOICE';
    if (tab === 'expenses') q.operation_type = 'EXPENSE';
    return call('finance.list', q).then(function (r) { return { tab: tab, r: r }; });
  },
  view: function (d, p) {
    var tabs = [['summary', 'Сводка'], ['invoices', 'Счета'], ['ops', 'Все операции'], ['expenses', 'Расходы'], ['unbilled', 'Не начислено']];
    var canEdit = ['OWNER', 'FINANCE'].indexOf(S.me.role) >= 0 || (S.me.menu.indexOf('finance') >= 0 && false);
    var h = '<div class="filters"><div class="chips">' + tabs.map(function (t) { return '<button class="' + (d.tab === t[0] ? 'on' : '') + '" data-a="vf" data-k="tab" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div><div style="flex:1"></div>' +
      (canEdit ? ['accrue', 'invoice', 'payment', 'expense', 'adjust'].map(function (k) { return '<button class="btn sm' + (k === 'payment' ? ' pri' : '') + '" data-a="finOp" data-op="' + k + '">' + { accrue: 'Начисление', invoice: 'Счёт', payment: 'Поступление', expense: 'Расход', adjust: 'Корректировка' }[k] + '</button>'; }).join('') : '') + '</div>';
    if (d.tab === 'summary') return h + Pages.finance.summary(d.s);
    if (d.tab === 'unbilled') return h + card('Утверждённые выезды без начисления', d.s.unbilled_visits.length ? '<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Выезд</th><th>Клиент</th><th>Услуга</th><th class="r">Цена</th><th></th></tr></thead><tbody>' + d.s.unbilled_visits.map(function (u) {
      return '<tr><td><span class="mono">' + u.visit_id + '</span><span class="t2">' + fD(u.date) + '</span></td><td>' + esc(u.client_name) + '<span class="t2">' + esc(u.site_name) + '</span></td><td>' + esc(u.service_name) + '</td><td class="r num">' + money(u.price) + '</td><td>' + (canEdit ? '<button class="btn sm" data-a="finAccrueVisit" data-id="' + u.visit_id + '">Начислить</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : emptyLine('Все утверждённые выезды начислены'));
    var rows = d.r.rows;
    return h + '<section class="card"><header><input class="inp" placeholder="Клиент, номер счёта, основание" value="' + esc(p.q || '') + '" data-enter="finQ"><div class="grow"></div><span class="small muted">' + rows.length + ' ' + plural(rows.length, 'операция', 'операции', 'операций') + '</span></header><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Дата</th><th>Операция</th><th>Клиент</th><th>Основание</th><th class="r">Сумма</th>' + (d.tab === 'invoices' ? '<th class="r">Оплачено</th><th class="r">Остаток</th>' : '') + '<th>Статус</th><th></th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (f) {
        var neg = f.operation_type === 'EXPENSE' || (f.operation_type === 'ADJUSTMENT' && f.amount < 0);
        var act = '';
        if (canEdit && f.operation_type === 'INVOICE' && f.outstanding > 0) act = '<button class="btn sm" data-a="finPay" data-id="' + f.finance_id + '">Оплата</button>';
        if (S.me.role === 'OWNER' && f.operation_type === 'ADJUSTMENT' && f.payment_status === 'PENDING') act = '<button class="btn sm go" data-a="finAdjOk" data-id="' + f.finance_id + '">Утвердить</button><button class="btn sm danger" data-a="finAdjNo" data-id="' + f.finance_id + '">Отклонить</button>';
        return '<tr' + (f.overdue ? ' class="att"' : '') + '><td class="num">' + fD(f.operation_date) + '<span class="t2 mono">' + f.finance_id + '</span></td><td>' + esc(f.type_label) + (f.invoice_no ? '<span class="t2">' + esc(f.invoice_no) + '</span>' : '') + '</td><td>' + esc(f.client_name || '—') + '</td><td>' + esc(f.basis || f.category || '') + (f.category ? '<span class="t2">' + esc(f.category) + '</span>' : '') + '</td>' +
          '<td class="r num"' + (neg ? ' style="color:var(--bad)"' : '') + '>' + (neg && f.operation_type === 'EXPENSE' ? '−' : '') + money(f.amount) + '</td>' + (d.tab === 'invoices' ? '<td class="r num">' + money(f.paid) + '</td><td class="r num"><b>' + money(f.outstanding) + '</b>' + (f.overdue ? '<span class="t2" style="color:var(--bad)">срок ' + fD(f.due_date) + '</span>' : f.due_date ? '<span class="t2">срок ' + fD(f.due_date) + '</span>' : '') + '</td>' : '') +
          '<td>' + (f.status_label ? pill(f.status_label, { PAID: 'ok', PARTIAL: 'warn', UNPAID: f.overdue ? 'bad' : '', PENDING: 'warn', APPROVED: 'ok', REJECTED: 'mute', POSTED: 'mute' }[f.payment_status]) : '') + '</td><td>' + act + '</td></tr>';
      }).join('') : '<tr><td colspan="9" class="empty">Операций нет</td></tr>') + '</tbody></table></div></section>';
  },
  summary: function (s) {
    var h = '<div class="kpis">' + kpi('Начислено за 30 дней', money(s.accrued)) + kpi('Поступило', money(s.received), '', 'good') + kpi('Расходы', money(s.expenses)) + kpi('Прибыль (кассовая)', money(s.profit_cash), 'поступления − расходы', s.profit_cash < 0 ? 'bad' : '') +
      kpi('Дебиторская задолженность', money(s.receivable), 'на ' + fD(s.generated_at), '', 'finance', { tab: 'invoices' }) + kpi('Просрочено', money(s.overdue_total), s.overdue.length + ' ' + plural(s.overdue.length, 'счёт', 'счёта', 'счетов'), s.overdue.length ? 'bad' : 'good', 'finance', { tab: 'invoices' }) + '</div>';
    var exp = Object.keys(s.expenses_by_category).map(function (k) { return [k, s.expenses_by_category[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    var maxE = exp.length ? exp[0][1] : 1;
    var srv = Object.keys(s.by_service).map(function (k) { return [k, s.by_service[k]]; }).sort(function (a, b) { return b[1] - a[1]; }), maxS = srv.length ? srv[0][1] : 1;
    h += '<div class="grid g-main"><div class="stack" style="gap:16px">' + card('Начислено и поступило, 12 месяцев', barChart(s.series)) +
      card('По клиентам', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Клиент</th><th class="r">Начислено</th><th class="r">Поступило</th><th class="r">Долг</th></tr></thead><tbody>' + s.by_client.map(function (c) { return '<tr class="click" ' + link('client', { client_id: c.client_id }) + '><td>' + esc(c.client_name) + '</td><td class="r num">' + money(c.accrued) + '</td><td class="r num">' + money(c.received) + '</td><td class="r num">' + (c.debt ? '<b>' + money(c.debt) + '</b>' : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>') + '</div>' +
      '<div class="stack" style="gap:16px">' + card('Просроченные счета', s.overdue.length ? '<div class="list">' + s.overdue.map(function (o) { return '<div class="li"><span class="sev bad"></span><div class="txt"><b>' + esc(o.client_name) + '</b><div class="t2">' + esc(o.invoice_no) + ' · срок ' + fD(o.due_date) + ' · ' + o.days + ' дн.</div></div><b class="num">' + money(o.outstanding) + '</b></div>'; }).join('') + '</div>' : emptyLine('Просрочек нет')) +
      card('Расходы по категориям', exp.length ? exp.map(function (e) { return '<div class="hbar"><span>' + esc(e[0]) + '</span><span class="track"><i style="width:' + Math.round(e[1] / maxE * 100) + '%"></i></span><span class="num" style="text-align:right">' + money(e[1]) + '</span></div>'; }).join('') : emptyLine('Расходов за период нет')) +
      card('Начислено по услугам', srv.length ? srv.map(function (e) { return '<div class="hbar"><span>' + esc(e[0]) + '</span><span class="track"><i style="width:' + Math.round(e[1] / maxS * 100) + '%;background:var(--s2)"></i></span><span class="num" style="text-align:right">' + money(e[1]) + '</span></div>'; }).join('') : emptyLine('Нет начислений')) +
      '<p class="small muted" style="margin:0">' + esc(s.rules) + ' Сформировано ' + fDT(s.generated_at) + '. Управленческий учёт: сверяйте с первичными документами и банком.</p></div></div>';
    return h;
  },
  after: function (d, p, c) { bindChart(c); }
};
A.finQ = function (el) { S.params.q = el.value; render(true); };
function clientOpts() { return S.lk.clients.map(function (c) { return [c.id, c.name]; }); }
A.finOp = function (el, ev, preset) {
  var op = el.getAttribute('data-op'), today = new Date().toISOString(), F = [];
  var cl = { name: 'client_id', label: 'Клиент', type: 'select', required: op !== 'expense' && op !== 'payment', options: clientOpts(), empty: 'Выберите клиента' };

    }).join('') + '</tbody></table></div><p class="small muted">Выезд навсегда привязан к версии чек-листа. Новая версия не меняет уже назначенные выезды. Критерии оценки должны иметь источник и утверждающего.</p>', '<button class="btn sm pri" data-a="chkVersion">' + ic('plus') + 'Чек-лист</button>');
  }
};
A.errOk = function (el) { call('errors.resolve', { error_id: el.getAttribute('data-id') }).then(function () { render(true); }, showErr); };
A.jobRun = function (el) { el.classList.add('busy'); call('jobs.run', { job: 'daily' }).then(function (r) { toast('Проверка выполнена: напоминаний ' + r.reminders + ', просроченных задач ' + r.tasks_overdue + ', лаб. просрочек ' + r.lab_overdue + ', закрыто выездов ' + r.closed, 'ok'); render(true); }, function (e) { el.classList.remove('busy'); showErr(e); }); };
A.setSave = function (el) {
  var vals = {}; S.data.settings.forEach(function (s) { var i = $('#s_' + s.key); if (i && i.value !== String(s.value)) vals[s.key] = i.value; });
  if (!Object.keys(vals).length) return toast('Изменений нет');
  el.classList.add('busy');
  call('settings.save', { values: vals }).then(function (r) { toast('Изменено настроек: ' + r.changed.length + '. Записано в журнал.', 'ok'); reloadLookups(); render(true); }, function (e) { el.classList.remove('busy'); showErr(e); });
};
A.srvEdit = function (el) {
  var id = el.getAttribute('data-id'), cur = id ? S.data.services.filter(function (s) { return s.service_id === id; })[0] : null;
  openForm({ title: cur ? cur.name : 'Новая услуга', fields: [{ name: 'name', label: 'Название', required: true, full: true }, { name: 'price', label: 'Цена, ₽', type: 'number', required: true }, { name: 'unit', label: 'Единица', value: 'выезд' },
    { name: 'checklist_id', label: 'Чек-лист', type: 'select', options: S.data.checklists.filter(function (c) { return String(c.active) === 'true'; }).map(function (c) { return [c.checklist_id, c.name + ' v' + c.version]; }) }, { name: 'requires_samples', label: 'Обязателен отбор проб', type: 'checkbox' }, { name: 'active', label: 'Услуга активна', type: 'checkbox', value: true }, { name: 'description', label: 'Описание', type: 'textarea' }],
    values: cur || {}, submit: function (v) { if (cur) v.service_id = cur.service_id; return call('services.save', v); }, done: function () { reloadLookups(); render(true); } });
};
A.chkVersion = function (el) {
  var id = el.getAttribute('data-id');
  var start = id ? call('checklists.get', { checklist_id: id }) : Promise.resolve({ checklist: { name: '', family_id: '' }, items: [{ section: '', text: '', severity: 'NORMAL', photo_required: false }] });
  start.then(function (c) {
    var rowH = function (it) { return '<div class="ck" style="padding:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) 130px auto auto;gap:6px;align-items:center"><input class="inp" placeholder="Раздел" value="' + esc(it.section) + '" data-f="section"><input class="inp" placeholder="Текст пункта" value="' + esc(it.text) + '" data-f="text"><select class="sel" data-f="severity">' + opt(dictOpts(S.lk.dict.severity), it.severity) + '</select><label class="small"><input type="checkbox" data-f="photo"' + (String(it.photo_required) === 'true' ? ' checked' : '') + '> фото</label><button class="btn sm" data-m="del">✕</button></div>'; };
    modal({ title: id ? 'Новая версия: ' + c.checklist.name + ' (сейчас v' + c.checklist.version + ')' : 'Новый чек-лист', wide: true, sticky: true,
      body: '<div class="alert small">Сохранение создаст новую версию. Предыдущая уйдёт в архив, но останется привязанной к прошлым выездам; услуги переключатся на новую версию.</div>' + formHtml([{ name: 'name', label: 'Название', required: true, full: true, value: c.checklist.name }, { name: 'source', label: 'Основание критериев и утверждающий', full: true, value: c.checklist.source || '' }]) +
        '<div id="ckrows" class="stack" style="gap:6px">' + c.items.map(rowH).join('') + '</div><div><button class="btn sm" data-m="add">' + ic('plus') + 'Пункт</button></div>',
      actions: [['Отмена', 'close'], ['Сохранить версию', 'ok', 'pri']],
      on: {
        add: function (api) { $('#ckrows', api.el).insertAdjacentHTML('beforeend', rowH({ section: '', text: '', severity: 'NORMAL' })); },
        del: function (api, b) { b.closest('.ck').remove(); },
        ok: function (api) {
          var items = $$('#ckrows .ck', api.el).map(function (r) { return { section: $('[data-f=section]', r).value, text: $('[data-f=text]', r).value, severity: $('[data-f=severity]', r).value, photo_required: $('[data-f=photo]', r).checked }; }).filter(function (x) { return x.text.trim(); });
          api.busy(true);
          call('checklists.saveVersion', { family_id: c.checklist.family_id, name: $('[name=name]', api.el).value, source: $('[name=source]', api.el).value, items: items }).then(function (r) { api.close(); toast('Сохранена версия v' + r.checklist.version, 'ok'); reloadLookups(); render(true); }, function (e) { api.busy(false); api.error(e); });
        }
      } });
  }, showErr);
};

function auditTable(rows) {
  if (!rows.length) return emptyLine('Записей нет');

  }).join('') + '</tbody></table></div>';
}
