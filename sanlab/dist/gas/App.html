          if (r === false) return;

        }, function (e) { api.busy(false); if (o.onError && o.onError(e, api, v)) return; api.error(e); });
      }
    },
    ready: o.ready
  });
  return m;
}

/* ---------- Файлы ---------- */
function readFileB64(file, maxSide) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onerror = function () { reject({ message: 'Не удалось прочитать файл' }); };
    fr.onload = function () {
      var dataUrl = fr.result;
      if (!/^image\/(jpeg|png|webp)/.test(file.type) || !maxSide) return resolve({ name: file.name, mime: file.type || 'application/octet-stream', b64: dataUrl.split(',')[1] });
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = function () { resolve({ name: file.name, mime: file.type, b64: dataUrl.split(',')[1] }); };
      img.src = dataUrl;
    };
    fr.readAsDataURL(file);
  });
}
function uploadFile(file, meta) {
  return readFileB64(file, meta.document_type === 'PHOTO' || /^image\//.test(file.type) ? 1600 : 0).then(function (f) {
    var p = {}; for (var k in meta) p[k] = meta[k];
    p.file_name = f.name; p.mime_type = f.mime; p.data_base64 = f.b64;
    return call('files.upload', p);
  });
}
var _thumbCache = {};
function loadThumbs(root) {
  $$('[data-thumb]', root || document).forEach(function (el) {
    var id = el.getAttribute('data-thumb');
    if (_thumbCache[id]) { el.style.backgroundImage = 'url(' + _thumbCache[id] + ')'; return; }
    call('files.get', { document_id: id, thumb: true }).then(function (r) {
      if (!/^image\//.test(r.mime_type)) return;
      _thumbCache[id] = 'data:' + r.mime_type + ';base64,' + r.data_base64;
      el.style.backgroundImage = 'url(' + _thumbCache[id] + ')'; el.textContent = '';
    }, function () { el.textContent = 'нет доступа'; });
  });
}
function b64ToBlobUrl(b64, mime) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime }));
}
function utf8FromB64(b64) { try { return decodeURIComponent(escape(atob(b64))); } catch (e) { return atob(b64); } }
/* Просмотр файла: фото — в окне, HTML-отчёт — во фрейме, PDF — во фрейме/новой вкладке */
A.openFile = function (el) {
  var id = el.getAttribute('data-id');
  var m = modal({ title: 'Файл ' + id, wide: true, body: '<div class="skeleton"></div>' });
  call('files.get', { document_id: id }).then(function (r) {
    var d = r.document, head = '<div class="row small muted"><span class="mono">' + esc(d.file_name) + '</span><span>· ' + esc(fDT(d.created_at)) + '</span>' + (String(d.is_actual) === 'false' ? '<span class="pill bad">неактуален: ' + esc(d.invalid_reason) + '</span>' : '') + '</div>';
    if (/^image\//.test(r.mime_type)) m.body.innerHTML = head + '<img alt="" style="width:100%;border-radius:8px" src="data:' + r.mime_type + ';base64,' + r.data_base64 + '">';
    else if (r.mime_type === 'text/html') { m.body.innerHTML = head + '<iframe title="Документ" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>'; $('iframe', m.body).srcdoc = utf8FromB64(r.data_base64); }
    else { var url = b64ToBlobUrl(r.data_base64, r.mime_type); m.body.innerHTML = head + '<iframe title="Документ" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:8px" src="' + url + '"></iframe><a class="btn" target="_blank" href="' + url + '">Открыть в новой вкладке</a>'; }
  }, function (e) { m.body.innerHTML = '<div class="alert bad">' + errText(e) + '</div>'; });
};
/* Печать по правилам проекта: window.open + document.write + print */
function printHtml(html) {
  var w = window.open('', '_blank');
  if (!w) { var m = modal({ title: 'Предпросмотр', wide: true, body: '<iframe title="Отчёт" style="width:100%;height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>' }); $('iframe', m.body).srcdoc = html; return; }
  w.document.open(); w.document.write(html); w.document.close(); setTimeout(function () { try { w.print(); } catch (e) { } }, 400);
}

/* ---------- Навигация ---------- */
function go(page, params, opts) {
  if (Object.keys(S.dirty).length && !(opts && opts.force)) {
    return confirmBox('Есть несохранённые изменения', 'Комментарии, которые ещё не отправлены на сервер, останутся черновиком на этом устройстве. Уйти со страницы?', 'Уйти').then(function () { S.dirty = {}; go(page, params, { force: true }); });
  }
  if (!opts || !opts.noPush) S.stack.push({ page: S.page, params: S.params });
  if (S.stack.length > 30) S.stack.shift();
  S.page = page; S.params = params || {};
  lsSet('last_' + S.me.employee_id, { page: page, params: S.params });
  render();
}
function back() { var p = S.stack.pop(); if (p) go(p.page, p.params, { noPush: true }); else go('home', {}, { noPush: true }); }
A.go = function (el) { var p = el.getAttribute('data-page'), raw = el.getAttribute('data-params'); go(p, raw ? JSON.parse(raw) : {}); closeSide(); };
A.back = function () { back(); };
A.reload = function () { render(true); };
function link(page, params) { return 'data-a="go" data-page="' + page + '" data-params="' + esc(JSON.stringify(params || {})) + '"'; }
function closeSide() { var s = $('.side'); if (s) s.classList.remove('open'); }
A.burger = function () { $('.side').classList.toggle('open'); };
A.theme = function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark'); lsSet('theme', dark ? 'light' : 'dark');
};

function shellHtml() {
  var me = S.me;
  var nav = me.menu.map(function (k) { var m = MENU[k]; if (!m) return ''; return '<button data-a="go" data-page="' + k + '" data-k="' + k + '">' + ic(m[1]) + '<span>' + m[0] + '</span><span class="cnt" hidden></span></button>'; }).join('');
  var tabs = me.role === 'SPECIALIST' ? ['home', 'myvisits', 'tasks', 'lab'] : me.menu.slice(0, 4);
  var tabbar = '<nav class="tabbar" aria-label="Разделы">' + tabs.map(function (k) { return '<button data-a="go" data-page="' + k + '" data-k="' + k + '">' + ic(MENU[k][1]) + '<span>' + (k === 'home' ? 'Главная' : MENU[k][0].split(' ')[0]) + '</span></button>'; }).join('') + '<button data-a="burger">' + ic('more') + '<span>Ещё</span></button></nav>';
  return (window.SANLAB_DEMO ? '<div class="demo-bar">Демо-режим: данные вымышленные и хранятся только в этом браузере. <button data-a="demoSwitch">Сменить роль</button><button data-a="demoReset">Сбросить демо-данные</button></div>' : '') +
    '<div class="shell"><aside class="side"><div class="brand">' + LOGO_MARK + '<div><b>San<i>.</i>Lab</b><small>Безопасность · Контроль · Здоровье</small></div></div><nav class="nav" aria-label="Разделы">' + nav + '</nav>' +
    '<div class="me"><div class="ava">' + esc(initials(me.full_name)) + '</div><div class="who"><b>' + esc(shortName(me.full_name)) + '</b><span>' + esc(me.role_label) + '</span></div><button data-a="logout" title="Выйти" aria-label="Выйти">' + ic('logout') + '</button></div></aside>' +
    '<div class="main"><div class="top"><button class="icon-btn burger" data-a="burger" aria-label="Меню">' + ic('menu') + '</button><div style="min-width:0"><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="grow"></div>' +
    '<label class="search">' + ic('search') + '<input id="gsearch" placeholder="Поиск по ID: VIS-000842" autocomplete="off"></label>' +
    '<button class="icon-btn" data-a="theme" title="Тема" aria-label="Сменить тему">' + ic('theme') + '</button>' +
    '<button class="icon-btn" data-a="bell" aria-label="Уведомления">' + ic('bell') + '<span class="dot" id="bellDot" hidden></span></button></div>' +
    '<div class="content" id="content"></div></div></div>' + tabbar + '<div class="toasts" id="toasts" aria-live="polite"></div>';
}

function render(soft) {
  var p = Pages[S.page];
  if (!p || S.me.menu.indexOf(S.page) < 0 && ['visit', 'client', 'report', 'sample', 'task'].indexOf(S.page) < 0) { S.page = 'home'; p = Pages.home; }
  $$('[data-k]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-k') === (p.menu || S.page)); });
  $('#title').textContent = typeof p.title === 'function' ? p.title(S.params) : p.title;
  $('#subtitle').textContent = '';
  var c = $('#content');
  if (!soft) { c.innerHTML = '<div class="skeleton"></div><div class="skeleton" style="height:240px"></div>'; window.scrollTo(0, 0); }
  var token = S.renderToken = Math.random();
  Promise.resolve(p.load ? p.load(S.params) : null).then(function (data) {
    if (token !== S.renderToken) return;
    S.data = data;
    c.innerHTML = p.view(data, S.params);
    if (p.title && typeof p.title === 'function') $('#title').textContent = p.title(S.params, data);
    if (p.sub) $('#subtitle').textContent = p.sub(data, S.params);
    if (p.after) p.after(data, S.params, c);
  }, function (e) {
    if (token !== S.renderToken) return;
    c.innerHTML = '<div class="card"><div class="body" style="padding-top:16px"><div class="alert bad">' + errText(e) + '</div><div class="row" style="margin-top:12px"><button class="btn" data-a="back">' + ic('back') + 'Назад</button><button class="btn" data-a="reload">' + ic('refresh') + 'Повторить</button></div></div></div>';
  });
}

/* ---------- Уведомления ---------- */
function pollBell() {
  call('notifications.mine').then(function (r) {
    S.unread = r.unread; S.notes = r.rows;
    var d = $('#bellDot'); if (d) { d.hidden = !r.unread; d.textContent = r.unread > 99 ? '99+' : r.unread; }
  }, function () { });
}
var NOTE_PAGE = { Visits: 'visit', Tasks: 'task', LabSamples: 'sample', Reports: 'report', Finance: 'finance' };
A.bell = function () {
  var old = $('.drop'); if (old) { old.remove(); return; }
  var d = document.createElement('div'); d.className = 'card drop';
  var rows = S.notes || [];
  d.innerHTML = '<header><h2>Уведомления</h2><div class="grow"></div>' + (S.unread ? '<button class="btn sm" data-a="readAll">Прочитать все</button>' : '') + '</header><div class="body"><div class="list">' +
    (rows.length ? rows.slice(0, 30).map(function (n) {
      var pg = NOTE_PAGE[n.entity_type], prm = {};
      if (pg === 'visit') prm.visit_id = n.entity_id; if (pg === 'task') prm.task_id = n.entity_id; if (pg === 'sample') prm.sample_id = n.entity_id; if (pg === 'report') prm.report_id = n.entity_id;
      return '<div class="li" ' + (pg ? link(pg, prm) : '') + '><span class="sev ' + (n.read_at ? '' : 'info') + '"></span><div class="txt"><b>' + esc(n.title) + '</b><div class="t2">' + esc(n.message) + '</div><div class="t2">' + fDT(n.created_at) + ' · <span class="mono">' + esc(n.entity_id) + '</span></div></div></div>';
    }).join('') : '<div class="empty">Уведомлений нет</div>') + '</div></div>';
  document.body.appendChild(d);
  setTimeout(function () { document.addEventListener('click', function h(ev) { if (!d.contains(ev.target)) { d.remove(); document.removeEventListener('click', h); } }); }, 0);
};
A.readAll = function () { call('notifications.read', { all: true }).then(function () { var d = $('.drop'); if (d) d.remove(); pollBell(); }); };

/* Глобальный поиск по ID */
function gsearch(q) {
  q = String(q || '').trim().toUpperCase();
  var m = q.match(/^(VIS|CLI|LAB|TSK|REP|DOC|SITE|FIN)-?(\d{1,6})$/);
  if (!m) { toast('Введите ID, например VIS-000842 или LAB-000219'); return; }
  var id = m[1] + '-' + ('000000' + m[2]).slice(-6);
  var map = { VIS: ['visit', 'visit_id'], CLI: ['client', 'client_id'], LAB: ['sample', 'sample_id'], TSK: ['task', 'task_id'], REP: ['report', 'report_id'] };
  if (m[1] === 'SITE') { var s = siteById(id); if (s.client_id) return go('client', { client_id: s.client_id }); return toast('Объект не найден или недоступен', 'bad'); }
  if (m[1] === 'DOC') return A.openFile({ getAttribute: function () { return id; } });
  if (m[1] === 'FIN') return go('finance', { tab: 'ops', q: id });
  var p = {}; p[map[m[1]][1]] = id; go(map[m[1]][0], p);
}

/* ---------- Запуск ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var fn = A[el.getAttribute('data-a')];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-c]'); if (!el) return;
  var fn = A[el.getAttribute('data-c')]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'gsearch') gsearch(ev.target.value);
  if (ev.key === 'Enter' && ev.target.getAttribute('data-enter')) { var fn = A[ev.target.getAttribute('data-enter')]; if (fn) fn(ev.target, ev); }
  if (ev.key === 'Escape' && _modalStack.length) _modalStack[_modalStack.length - 1].close();
});
window.addEventListener('beforeunload', function (ev) { if (Object.keys(S.dirty).length) { ev.preventDefault(); ev.returnValue = ''; } });

function boot(force) {
  var th = lsGet('theme'); if (th) document.documentElement.setAttribute('data-theme', th);
  var root = $('#app');
  if (window.SANLAB_DEMO && (force || !S.token)) return window.SANLAB_DEMO.login(root);
  if (!window.SANLAB_DEMO && force) { S.me = null; S.token = ''; try { sessionStorage.removeItem('sanlab_token'); } catch (e) { } }
  if (!window.SANLAB_DEMO && !S.token) { try { S.token = sessionStorage.getItem('sanlab_token') || ''; } catch (e) { } }
  call('auth.mode').then(function (m) {
    if (!window.SANLAB_DEMO && m.mode === 'PIN' && !S.token) return pinLogin(root, m);
    return Promise.all([call('auth.me'), call('lookups.get')]).then(function (r) {
      S.me = r[0]; S.lk = r[1]; S.stack = [];
      root.innerHTML = shellHtml();
      var last = lsGet('last_' + S.me.employee_id);
      S.page = last && S.me.menu.indexOf(last.page) >= 0 ? last.page : 'home'; S.params = last && S.page === last.page ? last.params || {} : {};
      render(); pollBell();
      clearInterval(S.poll); S.poll = setInterval(pollBell, 60000);
    });
  }).catch(function (e) {
    if (!window.SANLAB_DEMO && e && (e.code === 'AUTH_REQUIRED' || e.code === 'AUTH_FAILED')) return pinLogin(root, {});
    root.innerHTML = '<div class="login"><div class="box"><div class="alert bad">' + errText(e) + '</div><p class="muted small">Проверьте, что вы вошли в рабочий Google-аккаунт, и обратитесь к администратору San.Lab.</p></div></div>';
  });
}
function pinLogin(root, m) {
  root.innerHTML = '<div class="login"><div class="box" style="max-width:420px"><div class="logo">' + LOGO_MARK.replace('<svg', '<svg style="width:52px;height:58px"') + '<b>San<i>.</i>Lab</b></div>' +
    '<div class="merr"></div>' + formHtml([{ name: 'email', label: 'Рабочий e-mail', type: 'email', full: true, required: true, value: lsGet('login_email') || '' }, { name: 'pin', label: 'PIN-код', type: 'password', inputmode: 'numeric', full: true, required: true }]) +
    '<button class="btn pri big" data-a="pinGo">Войти</button></div></div>';
}
A.pinGo = function (el) {
  var box = el.closest('.box'), v;
  try { v = readForm(box, [{ name: 'email', label: 'E-mail', required: true }, { name: 'pin', label: 'PIN', required: true }]); } catch (e) { $('.merr', box).innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; return; }
  el.classList.add('busy');
  lsSet('login_email', v.email);
  call('auth.login', { email: v.email, pin: v.pin }).then(function (r) { S.token = r.token; try { sessionStorage.setItem('sanlab_token', r.token); } catch (e) { } boot(); },
    function (e) { el.classList.remove('busy'); $('.merr', box).innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; var pf = $('[name=pin]', box); if (pf) { pf.value = ''; pf.focus(); } });
};
A.logout = function () {
  S.token = ''; try { sessionStorage.removeItem('sanlab_token'); } catch (e) { }
  clearInterval(S.poll);
  if (window.SANLAB_DEMO) return window.SANLAB_DEMO.login($('#app'));
  $('#app').innerHTML = '<div class="login"><div class="box" style="max-width:420px"><b>Вы вышли из San.Lab.</b><p class="muted">Чтобы выйти из Google-аккаунта, используйте меню аккаунта Google.</p><button class="btn pri" data-a="relogin">Войти снова</button></div></div>';
};
A.relogin = function () { boot(); };
</script>
