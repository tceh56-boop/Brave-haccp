<script>
/* ================= Нормативная база, программы ПК, технические условия ================= */
var DOC_ST = { DRAFT: ['Черновик', 'warn'], APPROVED: ['Утверждена', 'ok'], ARCHIVED: ['Архив', 'mute'] };
function docPill(st, fem) { var x = DOC_ST[st] || [st, '']; return pill(fem === false && st === 'APPROVED' ? 'Утверждены' : x[0], x[1]); }
function unvPill(n) { n = Number(n) || 0; return n ? pill('не сверено: ' + n, 'warn') : pill('всё сверено', 'ok'); }
function canDocs() { return ['OWNER', 'COORDINATOR'].indexOf(S.me.role) >= 0; }
function canApproveDocs() { return ['OWNER', 'QC'].indexOf(S.me.role) >= 0; }
var TU_TEXT_KEYS = { intro: 'Вводная часть', general: 'Технические требования', packaging: 'Упаковка', safety: 'Требования безопасности', environment: 'Охрана окружающей среды', acceptance: 'Правила приёмки', transport: 'Хранение и транспортирование', warranty: 'Гарантии изготовителя' };
function verPill(v) { return String(v) === 'true' || v === true ? pill('сверено', 'ok') : pill('требует сверки', 'warn'); }

/* ---------- Редактор разделов документа (общий для ППК и ТУ) ---------- */
function docEditorHtml(content, editable) {
  return (content.sections || []).map(function (s, si) {
    var body;
    if (s.type === 'text') {
      body = (s.v === false ? '<div class="alert warn small">Положение не сверено с официальным текстом' + (s.ref ? ': ' + esc(s.ref) : '') + '</div>' : (s.ref ? '<div class="small muted">Основание: ' + esc(s.ref) + '</div>' : '')) +
        (editable ? '<textarea class="inp" rows="' + Math.min(14, Math.max(3, String(s.text || '').split('\n').length + 1)) + '" data-doc-text>' + esc(s.text) + '</textarea>' : '<p style="white-space:pre-wrap;margin:0">' + esc(s.text) + '</p>');
    } else {
      var head = '<tr><th style="width:28px">№</th>' + s.cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th style="width:190px">Основание</th>' + (editable ? '<th></th>' : '') + '</tr>';
      var rows = (s.rows || []).map(function (r, i) { return docRowHtml(s, r, i, editable); }).join('');
      body = '<div class="tbl-wrap"><table class="tbl doc-tbl"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
        (!(s.rows || []).length ? '<div class="empty small">Нет строк: для объекта или продукции подходящих положений в базе не найдено.</div>' : '') +
        (editable ? '<div style="margin-top:8px"><button class="btn sm" data-a="docRowAdd" data-si="' + si + '">' + ic('plus') + 'Строка</button></div>' : '') +
        (s.note ? '<p class="small muted" style="margin:8px 0 0">' + esc(s.note) + '</p>' : '');
    }
    return '<section class="card doc-sec" data-key="' + esc(s.key) + '" data-type="' + s.type + '"><header><h2>' + esc(s.title) + '</h2></header><div class="body">' + body + '</div></section>';
  }).join('');
}
function docRowHtml(s, r, i, editable) {
  var cells = s.cols.map(function (c, ci) {
    var v = (r.c || [])[ci] || '';
    return '<td>' + (editable ? '<textarea class="inp cell" rows="' + Math.min(6, Math.max(1, Math.ceil(String(v).length / 42))) + '" data-ci="' + ci + '">' + esc(v) + '</textarea>' : esc(v).replace(/\n/g, '<br>')) + '</td>';
  }).join('');
  var ref = r.manual ? '<span class="small muted">' + (r.src === 'input' ? 'данные организации' : 'добавлено вручную') + '</span>' : '<span class="small">' + esc(r.ref || '') + '</span><br>' + (r.v === false ? pill('не сверено', 'warn') : pill('сверено', 'ok'));
  return '<tr data-i="' + (i === null ? '' : i) + '"' + (r.v === false ? ' class="unv"' : '') + '><td class="num">' + (i === null ? '+' : i + 1) + '</td>' + cells + '<td>' + ref + '</td>' + (editable ? '<td><button class="icon-btn sm" title="Удалить строку" data-a="docRowDel">' + ic('x') + '</button></td>' : '') + '</tr>';
}
function readDocEditor(root) {
  return { sections: $$('.doc-sec', root).map(function (sec) {
    var key = sec.getAttribute('data-key');
    if (sec.getAttribute('data-type') === 'text') { var t = $('[data-doc-text]', sec); return t ? { key: key, text: t.value } : { key: key }; }
    return { key: key, rows: $$('tbody tr', sec).map(function (tr) {
      var i = tr.getAttribute('data-i');
      return { i: i === '' ? null : Number(i), c: $$('[data-ci]', tr).map(function (x) { return x.value; }) };
    }) };
  }) };
}
A.docRowAdd = function (el) {
  var s = S.data.content.sections[Number(el.getAttribute('data-si'))];
  var tb = $('tbody', el.closest('.doc-sec'));
  tb.insertAdjacentHTML('beforeend', docRowHtml(s, { c: s.cols.map(function () { return ''; }), manual: true, v: true }, null, true));
  var t = $('tr:last-child textarea', tb); if (t) t.focus();
  S.dirty.doc = 1;
};
A.docRowDel = function (el) { el.closest('tr').remove(); S.dirty.doc = 1; };
/* Поля редактора растут по высоте текста */
function growTa(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function autosizeDoc(root) { $$('.doc-sec textarea', root).forEach(growTa); }
document.addEventListener('input', function (ev) { if (ev.target.closest && ev.target.closest('.doc-sec')) { S.dirty.doc = 1; if (ev.target.tagName === 'TEXTAREA') growTa(ev.target); } });

/* Утверждение: обычное или с обоснованием (несверенные положения — только руководитель) */
function approveDoc(kind, id, unverified, label) {
  var action = kind === 'ppc' ? 'programs.approve' : 'specs.approve', key = kind === 'ppc' ? 'program_id' : 'spec_id';
  var done = function () { toast(label + ' утверждена, PDF сохранён в «Документах»', 'ok'); render(true); };
  if (!unverified) return confirmBox('Утвердить ' + label.toLowerCase() + '?', 'Будет сформирован PDF и сохранён в папке клиента и в «Документах». Утверждённую версию изменить нельзя — только через новую версию.', 'Утвердить', 'go')
    .then(function () { var p = {}; p[key] = id; return call(action, p); }).then(done, showErr);
  if (S.me.role !== 'OWNER') return modal({ title: 'Есть несверенные положения', body: '<div class="alert warn">В документе ' + unverified + ' положений не сверены с официальным текстом нормативов. Сверьте их в разделе «Нормативная база» и пересоберите документ. Утвердить документ с несверенными положениями может только руководитель.</div>', actions: [['Понятно', 'close', 'pri']] });
  openForm({ title: 'Утвердить с несверенными положениями', okText: 'Утвердить', okTone: 'danger',
    intro: '<div class="alert warn">В документе ' + unverified + ' положений не сверены с официальным текстом нормативов. В PDF они будут выделены, а обоснование будет напечатано на титульном листе и записано в журнал аудита.</div>',
    fields: [{ name: 'reason', label: 'Обоснование', type: 'textarea', required: true, placeholder: 'Например: нормативы сверяются, документ нужен для согласования с заказчиком' }],
    submit: function (v) { var p = { accept_unverified: true, reason: v.reason }; p[key] = id; return call(action, p); }, done: done });
}
function docWarnings(d, unv) {
  var h = (d.warnings || []).map(function (w) { return '<div class="alert warn small">' + esc(w) + '</div>'; }).join('');
  if (unv) h += '<div class="alert small">Строки с отметкой «не сверено» взяты из положений нормативной базы, которые ещё не сверены с официальным текстом. Сверьте их в «Нормативной базе» и нажмите «Пересобрать из базы» — отметки обновятся.</div>';
  return h;
}

/* ---------- Нормативная база ---------- */
Pages.norms = {
  title: 'Нормативная база',
  load: function () { return call('norms.list', {}); },
  sub: function (d) { var n = d.docs.filter(function (x) { return String(x.verified) === 'true'; }).length; return 'Документов: ' + d.docs.length + ' · сверено: ' + n; },
  view: function (d, p) {
    var f = p.f || 'all';
    var rows = d.docs.filter(function (x) { return f === 'all' || (f === 'unv' ? x.unverified_count > 0 : (',' + x.scopes + ',').indexOf(',' + f + ',') >= 0); });
    var chips = '<div class="chips">' + [['all', 'Все'], ['PPC', 'Для ППК'], ['TU', 'Для ТУ'], ['unv', 'Требуют сверки']].map(function (t) { return '<button class="' + (f === t[0] ? 'on' : '') + '" data-a="vf" data-k="f" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    var tbl = rows.length ? '<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Документ</th><th>Вид</th><th>Срок действия</th><th>Применяется</th><th class="r">Положений</th><th>Сверка</th></tr></thead><tbody>' + rows.map(function (x) {
      var term = !x.in_force ? pill(d.statuses[x.status] === 'Действует' ? 'не действует' : d.statuses[x.status], 'bad') : x.valid_until ? (x.expiring ? pill('до ' + fD(x.valid_until), 'warn') : 'до ' + fD(x.valid_until)) : '<span class="muted">без срока</span>';
      return '<tr class="click" ' + link('norm', { norm_id: x.norm_id }) + '><td><b>' + esc(x.code) + '</b><span class="t2">' + esc(x.title) + '</span></td><td class="small">' + esc(d.kinds[x.kind] || x.kind) + '</td><td>' + term + '</td><td class="small">' + csvList(x.scopes).map(function (s) { return s === 'PPC' ? 'ППК' : s === 'TU' ? 'ТУ' : s; }).join(', ') + '</td><td class="r num">' + x.items_count + '</td><td>' + (x.unverified_count ? pill('не сверено: ' + x.unverified_count, 'warn') : pill('сверено', 'ok')) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : emptyLine('Документов нет');
    return '<div class="filters">' + chips + '<div class="grow"></div>' + (S.me.role === 'OWNER' ? '<button class="btn pri" data-a="normDoc">' + ic('plus') + 'Документ</button>' : '') + '</div>' +
      '<div class="alert small">Программы ПК и ТУ собираются из положений этой базы. Положение «требует сверки» — внесено как проект: сверьте формулировку и номер пункта с официальным текстом и отметьте сверку. Документы с несверенными положениями утверждает только руководитель с обоснованием.</div>' +
      '<section class="card">' + tbl + '</section>';
  }
};
function normDocFields(d) {
  return [{ name: 'code', label: 'Обозначение', required: true, placeholder: 'СанПиН 2.3/2.4.3590-20' }, { name: 'kind', label: 'Вид документа', type: 'select', required: true, options: dictOpts(d.kinds) },
    { name: 'title', label: 'Наименование', required: true, full: true }, { name: 'status', label: 'Статус', type: 'select', options: dictOpts(d.statuses), value: 'ACTIVE' },
    { name: 'valid_from', label: 'Действует с', type: 'date' }, { name: 'valid_until', label: 'Действует до', type: 'date', hint: 'Пусто — без ограничения срока. За ' + 90 + ' дней до окончания руководитель получит уведомление.' },
    { name: 'scopes', label: 'Где применяется', type: 'checks', options: dictOpts(d.scopes), full: true },
    { name: 'source_url', label: 'Источник официального текста', full: true, placeholder: 'Ссылка на pravo.gov.ru, eaeunion.org или реквизиты публикации' },
    { name: 'notes', label: 'Примечание', type: 'textarea' }];
}
A.normDoc = function (el, ev, cur) {
  var d = S.data.kinds ? S.data : null;
  var meta = d ? Promise.resolve(d) : call('norms.list', {});
  meta.then(function (m) {
    openForm({ title: cur ? cur.code : 'Новый нормативный документ', wide: true, fields: normDocFields(m), values: cur || { status: 'ACTIVE' },
      intro: cur ? '<div class="alert small">После сохранения отметка «сверено» снимается — подтвердите сверку заново.</div>' : '',
      submit: function (v) { if (cur) { v.norm_id = cur.norm_id; v.row_version = cur.row_version; } return call('norms.saveDoc', v); },
      done: function (r) { toast('Сохранено', 'ok'); if (cur) render(true); else go('norm', { norm_id: r.norm_id }); } });
  }, showErr);
};

Pages.norm = {
  menu: 'norms',
  title: function (p, d) { return d ? d.doc.code : 'Нормативный документ'; },
  sub: function (d) { return d.doc.norm_id + ' · ' + d.items.length + ' положений'; },
  load: function (p) { return Promise.all([call('norms.get', { norm_id: p.norm_id }), call('norms.list', {})]).then(function (r) { var o = r[0]; o.kinds = r[1].kinds; o.statuses = r[1].statuses; o.scopes = r[1].scopes; return o; }); },
  view: function (d) {
    var doc = d.doc, own = S.me.role === 'OWNER', bySec = groupBy(d.items, 'section');
    var flagName = function (a) { return csvList(a).map(function (x) { return x === 'all' ? 'все объекты' : (d.flags[x] || x); }).join(', '); };
    var items = Object.keys(d.sections).filter(function (k) { return bySec[k]; }).map(function (k) {
      return '<tr class="sec-row"><td colspan="6"><b>' + esc(d.sections[k]) + '</b></td></tr>' + bySec[k].map(function (i) {
        var det = [i.indicator ? (i.section === 'TU_TEXT' ? 'Раздел ТУ: ' + esc(TU_TEXT_KEYS[i.indicator] || i.indicator) : 'Показатель: ' + esc(i.indicator)) : '', i.norm_value ? 'Норматив: <b>' + esc(i.norm_value) + '</b>' : '', i.frequency ? 'Периодичность: ' + esc(i.frequency) : '', i.volume ? esc(i.volume) : ''].filter(String).join(' · ');
        return '<tr' + (String(i.active) === 'false' ? ' class="muted"' : '') + '><td class="mono small">' + esc(i.clause || '—') + '</td><td>' + esc(i.text) + (det ? '<span class="t2">' + det + '</span>' : '') + '</td><td class="small">' + esc(flagName(i.applies)) + '</td><td class="small">' + esc(i.product_group || '') + '</td><td>' + verPill(i.verified) + (String(i.active) === 'false' ? '<br>' + pill('отключено', 'mute') : '') + '</td><td>' + (own ? '<button class="btn sm" data-a="normItem" data-id="' + i.norm_item_id + '">Изменить</button>' : '') + '</td></tr>';
      }).join('');
    }).join('');
    var tbl = d.items.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:120px">Пункт</th><th>Положение</th><th>Объекты</th><th>Группа продукции</th><th>Сверка</th><th></th></tr></thead><tbody>' + items + '</tbody></table></div>' : emptyLine('Положений нет');
    var kv = '<dl class="kv"><dt>Наименование</dt><dd>' + esc(doc.title) + '</dd><dt>Вид</dt><dd>' + esc(d.kinds[doc.kind] || doc.kind) + '</dd><dt>Статус</dt><dd>' + esc(d.statuses[doc.status] || doc.status) + '</dd><dt>Срок действия</dt><dd>' + (doc.valid_from ? 'с ' + fD(doc.valid_from) + ' ' : '') + (doc.valid_until ? 'до ' + fD(doc.valid_until) : 'без ограничения') + '</dd>' +
      '<dt>Применяется</dt><dd>' + csvList(doc.scopes).map(function (s) { return d.scopes[s] || s; }).join('; ') + '</dd><dt>Сверка</dt><dd>' + verPill(doc.verified) + (doc.verified_at ? ' <span class="small muted">' + esc(empName(doc.verified_by)) + ', ' + fDT(doc.verified_at) + '</span>' : '') + '</dd><dt>Источник</dt><dd class="small" style="overflow-wrap:anywhere">' + esc(doc.source_url || '—') + '</dd>' + (doc.notes ? '<dt>Примечание</dt><dd class="small">' + esc(doc.notes) + '</dd>' : '') + '</dl>';
    return '<div class="row"><button class="back" data-a="back">' + ic('back') + 'Назад</button><div style="flex:1"></div>' +
      (own ? '<button class="btn" data-a="normDocEdit">Изменить</button><button class="btn" data-a="normItem">' + ic('plus') + 'Положение</button>' : '') +
      (canApproveDocs() ? '<button class="btn go" data-a="normVerify">Сверено с первоисточником</button>' : '') + '</div>' +
      '<div class="stack" style="gap:16px">' + card('Реквизиты', kv) + card('Положения', tbl) + '</div>';
  }
};
A.normDocEdit = function () { var d = S.data; A.normDoc(null, null, (function () { var c = JSON.parse(JSON.stringify(d.doc)); c.row_version = d.doc.row_version; return c; })()); };
A.normItem = function (el) {
  var d = S.data, id = el.getAttribute('data-id'), cur = id ? d.items.filter(function (i) { return i.norm_item_id === id; })[0] : null;
  var flags = [['all', 'Все объекты']].concat(dictOpts(d.flags));
  openForm({ title: cur ? 'Положение ' + (cur.clause || '') : 'Новое положение', wide: true,
    intro: cur ? '<div class="alert small">После сохранения положение получит отметку «требует сверки».</div>' : '',
    fields: [{ name: 'section', label: 'Вид положения (куда попадает)', type: 'select', required: true, options: dictOpts(d.sections), full: true }, { name: 'clause', label: 'Пункт документа', placeholder: 'п. 2.1, Приложение № 1, п. 5а' },
      { name: 'product_group', label: 'Группа продукции (для ТУ)', hint: 'Пусто — любая продукция. «~слово» — все группы, в названии которых есть слово.' },
      { name: 'text', label: 'Текст положения / объект контроля / процесс', type: 'textarea', required: true, rows: 4 },
      { name: 'indicator', label: 'Показатель / опасный фактор / ответственный', hint: 'Для вида «ТУ: текст раздела» — ключ раздела: ' + Object.keys(TU_TEXT_KEYS).map(function (k) { return k + ' (' + TU_TEXT_KEYS[k] + ')'; }).join(', ') + '. В тексте можно использовать {product}, {designation}, {shelf_life}, {storage}.' }, { name: 'norm_value', label: 'Норматив / критический предел / действия' },
      { name: 'frequency', label: 'Периодичность' }, { name: 'volume', label: 'Объём / примечание' },
      { name: 'applies', label: 'Для каких объектов (ППК)', type: 'checks', options: flags, full: true }, { name: 'active', label: 'Положение действует', type: 'checkbox', value: true }],
    values: cur || { applies: 'all', active: true },
    submit: function (v) { v.norm_id = d.doc.norm_id; if (cur) { v.norm_item_id = cur.norm_item_id; v.row_version = cur.row_version; } return call('norms.saveItem', v); },
    done: function () { toast('Положение сохранено', 'ok'); render(true); } });
};
A.normVerify = function () {
  var d = S.data, n = d.items.filter(function (i) { return String(i.verified) !== 'true'; }).length;
  openForm({ title: 'Сверка: ' + d.doc.code, okText: 'Подтвердить сверку', okTone: 'go',
    intro: '<div class="alert small">Подтвердите, что обозначение, наименование, сроки действия и все положения документа (несверенных: ' + n + ') проверены по официальному тексту. Сверка записывается в журнал аудита с вашим именем.</div>',
    fields: [{ name: 'source_url', label: 'Источник официального текста', required: true, full: true, value: d.doc.source_url || '', placeholder: 'https://pravo.gov.ru/... или реквизиты публикации' }],
    submit: function (v) { return call('norms.verify', { norm_id: d.doc.norm_id, source_url: v.source_url }); }, done: function () { toast('Сверка подтверждена', 'ok'); render(true); } });
};

/* ---------- Программы производственного контроля ---------- */
function ppcProfileFields(m) {
  return [{ name: 'object_type', label: 'Тип объекта', type: 'select', required: true, options: dictOpts(m.object_types) }, { name: 'seats', label: 'Посадочных мест', type: 'number' },
    { name: 'staff_count', label: 'Работников', type: 'number' }, { name: 'work_mode', label: 'Режим работы', placeholder: 'ежедневно 10:00–22:00' },
    { name: 'flags', label: 'Особенности объекта — определяют лабораторный контроль, ККТ и журналы', type: 'checks', options: dictOpts(m.flags), full: true },
    { name: 'water_source', label: 'Водоснабжение', placeholder: 'централизованное' }, { name: 'lab_name', label: 'Аккредитованная лаборатория' },
    { name: 'head_name', label: 'Руководитель (утверждает программу)' }, { name: 'head_position', label: 'Должность руководителя', value: 'Директор' },
    { name: 'responsible', label: 'Ответственные за производственный контроль', type: 'textarea', rows: 3, placeholder: 'ФИО; должность; функции — по одному на строку' },
    { name: 'positions', label: 'Должности работников (медосмотры, гигобучение)', type: 'textarea', rows: 2, placeholder: 'повар, кухонный рабочий, мойщик посуды, официант…' },
    { name: 'assortment', label: 'Ассортимент и виды деятельности', type: 'textarea', rows: 2 },
    { name: 'pest_control', label: 'Дезинсекция и дератизация (организация, договор)' }, { name: 'waste', label: 'Вывоз отходов (организация)' },

/* Скачать файл из base64; ссылка живёт до перезагрузки страницы, чтобы её можно было нажать повторно */
function downloadB64(b64, mime, name) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([arr], { type: mime })), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1500);
  return url;
}

A.tuNewVersion = function () { call('specs.newVersion', { spec_id: S.data.spec.spec_id }).then(function (r) { toast('Создан черновик изменения (v' + r.spec.version + ')', 'ok'); go('tudoc', { spec_id: r.spec.spec_id }); }, function (e) { if (e.details && e.details.spec_id) return go('tudoc', { spec_id: e.details.spec_id }); showErr(e); }); };
</script>
