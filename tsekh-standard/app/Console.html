<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* ==========================================================================
   ЦЕХ Стандарт — работа при пропадании интернета.
   Встаёт между экраном и сервером (google.script.run):
   • ответы на чтение запоминаются на устройстве; без связи экран получает
     последние сохранённые данные (и сразу показывает их при следующем открытии);
   • записи журналов, проверок, бракеража, чек-листов, задач и медкнижек без
     связи складываются в очередь на устройстве и отправляются сами, как только
     связь вернётся. Время записи — время на устройстве, когда её сделали.
   Ограничение платформы Google: открыть приложение без интернета нельзя —
   страница должна быть загружена заранее (открыта на планшете/телефоне).
   ========================================================================== */
(function () {
  if (typeof google === 'undefined' || !google.script || !google.script.run || window.mcOffline) return;
  var ORIG = google.script.run;
  var Q_KEY = 'mc_offline_q', F_KEY = 'mc_offline_failed', RC = 'mc_rc_';
  // бракераж (выпуск) и медкнижки (допуск) без связи не принимаются — нужно подтверждение сервера сразу
  var QUEUE = { addJournalEntry: 'Запись журнала', answerJournalCheck: 'Ответ на проверку',
    addSaleEntry: 'Продажа', addBactericidalLampReading: 'Бактерицидная лампа', saveChecklistExecution: 'Чек-лист',
    updateKanbanTask: 'Задача' };
  var READ = /^(get|ui|calculateKBZHU|mcGet)/, NO_CACHE = /^(getPhoto|getDocumentFile|getPrintJob)$/;
  var online = navigator.onLine !== false, flushing = false;

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function token() { return ls('mc_token') || ''; }
  function loadJ(k) { try { return JSON.parse(ls(k) || '[]'); } catch (e) { return []; } }
  function saveJ(k, v) { ls(k, JSON.stringify(v)); }
  function keyOf(fn, args) { var t = token(); return RC + fn + '|' + JSON.stringify((args || []).map(function (a) { return t && a === t ? '' : a; })); }

    return JSON.stringify({ ok: true, success: true, queued: true, data: { 'записано': false, queued: true, 'статус': 'ждёт отправки' },
      message: 'Сохранено на устройстве. Это ещё не запись журнала — она появится после отправки на сервер.',
      date: n.d, time: n.t, cook: '—', braker: '—', sum: '—', seller: '—', accumulated: '—', remaining: '—', decision: 'не принято сервером — ждёт отправки', count: '—' });

  }
  function later(f) { setTimeout(f, 0); }

      return function () { invoke(String(k), [].slice.call(arguments), st); };
    } });
  }
  // ---- отправка очереди ----
  function appError(res) {
    if (res === null || res === undefined) return '';
    if (typeof res === 'string') {
      if (/^err/i.test(res)) return res;
      if (res.charAt(0) !== '{') return '';

    return '';
  }
  function flush() {

    var q = loadJ(Q_KEY); if (!q.length) { paint(); return; }

  function el(tag, cls, html) { var x = document.createElement(tag); if (cls) x.className = cls; if (html !== undefined) x.innerHTML = html; return x; }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      '.mcoff.off{display:block;background:#7a2a1a;color:#fff}.mcoff.wait{display:block;background:#d4af37;color:#fff}.mcoff.bad{display:block;background:#fff4dc;color:#7a5410;border:1px solid #e1c27a}' +
      '.mcoffp{position:fixed;left:12px;right:12px;bottom:calc(' + (window.MC_OFFLINE_BOTTOM || '16px') + ' + 44px);max-width:420px;max-height:60vh;overflow:auto;z-index:2147482001;background:#fffdf9;border:1px solid #eadfcf;border-radius:14px;box-shadow:0 10px 30px rgba(40,20,10,.25);padding:12px 14px;font:13px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#241c17;display:none}' +
      '.mcoffp.on{display:block}.mcoffp h4{margin:2px 0 8px;font-size:13px;color:#a87b22}.mcoffp .r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #eadfcf}.mcoffp small{color:#8a7b6a}.mcoffp button{border:1px solid #eadfcf;background:#fff;border-radius:9px;padding:5px 9px;font:inherit;cursor:pointer}' +

        return '<div class="r"><span>' + esc(QUEUE[x.fn] || x.fn) + ' · <small>' + fmtTs(x.ts) + '</small><br><small>' + esc(x.error) + '</small></span><button onclick="mcOffline.drop(\'' + x.id + '\')">Убрать</button></div>';

      : (q || flushing) ? '⟳ Отправка записей: ' + q : f ? '⚠ Не приняты: ' + f : '';

<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЦЕХ Стандарт</title>
<style>
:root{
  --wine:#a87b22; --wine-d:#1d150d; --wine-dd:#0b0b0b; --wineghost:#f7ecd2;
  --gold:#d4af37; --gold-l:#e9d6ae; --bg:#f5efe6; --paper:#fffdf9; --ink:#241c17; --muted:#8a7b6a; --line:#eadfcf;
  --green:#2f7d4f; --green-bg:#e3f2e8; --amber:#a86a12; --amber-bg:#fbefd9; --red:#a8231f; --red-bg:#f8e1df;
  --blue:#2f5f9e; --blue-bg:#e2ecf8; --grey-bg:#efebe5;
  --shadow:0 10px 30px -18px rgba(60,30,20,.45); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fffaf2 0,#efe3d0 70%);z-index:50;padding:16px}
.login-card{width:min(360px,100%);text-align:center}
.login-card img{width:190px;max-width:70%}
.login-sub{color:var(--muted);margin:6px 0 18px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wine);display:block}
.pin-dots i.on{background:var(--wine)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto}
.pad button{height:62px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pad button:active{background:var(--wineghost)}
.pad .ghost{background:transparent;border:0;box-shadow:none;font-size:15px;color:var(--muted)}
.login-err{min-height:22px;color:var(--red);margin-top:12px;font-weight:600}

/* ---------- layout ---------- */
#app{display:none;min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:linear-gradient(180deg,var(--wine-d),var(--wine-dd));color:#f3eadb;display:flex;flex-direction:column;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand img{width:56px;height:56px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.side .brand b{display:block;font:700 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.08em}
.side .brand small{display:block;color:var(--gold-l);font-size:11px;margin-top:3px}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#efe4d0;padding:9px 12px;border-radius:10px;text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(233,214,174,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side .foot a{color:var(--gold-l);text-decoration:none;display:block;margin:3px 0}
.main{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(255,253,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px}
.burger svg{width:24px;height:24px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search input{border:0;outline:0;flex:1;font:inherit;background:none;min-width:0}
.search svg{width:16px;height:16px;opacity:.5}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.user b{display:block;font-size:13px}
.user small{display:block;color:var(--muted);font-size:12px}
.content{padding:22px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font:700 26px/1.15 Georgia,"Times New Roman",serif;color:var(--wine-d)}
.head .sub{color:var(--muted);margin-top:4px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.wine:before{background:var(--wine)}.kpi.red:before{background:var(--red)}.kpi.green:before{background:var(--green)}.kpi.gold:before{background:var(--gold)}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:700 30px/1.1 Georgia,serif;margin-top:4px}.kpi .v.vw{font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.kpi .h{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rdcard{margin-bottom:16px}.rdcard .ch{display:flex;justify-content:space-between;align-items:center;gap:10px}.rdnote{font-size:12px;color:var(--muted,#7a6c5c);margin:4px 0 8px}.rdrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line,#ece1cc);cursor:pointer}.rdrow:hover{background:rgba(168,123,34,.04)}.rdt{font-weight:650}.rdd{font-size:12px;color:var(--muted,#7a6c5c)}.rdb{font-size:11px;color:var(--red,#a8231f);font-weight:600}.rdmdl{padding:6px 4px}.rdmdl p{margin:8px 0;font-size:14px;word-break:break-word}.rdmdl .btn{display:inline-block;margin-top:8px}.rdft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted,#7a6c5c)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .ch h3{margin:0;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--muted);font-weight:600}

  /* ================= ЗАСТАВКА ВХОДА ЦЕХ Стандарт — логотип владельца =================
     Сначала появляется бокал, от него раскрываются мозг (влево) и схема (вправо),
     по логотипу проходит золотой блик, выплывает надпись. Затем шкала до 100%. */
  #mcxScreen{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;
    transition:opacity .5s ease;background:#f7f0e5;
    background-image:radial-gradient(120% 80% at 100% -10%,rgba(168,123,34,.10),transparent 55%),
      radial-gradient(90% 60% at -10% 0%,rgba(212,175,55,.14),transparent 50%),
      radial-gradient(60% 50% at 50% 42%,#fffaf1,transparent 70%)}
  #mcxScreen.on{display:flex}
  #mcxScreen.fadeout{opacity:0}
  .mcx-loader{width:100%;max-width:420px;padding:28px;text-align:center}
  .mcx-mark{position:relative;width:min(240px,62vw);aspect-ratio:1/1;margin:0 auto}
  .mcx-mark img,.mcx-glint{position:absolute;inset:0;width:100%;height:100%;display:block}
  .mcx-c{opacity:0;clip-path:inset(0 41% 0 41%);transform:translateY(12px);
    animation:mcxGlass .9s cubic-bezier(.2,.8,.25,1) .15s forwards}
  @keyframes mcxGlass{to{opacity:1;transform:none}}
  .mcx-l{clip-path:inset(0 59% 0 41%);animation:mcxL 1.3s cubic-bezier(.5,.05,.2,1) .85s forwards}
  @keyframes mcxL{to{clip-path:inset(0 59% 0 0)}}
  .mcx-r{clip-path:inset(0 41% 0 59%);animation:mcxR 1.3s cubic-bezier(.5,.05,.2,1) 1s forwards}
  @keyframes mcxR{to{clip-path:inset(0 0 0 59%)}}
  .mcx-parts{position:absolute;inset:0;animation:mcxOut .35s ease 2.45s forwards}
  @keyframes mcxOut{to{opacity:0}}
  .mcx-full{opacity:0;animation:mcxIn .35s ease 2.45s forwards,mcxGlow 2.8s ease-in-out 2.8s infinite}
  @keyframes mcxIn{to{opacity:1}}
  @keyframes mcxGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(212,175,55,0))}50%{filter:drop-shadow(0 0 14px rgba(212,175,55,.45))}}
  .mcx-glint{pointer-events:none;opacity:0;
    background:linear-gradient(105deg,transparent 38%,rgba(255,246,222,.95) 50%,transparent 62%) no-repeat;
    background-size:260% 100%;background-position:160% 0;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
    animation:mcxGlint 1.5s ease-in-out 2.6s forwards,mcxGlintLoop 3.2s ease-in-out 4.4s infinite}
  @keyframes mcxGlint{0%{opacity:1;background-position:160% 0}100%{opacity:1;background-position:-60% 0}}
  @keyframes mcxGlintLoop{0%{opacity:1;background-position:160% 0}45%,100%{opacity:1;background-position:-60% 0}}
  .mcx-word{display:block;width:min(250px,66vw);margin:10px auto 0;opacity:0;transform:translateY(8px);
    animation:mcxUp .8s ease 1.9s forwards}
  @keyframes mcxUp{to{opacity:1;transform:none}}
  .mcx-bar{width:100%;max-width:260px;height:3px;background:rgba(168,123,34,.10);
    border-radius:3px;margin:22px auto 10px;overflow:hidden}
  .mcx-bar-fill{height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#a87b22,#c79a2e 55%,#c9a15a);
    transition:width .55s cubic-bezier(.3,.7,.3,1)}
  .mcx-pct{font-size:.76rem;color:#8a7b6a;font-variant-numeric:tabular-nums}

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style id="tsConsoleTheme">
/* ==========================================================================
   ЦЕХ Стандарт — фирменное оформление главного окна.
   Только внешний вид: разметка, классы и логика экрана не меняются.
   Цвета бренда: #0B0B0B (основной), #D4AF37 (акцент), #E5E7EB (фон), #6B7280 (текст).
   ========================================================================== */
:root{
  --wine:#a87b22; --wine-d:#1d150d; --wine-dd:#0b0b0b; --wineghost:#f7ecd2;
  --gold:#d4af37; --gold-l:#f1dc9c; --gold-d:#a87b22;
  --bg:#f4ede1; --paper:#fffdf8; --ink:#1a1510; --muted:#7a6c5c; --line:#eadfca;
  --shadow:0 18px 40px -26px rgba(70,45,10,.55); --r:18px;
  --ts-grad:linear-gradient(135deg,#e2bf55 0%,#d4af37 40%,#a87b22 100%);
}
html,body{font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(212,175,55,.16),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(168,123,34,.10),transparent 60%);
  background-attachment:fixed}
.head h1,.mdl h2,.kpi .v,.dph,.pfph,.side .brand b{font-family:Montserrat,Roboto,Arial,sans-serif!important;letter-spacing:-.01em}
.head h1{font-weight:800;color:var(--ink)}
.card .ch h3{font-family:Montserrat,Roboto,Arial,sans-serif;font-weight:700}

/* вход */
#login{background:radial-gradient(circle at 50% 25%,#fffaf0 0,#f1e4c9 60%,#e8d6ae 100%)}
.login-card img{width:300px;max-width:86%;filter:drop-shadow(0 8px 18px rgba(60,40,10,.18))}
.pin-dots i{border-color:var(--gold-d)}
.pin-dots i.on{background:var(--ts-grad);border-color:var(--gold-d)}
.pad button{border-radius:18px;border-color:#efe2c6;background:linear-gradient(180deg,#fffefb,#fbf4e6)}
.pad button:active{background:#f7ecd2}

/* боковое меню: тёмное, активный пункт — золотая плашка */
.side{background:linear-gradient(180deg,#17110b 0%,#0b0b0b 55%,#120d08 100%);color:#efe4d0;box-shadow:6px 0 30px -12px rgba(0,0,0,.6)}
.side:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(212,175,55,.65),transparent)}
.side .brand{flex-direction:column;align-items:flex-start;gap:6px;padding:18px 16px 16px;border-bottom:1px solid rgba(212,175,55,.18)}
.side .brand img{width:196px;height:auto;max-width:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.side .brand small{color:#bfa76a;font-size:11px;letter-spacing:.04em;margin:0}
.nav{padding:12px 10px}
.nav button{color:#e9dcc4;padding:10px 12px;border-radius:12px;margin:2px 0;font-weight:500;transition:background .15s,color .15s}
.nav button svg{color:#d4af37;opacity:1}
.nav button:hover{background:rgba(212,175,55,.10);color:#fff}
.nav button.on{background:var(--ts-grad);color:#fff;font-weight:700;box-shadow:0 8px 20px -10px rgba(212,175,55,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.nav button.on svg{color:#fff}
.nav .ts-plan-lock{opacity:.45}
.side .foot{border-top:1px solid rgba(212,175,55,.18)}
.side .foot a{color:#d9c48a}

/* верхняя панель */
.top{background:rgba(255,252,245,.82);border-bottom:1px solid rgba(212,175,55,.25)}
.search{border-radius:14px;border-color:#ecdcb8}
.user .av{background:var(--ts-grad);color:#1a1510;box-shadow:0 4px 12px -6px rgba(168,123,34,.9)}

/* кнопки */
.btn{border-radius:12px;border-color:#e8d9b8}
.btn.pri{background:var(--ts-grad);border-color:#b8902c;color:#fff;box-shadow:0 8px 18px -10px rgba(168,123,34,.9)}
.btn.pri:hover{filter:brightness(1.05)}

/* плитки и карточки — как на макете: светлые, скруглённые, золотая подсветка */
.kpi{border-radius:20px;border-color:#efe2c6;background:linear-gradient(160deg,#fffefb 0%,#fbf3e3 100%)}
.kpi:before{width:0}
.kpi:after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(212,175,55,.22),transparent)}
.kpi .l{text-transform:none;letter-spacing:0;font-size:13px;color:#5d5144;font-weight:500}
.kpi .v{font-weight:800;color:#1a1510}
.kpi.red{background:linear-gradient(160deg,#fffaf9 0%,#fbe9e6 100%)}
.kpi.red .v{color:#a8231f}
.card{border-radius:20px;border-color:#efe2c6;background:linear-gradient(180deg,#fffefb,#fdf8ee)}
.card .ch{border-bottom-color:#f1e6cf}
th{background:#fbf4e5}
.tabs button.on{background:var(--ts-grad);color:#fff}
.bar i b{background:var(--ts-grad)}
.spin{border-top-color:var(--gold)}
.chip.g{background:#e4f3e8}
.mdl .box{border-radius:22px}
.mdl h4{color:var(--gold-d)}

/* заставка входа */
#mcxScreen{background:#f6efe2;background-image:radial-gradient(120% 80% at 100% -10%,rgba(212,175,55,.20),transparent 55%),radial-gradient(90% 60% at -10% 0%,rgba(11,11,11,.06),transparent 50%),radial-gradient(60% 50% at 50% 42%,#fffaf1,transparent 70%)}
.mcx-bar-fill{background:linear-gradient(90deg,#0b0b0b,#a87b22 55%,#d4af37)!important}
.mcx-word{width:min(230px,60vw)}

/* плашка тарифа (TS_Subscription) */
.ts-plan{margin:10px 16px 0;padding:10px 12px;border-radius:14px;background:rgba(212,175,55,.10);border:1px solid rgba(212,175,55,.28);font-size:12px;color:#e9dcc4;cursor:pointer}
.ts-plan b{display:block;color:#f1dc9c;font:700 13px/1.2 Montserrat,Roboto,Arial,sans-serif}
.ts-plan.warn{background:rgba(168,35,31,.18);border-color:rgba(232,120,110,.5)}
.ts-lock{display:inline-block;margin-left:auto;font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(212,175,55,.18);color:#f1dc9c}

</style>

  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  banquets:'<path d="M4 20h16M6 20V10h12v10M8 10V6h8v4M12 3v3"/>',
  menu:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/>',
  planning:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  production:'<path d="M6 13a6 6 0 1 1 12 0v6H6zM4 19h16M9 9V7M15 9V7"/>',
  stock:'<path d="M3 8 12 3l9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10"/>',
  revisions:'<path d="M9 4h6v3H9zM6 6h12v15H6z"/><path d="m9 14 2 2 4-4"/>',
  surplus:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  deficits:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  picking:'<path d="M4 7h16l-1.5 12h-13zM9 7a3 3 0 0 1 6 0"/>',

  haccp:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  finance:'<circle cx="12" cy="12" r="9"/><path d="M9 7h4.5a2.5 2.5 0 0 1 0 5H9zM9 12v5M7.5 15h5"/>',
  procurement:'<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/>',
  sanitation:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/>',
  personnel:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  lab:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/>',
  equipment:'<path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/><path d="M12 18v-6"/>',
  documents:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h5"/>',
  inspection:'<path d="M9 4h6v3H9zM6 6h12v15H6z"/><circle cx="11.5" cy="13.5" r="2.5"/><path d="m13.5 15.5 2.5 2.5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'
};
// ТЗ §43: 20 разделов в установленном порядке (отбор сырья — внутри «Производства»)
var SECTIONS = [['home','Главная'],['banquets','Банкеты'],['menu','Меню и ТТК'],['planning','Планирование'],['production','Производство'],
  ['stock','Склад'],['revisions','Ревизии'],['deficits','Дефициты'],['surplus','Излишки'],['procurement','Закупки'],['issue','Выдача'],['finance','Экономика'],
  ['haccp','HACCP'],['sanitation','Санитария'],['personnel','Персонал'],['lab','Лаборатория'],['equipment','Оборудование'],['documents','Документы'],
  ['reports','Отчёты'],['inspection','Проверка'],['settings','Настройки']];
var TOKEN = null, APP_URL = '', CUR = 'home', DATA = null, TAB = 0, CACHE = {};
// этап 10.7: что доступно вошедшему (с сервера: uiMe) — меню строится только из доступных разделов
var ACC = null, IDLE_MIN = 15, LAST_ACT = Date.now();
function deviceId() {
  var d = ''; try { d = localStorage.getItem('mc_device') || ''; } catch (e) {}
  if (!d) { d = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('mc_device', d); } catch (e) {} }
  return d;
}
var STALE = false;
try { TOKEN = localStorage.getItem('mc_token') || null; } catch (e) {}

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function run(fn, args, ok, fail) {
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || function (e) { showErr(String(e && e.message || e)); });
  r[fn].apply(r, args || []);
}
function showErr(m) {
  if (/NetworkError|HTTP 0|connection|failed to fetch/i.test(String(m)) || navigator.onLine === false)
    m = 'Нет связи с сервером, а этот раздел ещё не открывался на этом устройстве — сохранённой копии нет. Откройте его, когда появится интернет: после этого он будет доступен и без связи.';
  document.getElementById('content').innerHTML = '<div class="err">' + esc(m) + '</div>';
}

/* ---------- login ---------- */
var PIN = '';
function drawPin() {
  var d = ''; for (var i = 0; i < 4; i++) d += '<i class="' + (i < PIN.length ? 'on' : '') + '"></i>';
  if (PIN.length > 4) for (var j = 4; j < PIN.length; j++) d += '<i class="on"></i>';
  document.getElementById('dots').innerHTML = d;
}
(function () {
  var keys = ['1','2','3','4','5','6','7','8','9','⌫','0','Войти'], h = '';
  keys.forEach(function (k) { h += '<button class="' + (k === '⌫' || k === 'Войти' ? 'ghost' : '') + '" data-k="' + k + '">' + k + '</button>'; });
  var pad = document.getElementById('pad'); pad.innerHTML = h;
  pad.addEventListener('click', function (e) {
    var k = e.target.getAttribute('data-k'); if (!k) return;
    document.getElementById('loginErr').textContent = '';
    if (k === '⌫') PIN = PIN.slice(0, -1);
    else if (k === 'Войти') submitPin();
    else if (PIN.length < 6) { PIN += k; if (PIN.length === 4) setTimeout(function () { if (PIN.length === 4) submitPin(); }, 600); }
    drawPin();
  });
  drawPin();
})();
document.addEventListener('keydown', function (e) {
  if (document.getElementById('login').style.display === 'none') return;
  if (/^\d$/.test(e.key) && PIN.length < 6) { PIN += e.key; drawPin(); if (PIN.length === 4) setTimeout(function () { if (PIN.length === 4) submitPin(); }, 600); }
  else if (e.key === 'Backspace') { PIN = PIN.slice(0, -1); drawPin(); }
  else if (e.key === 'Enter') submitPin();
});
function submitPin() {
  if (PIN.length < 4) return;
  var p = PIN; PIN = ''; drawPin();
  document.getElementById('loginErr').textContent = 'Проверка…';
  run('loginWithPin', [p, deviceId()], function (res) {
    var r = {}; try { r = JSON.parse(res); } catch (e) {}
    if (!r.ok || !r.token) { document.getElementById('loginErr').textContent = r.error || 'Неверный ПИН-код'; return; }
    TOKEN = r.token; window.__MC_TOKEN = TOKEN; try { localStorage.setItem('mc_token', TOKEN); } catch (e) {}
    // заставка с логотипом поверх; главный экран тем временем загружает данные
    mcxIntro();
    LAST_ACT = Date.now(); start(null);
  }, function () { document.getElementById('loginErr').textContent = 'Ошибка сети'; });
}
function logout() {
  if (!confirm('Выйти из системы?')) return;
  endSession('');
}
// общий планшет на кухне: «Сменить сотрудника» — без вопросов, сразу ПИН следующего
function switchUser() { endSession('Введите ПИН сотрудника'); }
function endSession(msg) {
  window.__MC_TOKEN = ''; try { localStorage.removeItem('mc_token'); } catch (e) {}
  if (TOKEN) run('destroySession', [TOKEN], function () {}, function () {});
  TOKEN = null; CACHE = {}; ACC = null; DATA = null;
  try { closeMdl(); } catch (e) {}
  document.getElementById('content').innerHTML = ''; document.getElementById('nav').innerHTML = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('loginErr').textContent = msg || '';
}
['click', 'keydown', 'touchstart', 'pointerdown'].forEach(function (ev) { document.addEventListener(ev, function () { LAST_ACT = Date.now(); }, { passive: true, capture: true }); });
function idleCheck() {
  if (!TOKEN || document.getElementById('app').style.display === 'none') return;
  if (Date.now() - LAST_ACT > IDLE_MIN * 60000) endSession('Автовыход: ' + IDLE_MIN + ' мин без действий. Введите ПИН.');
}
setInterval(idleCheck, 30000);

/* ---------- shell ---------- */
function start(me) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  run('getAppUrl', [], function (u) { APP_URL = u || ''; if (DATA) render(); }, function () {});
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spin"></div>Загрузка…</div>';
  run('uiMe', [TOKEN], function (r) {
    if (!r || !r.ok) { TOKEN = null; logoutSilent(); return; }
    ACC = r; window.__MC_ACCESS = r; if (r.idleMin) IDLE_MIN = r.idleMin;
    setUser(r); buildNav();
    var h = (location.hash || '').replace('#', '');
    openSec(SECTIONS.some(function (s) { return s[0] === h; }) ? h : 'home');   // скрытый раздел по прямой ссылке — сервер ответит «нет доступа»
    var ov = window.__MC_OPENV || (/^v:/.test(h) ? h.slice(2) : '');   // старый адрес модуля (?revision=1 …) — сразу его экран
    if (ov && VIEWS[ov]) openView(ov);
  }, function () {
    // нет связи: меню — по сохранённой копии доступа, иначе только «Главная»
    var a = null; try { a = JSON.parse(localStorage.getItem('mc_acc') || 'null'); } catch (e) {}
    ACC = a || { sections: ['home'], modules: {}, perms: {} }; setUser(ACC); buildNav(); openSec('home');
  });
}
function canSec(sec) { return !ACC || !ACC.sections || ACC.sections.indexOf(sec) >= 0; }
function canDo(perm) { if (!ACC) return false; if (ACC.dev) return true; return String(perm).split('|').some(function (k) { return ACC.perms && ACC.perms[k] === true; }); }
function buildNav() {
  try { localStorage.setItem('mc_acc', JSON.stringify(ACC)); } catch (e) {}
  var nav = '';
  SECTIONS.forEach(function (s) { if (!canSec(s[0])) return; nav += '<button data-s="' + s[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[s[0]] + '</svg>' + s[1] + '</button>'; });
  if (canDo('grants|personnel')) nav += '<button data-x="grants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Права сотрудников</button>';
  var n = document.getElementById('nav'); n.innerHTML = nav;
  n.onclick = function (e) { var b = e.target.closest('button'); if (!b) return; document.body.classList.remove('menu'); if (b.getAttribute('data-x') === 'grants') openGrants(); else openSec(b.getAttribute('data-s')); };
}
function logoutSilent() {
  window.__MC_TOKEN = ''; try { localStorage.removeItem('mc_token'); } catch (e) {}
  document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex';
}
function setUser(me) {
  // технический доступ не показывается ни как сотрудник, ни как роль
  document.getElementById('uname').textContent = me.dev ? '' : (me.name || '');
  document.getElementById('urole').textContent = me.dev ? '' : (me.role || '');
  document.getElementById('uav').textContent = me.dev ? '•' : (me.name || '?').split(' ').filter(Boolean).map(function (x) { return x[0]; }).slice(0, 2).join('');
}
// Переход из плитки или строки: раздел, вкладка и сразу отфильтрованная проблема
var FQ = '';
var RD_ST = { PASS: ['g', 'PASS'], FAIL: ['r', 'FAIL'], REVIEW: ['a', 'Проверить'], MISSING_EVIDENCE: ['r', 'Нет данных'], NOT_APPLICABLE: ['', 'Не применимо'] };
var RD_OV = { READY: ['g', 'ГОТОВ'], READY_WITH_WARNINGS: ['a', 'ГОТОВ С ЗАМЕЧАНИЯМИ'], NOT_READY: ['r', 'НЕ ГОТОВ'] };
function readinessHtml(r) {
  var ov = RD_OV[r.overall] || ['', r.overall];
  var rows = r.items.map(function (x, i) {
    var st = RD_ST[x.status] || ['', x.status];
    return '<div class="rdrow" data-rd="' + i + '"><div><div class="rdt">' + esc(x.area) + (x.blocking && (x.status === 'FAIL' || x.status === 'MISSING_EVIDENCE') ? ' <span class="rdb">блокирует</span>' : '') + '</div><div class="rdd">' + esc(x.requirement) + (x.detail ? ' — ' + esc(x.detail) : '') + '</div></div><span class="chip ' + st[0] + '">' + st[1] + '</span></div>';
  }).join('');
  return '<div class="card rdcard"><div class="ch"><h3>Проверка Роспотребнадзора</h3><span class="chip ' + ov[0] + '" style="font-size:13px">ИТОГ: ' + ov[1] + '</span></div>' +
    '<div class="rdnote">Готовность по внутреннему контрольному листу, не заключение надзорного органа. Нажмите на строку — откроется проблема.</div>' + rows +
    '<div class="rdft"><button class="btn" onclick="rerunReadiness(this)">Проверить сейчас</button><span>' + esc((r.at || '').replace('T', ' ').slice(0, 16)) + '</span></div></div>';
}
function rerunReadiness(btn) {
  btn.disabled = true; btn.textContent = 'Проверяю…';
  run('mcRunInspectionReadiness', [TOKEN], function (res) {
    var r = typeof res === 'string' ? JSON.parse(res) : res;
    if (r && r.data && DATA) { DATA.readiness = r.data; CACHE.home = null; render(); }
  }, function () { btn.disabled = false; btn.textContent = 'Нет связи'; });
}
function openReadinessItem(i) {
  var x = DATA.readiness.items[i]; if (!x) return;
  var g = x.go || {};
  var ev = (x.evidence || []).length ? '<p><b>Доказательства / записи:</b><br>' + x.evidence.map(esc).join('<br>') + '</p>' : '<p><b>Доказательств нет.</b></p>';
  var go = g.module && !VIEWS[g.module] ? APP_URL + '?' + g.module + '=1&token=' + encodeURIComponent(TOKEN) : '';   // экран главного окна открывается здесь же (goTo)
  var html = '<h3>' + esc(x.area) + ' · ' + esc((RD_ST[x.status] || [0, x.status])[1]) + '</h3><p>' + esc(x.requirement) + '</p>' + (x.detail ? '<p>' + esc(x.detail) + '</p>' : '') +
    (x.lastFact ? '<p>Последний факт: ' + esc(x.lastFact) + '</p>' : '') + ev + (x.correctiveAction ? '<p><b>Что сделать:</b> ' + esc(x.correctiveAction) + '</p>' : '') +
    (go ? '<a class="btn pri" target="_top" href="' + esc(go) + '">Открыть</a>' : g.sec || (g.module && VIEWS[g.module]) ? '<button class="btn pri" onclick=\'goTo(' + esc(JSON.stringify(g)) + ')\'>Открыть</button>' : '');
  var mdl = document.getElementById('mdl'), box = document.getElementById('mdlBox'); mdl.classList.remove('dish'); mdl.classList.add('on');
  box.innerHTML = '<button class="x" onclick="closeMdl()">×</button><div class="rdmdl">' + html + '</div>';
}
document.addEventListener('click', function (e) { var r = e.target.closest && e.target.closest('[data-rd]'); if (r) openReadinessItem(+r.getAttribute('data-rd')); });
function goTo(g) {
  if (g && g.module && VIEWS[g.module]) { openView(g.module, g.arg); return; }   // экран главного окна
  if (g && g.module) { window.top.location.href = APP_URL + '?' + g.module + '=1&token=' + encodeURIComponent(TOKEN); return; }   // этап 10.8: «ХАССП — сегодня» и др. страницы
  if (!g || !g.sec) return;
  closeMdl && closeMdl();
  if (g.sec === CUR && DATA) { TAB = g.tab || 0; FQ = g.q || ''; render(); window.scrollTo(0, 0); return; }
  openSec(g.sec, g);
}
function openSec(sec, g) {
  VIEW = null;
  CUR = sec; TAB = (g && g.tab) || 0; FQ = (g && g.q) || '';
  window.scrollTo(0, 0);
  [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-s') === sec); });
  try { history.replaceState(null, '', '#' + sec); } catch (e) {}
  STALE = false;
  var pk = !CACHE[sec] && window.mcOffline ? mcOffline.peek('uiData', [TOKEN, sec, {}]) : null;
  if (CACHE[sec]) { DATA = CACHE[sec]; render(); }
  else if (pk && pk.ok) { STALE = true; DATA = linkRows(pk); render(); }   // мгновенно — сохранённая копия, свежая следом
  else document.getElementById('content').innerHTML = '<div class="loading"><div class="spin"></div>Загрузка…</div>';
  run('uiData', [TOKEN, sec, {}], function (r) {
    if (CUR !== sec) return;
    STALE = false;
    if (!r || r.auth) { logoutSilent(); document.getElementById('loginErr').textContent = 'Сессия истекла — войдите снова'; return; }
    if (r.forbidden) { noAccess(sec); return; }
    if (!r.ok) { showErr('Раздел не загрузился: ' + (r.error || '')); return; }
    CACHE[sec] = linkRows(r); DATA = r; render();
  });
}
function noAccess(sec) {
  var nm = (SECTIONS.filter(function (s) { return s[0] === sec; })[0] || [sec, sec])[1];
  document.getElementById('content').innerHTML = '<div class="card noacc"><div class="nac">403 — НЕДОСТАТОЧНО ПРАВ</div><h2>Нет доступа к разделу</h2><p>«' + esc(nm) + '» недоступен' +
    (ACC && ACC.role ? ' для роли «' + esc(ACC.role) + '»' : '') + '. Если доступ нужен для работы, обратитесь к директору.</p><button class="btn pri" onclick="openSec(\'home\')">На главную</button></div>';
}
document.getElementById('gsearch').addEventListener('input', function () { var f = document.getElementById('tfilter'); if (f) { f.value = this.value; drawTable(); } });

/* ---------- render ---------- */
function tone(v) {
  var s = String(v).toLowerCase();
  if (s === 'закрыт') return 'r';
  if (s === 'открыт') return 'g';
  if (/^не требуется|^не применимо/.test(s)) return '';
  if (/^не |^нет |^нельзя/.test(s)) return 'r';
  if (/выполн|готов|в норме|активн|активен|утвержд|закрыт|выдано|отобрано|достаточно|норма|ok\b|прошёл/.test(s)) return 'g';
  if (/карантин|^брак|заблок/.test(s)) return 'r';
  if (/ждёт|повторн/.test(s)) return 'a';
  if (/работ|процесс|ожида|частич|истека|подготов|средн|на согласов|рекоменд|резерв|излиш|запланир/.test(s)) return 'a';
  if (/критич|просроч|дефицит|нехват|ниже мин|отклон|высок|недостач|^нет$|ошибк|не начато/.test(s)) return 'r';
  if (/полуфабрикат|черновик|низк|план/.test(s)) return 'b';
  return '';
}
function cell(c, v) {
  if (v === null || v === undefined) v = '';
  if (c.t === 'status') return v === '' ? '' : '<span class="chip ' + tone(v) + '">' + esc(v) + '</span>';
  if (c.t === 'pct') { var p = Math.max(0, Math.min(100, Number(v) || 0)); return '<div class="bar"><i><b style="width:' + p + '%"></b></i><span>' + p + '%</span></div>'; }
  if (c.t === 'date') { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); if (m) v = m[3] + '.' + m[2] + '.' + m[1]; }
  if (c.t === 'num' && v !== '' && !isNaN(v)) return esc(Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 }));
  return esc(v);
}
function actHtml(a) {
  if (a.fn) return '<button class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" onclick="' + esc(a.fn) + '(this)">' + esc(a.label) + '</button>';
  if (!a.module) return '';
  // единый интерфейс: модуль, ставший экраном главного окна, открывается здесь же, без перехода на другую страницу
  if (VIEWS[a.module]) return '<button class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" onclick="openView(\'' + esc(a.module) + '\')">' + esc(a.label) + '</button>';
  var href = APP_URL + '?' + a.module + '=1&token=' + encodeURIComponent(TOKEN);
  return '<a class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" href="' + esc(href) + '" target="_top">' + esc(a.label) + '</a>';
}
function render() {
  var d = DATA, h = '';

// вкладка может брать строки у соседней (одни и те же блюда не передаются дважды)

// заголовок строки — название (блюдо, продукт, сотрудник), а не дата или время

function tableHtml(t, q, ti) {

  var rows = (t.rows || []).filter(function (r) { return !q || t.columns.some(function (c) { return String(r[c.k] === undefined ? '' : r[c.k]).toLowerCase().indexOf(q) >= 0; }); });
  if (!rows.length) return '<div class="empty">' + (q ? 'Ничего не найдено' : 'Пока нет записей') + '</div>';
  var LIM = 200, shown = rows.slice(0, LIM);
  var h = '<div class="tw"><table><thead><tr>' + t.columns.map(function (c) { return '<th class="' + (c.t === 'num' ? 'num' : '') + '">' + esc(c.l) + '</th>'; }).join('') + '</tr></thead><tbody>';
  // строка ведёт к блюду / медкнижке / в раздел; остальные — открывают карточку со всеми данными
  var attr = function (r) {

    if (t.detail && r._code) return ' data-code="' + esc(r._code) + '"';

    return ' data-row="' + ti + ':' + t.rows.indexOf(r) + '"';
  };
  var clk = function (r) { return ' class="clk"' + attr(r); };
  shown.forEach(function (r) { h += '<tr' + clk(r) + '>' + t.columns.map(function (c) { return '<td class="' + (c.t === 'num' ? 'num' : '') + '">' + cell(c, r[c.k]) + '</td>'; }).join('') + '</tr>'; });
  h += '</tbody></table></div>';
  // мобильные карточки: первая колонка-текст — заголовок, статус справа, остальное строкой ниже
  var main = mainCol(t);

  h += '<div class="cards">' + shown.map(function (r) {

      .map(function (c) { return c.t === 'pct' ? esc(c.l) + ': ' + (Number(r[c.k]) || 0) + '%' : esc(c.l) + ': ' + cell(c, r[c.k]); }).join(' · ');
    return '<div class="mrow clk"' + attr(r) + '><div class="t"><span>' + esc(r[main.k]) + '</span>' + (st ? cell(st, r[st.k]) : '') + '</div>' + (rest ? '<div class="d">' + rest + '</div>' : '') + '</div>';
  }).join('') + '</div>';
  if (rows.length > LIM) h += '<div class="more">Показаны первые ' + LIM + ' из ' + rows.length + ' — уточните поиск</div>';
  return h;
}

/* ---------- архитектура папки ttk: дерево папок и карточек ----------
   Папки и вложенность — как на Google Диске (по последней синхронизации).
   Нажатие на папку раскрывает её, на блюдо — открывает карточку. */
var TOPEN = { '': true }, TPATHS = [];

  var T = t.tree, F = {};

    if (f.path === '') Object.assign(F[''], x); else ensure(f.path, f.name, f.parent, f.depth, x);

  Object.keys(F).forEach(function (k) {
    F[k].kids.sort(function (a, b) { return (a.virtual ? 1 : 0) - (b.virtual ? 1 : 0) || a.name.localeCompare(b.name, 'ru', { numeric: true }); });
    F[k].dishes.sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); });

  (function tot(f) { f.total = f.dishes.length + f.kids.reduce(function (s, c) { return s + tot(c); }, 0); return f.total; })(F['']);

  var folderSvg = '<svg class="tico" viewBox="0 0 24 20"><path d="M1.5 4a2 2 0 0 1 2-2h5.5l2.4 2.4h9.1a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-17a2 2 0 0 1-2-2z"/></svg>';
  var stCol = (t.columns || []).filter(function (c) { return c.t === 'status'; })[0] || { k: 'status', t: 'status' };
  function dishRow(r, depth) {
    return '<div class="tr trd clk" data-code="' + esc(r._code) + '" style="--d:' + depth + '"><span class="tdot"></span><span class="tname">' + esc(r.name) + '</span>' +
      '<span class="tmeta">' + (r.yield !== '' && r.yield !== undefined ? fmt(r.yield) + ' ' + esc(r.yu || '') : '') + '</span>' + cell({ t: 'status' }, r.status) + '</div>';
  }
  function node(f) {
    if (q && !f.hit) return '';
    var open = q ? true : !!TOPEN[f.path];
    var bad = (f.other || []).concat(f.failed || []);
    var h = '<div class="tn' + (open ? ' open' : '') + (f.virtual ? ' tvirt' : '') + '" data-path="' + esc(f.path) + '">' +
      '<div class="tr trf" style="--d:' + f.depth + '" onclick="ttToggle(this)"><span class="tchev">▸</span>' + folderSvg +
      '<span class="tname">' + esc(f.name) + '</span><span class="tcnt">' + (q ? f.hit + ' из ' : '') + f.total + '</span>' +
      (bad.length ? '<span class="chip a" title="' + esc(bad.join(', ')) + '">⚠ ' + bad.length + '</span>' : '') +
      (f.id ? '<a class="tdrive" href="https://drive.google.com/drive/folders/' + encodeURIComponent(f.id) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Открыть папку на Google Диске">↗</a>' : '') +
      '</div><div class="tkids">';
    if (open) {
      f.kids.forEach(function (c) { h += node(c); });
      f.dishes.filter(hit).forEach(function (r) { h += dishRow(r, f.depth + 1); });
      if (bad.length && !q) h += '<div class="tr twarn" style="--d:' + (f.depth + 1) + '">⚠ Не прочитаны (читаются только карточки .xls): ' + esc(bad.slice(0, 8).join(', ')) + (bad.length > 8 ? ' и ещё ' + (bad.length - 8) : '') + '</div>';

    (T.synced ? '' : '<div class="ttnote">Папки появятся после синхронизации с ttk (кнопка «⟳ Синхронизировать с ttk»). Пока карты сгруппированы по категориям.</div>');

/* ---------- банкет: карточка с закупкой, новый банкет, скан бланка ----------

// новая дата прохождения → следующий срок пересчитывается (его можно поправить вручную)
function medNext(fromId, toId, months) {

  if (!v) return;
  var d = new Date(v + 'T00:00:00'); d.setMonth(d.getMonth() + months);
  var p = function (n) { return ('0' + n).slice(-2); };
  to.value = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());

function medPos() {
  var n = document.getElementById('mName').value, p = document.getElementById('mPos');

function saveMed(id) {
  var v = function (i) { return document.getElementById(i).value; }, b = document.getElementById('mSave'), er = document.getElementById('mErr');
  // те же проверки, что на сервере, — чтобы без связи ошибка не обнаружилась только при отправке
  var today = new Date().toISOString().slice(0, 10), bad = '';
  if (!v('mName').trim()) bad = 'Укажите сотрудника';
  else if (v('mExam') && v('mExam') > today) bad = 'Дата медосмотра не может быть в будущем';
  else if (v('mAtt') && v('mAtt') > today) bad = 'Дата аттестации не может быть в будущем';
  else if (v('mExam') && v('mExamNext') && v('mExamNext') <= v('mExam')) bad = 'Следующий медосмотр должен быть позже прошедшего';
  else if (v('mAtt') && v('mAttNext') && v('mAttNext') <= v('mAtt')) bad = 'Следующая аттестация должна быть позже прошедшей';
  if (bad) { er.textContent = bad; er.style.display = 'block'; return; }
  b.disabled = true; b.textContent = 'Сохраняю…'; er.style.display = 'none';
  run('saveMedBook', [JSON.stringify({ id: id, name: v('mName'), position: v('mPos'), number: v('mNum'), exam: v('mExam'), examNext: v('mExamNext'),
    att: v('mAtt'), attNext: v('mAttNext'), notes: v('mNotes') }), TOKEN], function (res) {
    var r = {}; try { r = JSON.parse(res); } catch (e) {}

var PW_ST = { PLANNED: 'Запланирован', IN_PROGRESS: 'В работе', COMPLETED: 'Выпущен', CANCELLED: 'Отменён' };
