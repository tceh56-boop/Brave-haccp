<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЦЕХ Стандарт Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ЦЕХ Стандарт Admin — тёмная премиум-тема: чёрный, золотой, белый, песочный */
:root{--bg:#0b0b0b;--panel:#141210;--panel2:#1b1814;--line:#2b261f;--gold:#d4af37;--gold2:#a87b22;--sand:#e9dcc4;--text:#f4efe6;--muted:#9a8f80;
  --green:#4caf7a;--red:#e2645a;--amber:#e3a63c;--blue:#6aa6e8;--grad:linear-gradient(135deg,#e2bf55,#d4af37 45%,#a87b22);--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Roboto,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(900px 500px at 90% -10%,rgba(212,175,55,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(168,123,34,.08),transparent 60%);background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-family:Montserrat,Roboto,Arial,sans-serif;margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--gold)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0f0d0b;color:var(--text);font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
/* вход */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.lcard img{display:block;width:240px;max-width:80%;margin:0 auto 6px}
.lcard .sub{text-align:center;color:var(--muted);margin-bottom:20px;letter-spacing:.04em;font-size:12px}
.lcard .f{margin-bottom:12px}
/* каркас */
#app{display:none}
.side{position:fixed;inset:0 auto 0 0;width:240px;background:linear-gradient(180deg,#151009,#0b0b0b 60%);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.side .brand{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.side .brand img{width:190px;max-width:100%}
.side .brand small{display:block;color:#bfa76a;font-size:11px;letter-spacing:.06em;margin-top:4px}
.nav{flex:1;overflow:auto;padding:10px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--sand);padding:10px 12px;border-radius:12px;text-align:left;margin:2px 0}
.nav button:hover{background:rgba(212,175,55,.08)}
.nav button.on{background:var(--grad);color:#120d06;font-weight:700;box-shadow:0 10px 24px -12px rgba(212,175,55,.8)}
.nav button span.i{width:18px;text-align:center;opacity:.9}
.side .me{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side .me b{display:block;color:var(--text);font-size:13px}
.side .me a{cursor:pointer;margin-right:10px}
.main{margin-left:240px;padding:22px 26px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.burger{display:none;border:0;background:none;color:var(--gold);font-size:24px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--grad);border-color:transparent;color:#120d06}
.btn.red{border-color:rgba(226,100,90,.5);color:#ffb3ab}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.kpi{background:linear-gradient(160deg,#18140f,#110f0c);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(closest-side,rgba(212,175,55,.16),transparent)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font:800 26px/1.15 Montserrat,Roboto,sans-serif;margin-top:4px}
.kpi .v.g{color:var(--gold)}.kpi .v.r{color:var(--red)}.kpi .v.gr{color:var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .ch h3{font-size:15px}
.card .cb{padding:14px 16px}
.cols2{grid-template-columns:1fr 1fr}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#17140f;color:var(--muted);font-size:12px;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1f1b16;vertical-align:middle}
tr:hover td{background:rgba(212,175,55,.04)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#25211b;color:var(--sand);white-space:nowrap}
.chip.g{background:rgba(76,175,122,.15);color:#8fe0b2}.chip.r{background:rgba(226,100,90,.15);color:#ffb3ab}.chip.a{background:rgba(227,166,60,.15);color:#f3cd86}.chip.b{background:rgba(106,166,232,.15);color:#a9cdf5}.chip.gold{background:rgba(212,175,55,.18);color:var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;min-width:160px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.msg{position:fixed;right:18px;bottom:18px;z-index:90;max-width:420px;padding:12px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 20px 50px -20px #000;display:none}
.msg.ok{border-color:rgba(76,175,122,.6)}.msg.err{border-color:rgba(226,100,90,.7)}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:80}
.mdl.on{display:flex}
.mdl .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(980px,100%);padding:22px;position:relative;box-shadow:0 40px 100px -30px #000}
.mdl .x{position:absolute;right:14px;top:10px;border:0;background:none;color:var(--muted);font-size:28px}
.mdl h2{font-size:20px;margin-bottom:4px;padding-right:30px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form .w{grid-column:1/-1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:10px;font-weight:600}
.tabs button.on{background:rgba(212,175,55,.15);color:var(--gold)}
.secret{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0f0d0b;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;word-break:break-all;color:var(--gold)}
.chart{width:100%;height:190px}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s}
  body.menu .side{transform:none}
  .main{margin-left:0;padding:16px}
  .burger{display:block}
  .cols2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .filters input,.filters select{min-width:0;width:100%}
}
</style>
</head>
<body>
<div id="login">
  <div class="lcard">
    <img src="<?!= include('Logo') ?>" alt="ЦЕХ Стандарт">
    <div class="sub">ADMIN · управление клиентами и подписками</div>
    <div class="f"><label>Email</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="f"><label>Пароль</label><input id="lPwd" type="password" autocomplete="current-password"></div>
    <button class="btn pri" style="width:100%" id="lBtn">Войти</button>
    <div id="lErr" style="color:var(--red);min-height:20px;margin-top:10px;text-align:center"></div>
  </div>
</div>

<div id="app">
  <aside class="side">
    <div class="brand"><img src="<?!= include('Logo') ?>" alt="ЦЕХ Стандарт"><small>ADMIN PANEL</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><b id="meName"></b><span id="meRole"></span><div style="margin-top:6px"><a onclick="changePwd()">Сменить пароль</a><a onclick="logout()">Выйти</a></div></div>
  </aside>
  <main class="main">
    <div class="top"><button class="burger" onclick="document.body.classList.toggle('menu')">☰</button><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="acts" id="acts"></div></div>
    <div id="content"></div>
  </main>
</div>
<div class="mdl" id="mdl" onclick="if(event.target===this)closeMdl()"><div class="box" id="mdlBox"></div></div>
<div class="msg" id="msg"></div>

<script>
/* ==================== ядро ==================== */
var TOKEN = null, ME = null, SEC = 'dashboard', CACHE = {};
try { TOKEN = sessionStorage.getItem('tsa_token'); } catch (e) {}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, no) {
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.ok === false && r.code === 'AUTH') { showLogin(r.error); return no(new Error(r.error)); }
      if (r && r.ok === false) return no(new Error(r.error || 'ошибка'));
      ok(r && r.data !== undefined ? r.data : r);
    }).withFailureHandler(function (e) { no(e); })[fn].apply(null, args);
  });
}
function toast(t, kind) { var m = document.getElementById('msg'); m.className = 'msg ' + (kind || 'ok'); m.textContent = t; m.style.display = 'block'; clearTimeout(m._t); m._t = setTimeout(function () { m.style.display = 'none'; }, kind === 'err' ? 7000 : 3500); }
function errT(e) { toast(String(e && e.message || e), 'err'); }
function can(p) { return ME && (ME.can.indexOf('*') >= 0 || ME.can.indexOf(p) >= 0); }
function rub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function d10(s) { s = String(s || ''); var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[3] + '.' + m[2] + '.' + m[1] : s; }
function dt(s) { var x = new Date(s); return isNaN(x) ? String(s || '') : x.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function chip(t, k) { return '<span class="chip ' + (k || '') + '">' + esc(t) + '</span>'; }
var ST = { ACTIVE: ['активен', 'g'], BLOCKED: ['заблокирован', 'r'], DELETED: ['удалён', ''], REVOKED: ['отозвана', ''], EXPIRING: ['истекает', 'a'], EXPIRED: ['просрочена', 'r'], CANCELLED: ['отменена', ''],
  PAID: ['оплачен', 'g'], PENDING: ['ожидает', 'a'], FAILED: ['ошибка', 'r'], REFUNDED: ['возврат', 'b'], PUBLISHED: ['опубликовано', 'g'], DRAFT: ['черновик', 'a'], SENT: ['отправлено', 'g'], PARTIAL: ['частично', 'a'], OK: ['готово', 'g'], ISSUED: ['выставлен', 'a'] };
function st(s) { var x = ST[s] || [s, '']; return chip(x[0], x[1]); }
function table(cols, rows, act, empty) {
  if (!rows || !rows.length) return '<div class="empty">' + esc(empty || 'Записей нет') + '</div>';
  var h = '<div class="tw"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.n ? 'n' : '') + '">' + esc(c.l) + '</th>'; }).join('') + (act ? '<th></th>' : '') + '</tr></thead><tbody>';
  rows.slice(0, 500).forEach(function (r, i) { h += '<tr>' + cols.map(function (c) { var v = c.f ? c.f(r) : esc(r[c.k]); return '<td class="' + (c.n ? 'n' : '') + '">' + (v === undefined || v === null ? '' : v) + '</td>'; }).join('') + (act ? '<td style="white-space:nowrap">' + act(r, i) + '</td>' : '') + '</tr>'; });
  return h + '</tbody></table></div>';
}
function kpis(list) { return '<div class="grid kpis">' + list.map(function (k) { return '<div class="kpi"><div class="l">' + esc(k[0]) + '</div><div class="v ' + (k[2] || '') + '">' + esc(k[1]) + '</div></div>'; }).join('') + '</div>'; }
function card(title, body, extra) { return '<div class="card"><div class="ch"><h3>' + esc(title) + '</h3>' + (extra || '') + '</div><div class="cb">' + body + '</div></div>'; }
function loading() { document.getElementById('content').innerHTML = '<div class="loading"><div class="spin"></div>Загрузка…</div>'; }
function mdl(html) { document.getElementById('mdlBox').innerHTML = '<button class="x" onclick="closeMdl()">×</button>' + html; document.getElementById('mdl').classList.add('on'); }
function closeMdl() { document.getElementById('mdl').classList.remove('on'); }
function val(id) { var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value.trim()) : ''; }
function field(id, l, type, v, opts, wide) {
  var input = type === 'select' ? '<select id="' + id + '">' + opts.map(function (o) { var ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>'; }).join('') + '</select>'
    : type === 'textarea' ? '<textarea id="' + id + '" rows="4">' + esc(v) + '</textarea>' : '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v === undefined ? '' : v) + '">';
  return '<div class="' + (wide || type === 'textarea' ? 'w' : '') + '"><label>' + esc(l) + '</label>' + input + '</div>';
}
function busy(btn, p) { if (btn) btn.disabled = true; return p.then(function (r) { if (btn) btn.disabled = false; return r; }, function (e) { if (btn) btn.disabled = false; errT(e); throw e; }); }
function download(name, b64, mime) { var a = document.createElement('a'); a.href = 'data:' + (mime || 'application/octet-stream') + ';base64,' + b64; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

/* ==================== графики (SVG) ==================== */
function barChart(points, key, color, fmt) {
  var W = 600, H = 180, pad = 26, max = Math.max.apply(null, points.map(function (p) { return p[key]; }).concat([1])), bw = (W - pad * 2) / points.length;
  var bars = points.map(function (p, i) { var h = (p[key] / max) * (H - pad * 2); return '<rect x="' + (pad + i * bw + 1) + '" y="' + (H - pad - h) + '" width="' + Math.max(1, bw - 3) + '" height="' + h + '" rx="2" fill="' + color + '"><title>' + p.day + ': ' + (fmt ? fmt(p[key]) : p[key]) + '</title></rect>'; }).join('');
  var lbl = points.filter(function (p, i) { return i % Math.ceil(points.length / 6) === 0; }).map(function (p) { var i = points.indexOf(p); return '<text x="' + (pad + i * bw) + '" y="' + (H - 8) + '" fill="#9a8f80" font-size="10">' + p.day.slice(5) + '</text>'; }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><defs><linearGradient id="g' + key + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2bf55"/><stop offset="1" stop-color="#a87b22"/></linearGradient></defs>' +
    '<text x="' + pad + '" y="14" fill="#9a8f80" font-size="10">макс. ' + (fmt ? fmt(max) : max) + '</text>' + bars.replace(/fill="gold"/g, 'fill="url(#g' + key + ')"') + lbl + '</svg>';
}
function lineChart(points, key) {
  var W = 600, H = 180, pad = 26, vals = points.map(function (p) { return p[key]; }), max = Math.max.apply(null, vals.concat([1])), min = Math.min.apply(null, vals.concat([0]));
  var x = function (i) { return pad + i * (W - pad * 2) / Math.max(1, points.length - 1); }, y = function (v) { return H - pad - (v - min) / Math.max(1, max - min) * (H - pad * 2); };
  var d = points.map(function (p, i) { return (i ? 'L' : 'M') + x(i) + ' ' + y(p[key]); }).join(' ');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + d + ' L' + x(points.length - 1) + ' ' + (H - pad) + ' L' + pad + ' ' + (H - pad) + 'Z" fill="rgba(212,175,55,.12)"/>' +
    '<path d="' + d + '" fill="none" stroke="#d4af37" stroke-width="2.5"/><text x="' + pad + '" y="14" fill="#9a8f80" font-size="10">' + min + ' – ' + max + '</text></svg>';
}

/* ==================== вход ==================== */
function showLogin(m) { TOKEN = null; try { sessionStorage.removeItem('tsa_token'); } catch (e) {} document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; document.getElementById('lErr').textContent = m || ''; }
document.getElementById('lBtn').onclick = function () {
  var b = this; b.disabled = true; document.getElementById('lErr').textContent = 'Проверка…';
  google.script.run.withSuccessHandler(function (r) {
    b.disabled = false;
    if (!r || !r.ok) { document.getElementById('lErr').textContent = r && r.error || 'Ошибка входа'; return; }
    TOKEN = r.data.token; try { sessionStorage.setItem('tsa_token', TOKEN); } catch (e) {} ME = r.data; startApp();
  }).withFailureHandler(function (e) { b.disabled = false; document.getElementById('lErr').textContent = String(e.message || e); }).adminLogin(val('lEmail'), document.getElementById('lPwd').value);
};
document.getElementById('lPwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('lBtn').click(); });
function logout() { call('adminLogout', TOKEN).then(function () {}, function () {}); showLogin(''); }
function changePwd() {
  mdl('<h2>Смена пароля</h2><div class="form">' + field('pOld', 'Текущий пароль', 'password') + field('pNew', 'Новый пароль (от 10 символов, буквы и цифры)', 'password') + field('pNew2', 'Повторите', 'password') + '</div><div style="margin-top:14px"><button class="btn pri" id="pSave">Сохранить</button></div>');
  document.getElementById('pSave').onclick = function () {
    if (val('pNew') !== val('pNew2')) return toast('Пароли не совпадают', 'err');
    busy(this, call('adminChangePassword', TOKEN, val('pOld'), val('pNew'))).then(function () { closeMdl(); toast('Пароль изменён'); });
  };
}

/* ==================== навигация ==================== */
var SECTIONS = [
  ['dashboard', 'Дашборд', '◆', 'dashboard'], ['clients', 'Клиенты', '◉', 'clients.view'], ['subs', 'Подписки', '↻', 'subs.view'], ['payments', 'Платежи', '₽', 'payments.view'],
  ['licenses', 'Лицензии', '⚿', 'licenses.view'], ['updates', 'Обновления', '⇪', 'dashboard'], ['notify', 'Уведомления', '✉', 'notify.send'], ['logs', 'Логи', '☰', 'logs.view'],
  ['backups', 'Резервные копии', '⛁', 'backups.view'], ['ttk', 'База ТТК', '❏', 'ttk.view'], ['analytics', 'Аналитика', '▲', 'analytics'], ['settings', 'Настройки', '⚙', 'settings.view'], ['users', 'Администраторы', '☺', 'users']
];
function startApp() {
  document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block';
  document.getElementById('meName').textContent = ME.name || ME.email; document.getElementById('meRole').textContent = ME.roleName || ME.role;
  document.getElementById('nav').innerHTML = SECTIONS.filter(function (s) { return can(s[3]); }).map(function (s) { return '<button data-s="' + s[0] + '"><span class="i">' + s[2] + '</span>' + s[1] + '</button>'; }).join('');
  document.getElementById('nav').onclick = function (e) { var b = e.target.closest('button'); if (b) { document.body.classList.remove('menu'); go(b.getAttribute('data-s')); } };
  var h = (location.hash || '').replace('#', ''); go(SECTIONS.some(function (s) { return s[0] === h && can(s[3]); }) ? h : 'dashboard');
}
function head(t, sub, acts) { document.getElementById('title').textContent = t; document.getElementById('subtitle').textContent = sub || ''; document.getElementById('acts').innerHTML = acts || ''; }
function go(sec) {
  SEC = sec; [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-s') === sec); });
  try { history.replaceState(null, '', '#' + sec); } catch (e) {}
  loading(); (V[sec] || V.dashboard)();
}
function C(h) { document.getElementById('content').innerHTML = h; }

/* ==================== экраны ==================== */
var V = {}, TARIFFS = [];
function planName(c) { var t = TARIFFS.filter(function (x) { return x.code === c; })[0]; return t ? t.name : c; }

        '<label style="margin-top:12px">Webhook (уведомления об оплате) — укажите в кабинете ЮKassa / ЮMoney</label><div class="secret">' + esc(s.webhookUrl || 'появится после развёртывания веб-приложения') + '</div>') +
        card('Реквизиты поставщика (для счетов)', '<div class="form">' + field('vN', 'Название', 'text', s.vendor.name, null, true) + field('vI', 'ИНН', 'text', s.vendor.inn) + field('vB', 'Банк', 'text', s.vendor.bank) + field('vA', 'Расчётный счёт', 'text', s.vendor.account) + '</div>') + '</div>' +
      card('Script Properties (секреты)', '<div class="note">Значения хранятся только в свойствах скрипта и не показываются целиком. Пустое поле — без изменений.</div><div class="form" style="margin-top:10px">' + s.props.map(function (p) { return field('pp_' + p.key, p.key + (p.set ? ' (задано: ' + p.masked + ')' : ' (не задано)'), 'password', ''); }).join('') + '</div>' + (ed ? '<div style="margin-top:12px"><button class="btn pri" id="sSave">Сохранить платежи, реквизиты и секреты</button></div>' : '')) +
      '<div class="grid cols2">' + card('Почта', '<div>Отправка писем — MailApp от аккаунта владельца. Осталось писем на сегодня: <b>' + s.mailQuota + '</b></div>') +
        card('Google Drive', '<div>База админ-панели: <a target="_blank" href="https://docs.google.com/spreadsheets/d/' + esc(s.sheetId) + '">открыть таблицу</a></div><div class="note">Папка «ЦЕХ Стандарт Admin» на Диске: счета, резервные копии.</div><div style="margin-top:8px">Адрес API для систем клиентов:</div><div class="secret">' + esc(s.webAppUrl || '—') + '</div>') + '</div>' +
      card('API Keys', table([{ k: 'name', l: 'Название' }, { k: 'rights', l: 'Права' }, { l: 'Создан', f: function (k) { return dt(k.created); } }, { l: 'Использован', f: function (k) { return k.used ? dt(k.used) : '—'; } }, { l: 'Статус', f: function (k) { return st(k.status); } }], s.apiKeys, function (k) { return ed && k.status === 'ACTIVE' ? '<button class="btn sm red" onclick="revokeKey(\'' + k.id + '\')">Отозвать</button>' : ''; }, 'Ключей нет'), ed ? '<button class="btn sm pri" style="margin-left:auto" onclick="newKey()">+ Ключ</button>' : ''));
    if (!ed) return;
    document.getElementById('sTar').onclick = function () {
      var t = s.tariffs.map(function (x, i) { return { code: x.code, name: val('tn' + i), setup: Number(val('ts' + i)), monthly: Number(val('tm' + i)), features: x.features }; });
      busy(this, call('adminSettingsSave', TOKEN, { tariffs: t })).then(function () { toast('Тарифы сохранены'); });
    };
    document.getElementById('sSave').onclick = function () {
      var props = {}; s.props.forEach(function (p) { var v = val('pp_' + p.key); if (v) props[p.key] = v; });
      busy(this, call('adminSettingsSave', TOKEN, { provider: val('sProv'), returnUrl: val('sRet'), vendor: { name: val('vN'), inn: val('vI'), bank: val('vB'), account: val('vA') }, props: props })).then(function () { toast('Сохранено'); V.settings(); });
    };
  }, errT);
};
function newKey() { var n = prompt('Название ключа (для чего)'); if (n) call('adminApiKeyCreate', TOKEN, n, 'read').then(function (r) { mdl('<h2>API-ключ</h2><div class="note">Ключ показывается один раз.</div><div class="secret">' + esc(r.key) + '</div>'); V.settings(); }, errT); }
function revokeKey(id) { if (confirm('Отозвать ключ?')) call('adminApiKeyRevoke', TOKEN, id).then(function () { toast('Отозван'); V.settings(); }, errT); }

/* ---------- администраторы ---------- */
V.users = function () {
  head('Администраторы', 'Super Admin, Manager, Support, Developer', '<button class="btn pri" onclick="userForm()">+ Администратор</button>');
  call('adminUsersList', TOKEN).then(function (rows) {
    C(card('Администраторы', table([{ k: 'email', l: 'Email' }, { k: 'name', l: 'Имя' }, { k: 'role', l: 'Роль' }, { l: 'Статус', f: function (u) { return st(u.status); } }, { l: 'Последний вход', f: function (u) { return u.lastLogin ? dt(u.lastLogin) : '—'; } }],
      rows, function (u) { return '<button class="btn sm" onclick="userRole(\'' + u.email + '\',\'' + u.role + '\')">Роль</button> <button class="btn sm" onclick="userReset(\'' + u.email + '\')">Сбросить пароль</button> ' + (u.status === 'ACTIVE' ? '<button class="btn sm red" onclick="userSt(\'' + u.email + '\',\'BLOCKED\')">Заблокировать</button>' : '<button class="btn sm" onclick="userSt(\'' + u.email + '\',\'ACTIVE\')">Разблокировать</button>'); })) +
      card('Права ролей', '<div class="note">Super Admin — всё. Manager — клиенты, подписки, платежи, лицензии, рассылки, аналитика. Support — просмотр клиентов, рассылки, логи, резервные копии. Developer — обновления, логи, ошибки, копии, база ТТК, просмотр настроек.</div>'));
  }, errT);
};
var ROLE_OPTS = [['SUPER_ADMIN', 'Super Admin'], ['MANAGER', 'Manager'], ['SUPPORT', 'Support'], ['DEVELOPER', 'Developer']];
function userForm() {
  mdl('<h2>Новый администратор</h2><div class="form">' + field('uE', 'Email', 'email') + field('uN', 'Имя', 'text') + field('uR', 'Роль', 'select', 'MANAGER', ROLE_OPTS) + '</div><div style="margin-top:12px"><button class="btn pri" id="uGo">Создать</button></div><div id="uOut2"></div>');
  document.getElementById('uGo').onclick = function () { busy(this, call('adminUserCreate', TOKEN, { email: val('uE'), name: val('uN'), role: val('uR') })).then(function (r) { document.getElementById('uOut2').innerHTML = '<label style="margin-top:12px">Временный пароль (показывается один раз)</label><div class="secret">' + esc(r.password) + '</div>'; V.users(); }); };
}
function userRole(e, r) { mdl('<h2>Роль ' + esc(e) + '</h2><div class="form">' + field('urr', 'Роль', 'select', r, ROLE_OPTS, true) + '</div><div style="margin-top:12px"><button class="btn pri" id="urGo">Сохранить</button></div>'); document.getElementById('urGo').onclick = function () { busy(this, call('adminUserUpdate', TOKEN, e, { role: val('urr') })).then(function () { closeMdl(); V.users(); }); }; }
function userReset(e) { if (confirm('Сбросить пароль ' + e + '?')) call('adminUserResetPassword', TOKEN, e).then(function (r) { mdl('<h2>Новый пароль</h2><div class="secret">' + esc(r.password) + '</div>'); }, errT); }
function userSt(e, s) { call('adminUserUpdate', TOKEN, e, { status: s }).then(function () { V.users(); }, errT); }

/* ---------- старт ---------- */
if (TOKEN) google.script.run.withSuccessHandler(function (r) { if (r && r.ok) { ME = r.data; startApp(); } else showLogin(''); }).withFailureHandler(function () { showLogin(''); }).adminMe(TOKEN);
</script>
</body>
