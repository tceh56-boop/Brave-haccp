<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Приёмка товара</title>
<style>
:root{--wine:#6e1423;--wine2:#4a0c17;--gold:#b3893f;--bg:#f7f3f1;--card:#fff;--ink:#2a1a1d;--mut:#7d6b6e;--line:#eadfdc;--red:#a8231f;--red-bg:#f8e1df;--amber:#a86a12;--amber-bg:#fbefd9;--green:#2f7d4f;--green-bg:#e3f2e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}.tabs b{font-weight:700;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}.nm{font-weight:650}.meta{color:var(--mut);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}.r{background:var(--red-bg);color:var(--red)}.a{background:var(--amber-bg);color:var(--amber)}.g{background:var(--green-bg);color:var(--green)}
.form{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}.card.open .form{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d9cfcc;border-radius:9px;font:inherit;background:#fff}
textarea{min-height:56px}.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.chk input{width:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px inherit;cursor:pointer;background:#efe6e3;color:var(--ink)}
.btn.pri{background:var(--wine);color:#fff}.btn.bad{background:var(--red-bg);color:var(--red)}.btn:disabled{opacity:.5}
.msg{margin-top:10px;font-size:14px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:30px}.note{font-size:12px;color:var(--mut);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}.tbl th{font-size:12px;color:var(--mut)}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px}.steps span{background:#f3ece9;color:var(--mut);border-radius:999px;padding:3px 9px}.steps span.on{background:var(--wine);color:#fff}
.lnH,.lnG{display:grid;grid-template-columns:3fr 1fr .9fr 1fr 1.35fr 38px;gap:6px;align-items:center}.lnH{font-size:11.5px;color:var(--mut);margin-top:8px;padding:0 9px}
.ln{border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:6px;background:#fffdfc}.ln.bad{border-color:#e7b9b5}
.exp{font-size:12.5px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:4px}.exp select{width:auto;max-width:100%;padding:4px 6px;font-size:12.5px}.exp a{color:var(--wine)}
.mL{display:none}@media(max-width:640px){.lnH{display:none}.lnG{grid-template-columns:1fr 1fr 1fr;align-items:end}.lnG .nmI{grid-column:1/-1}.lnG .dtI{grid-column:span 2}.mL{display:block;margin:2px 0 2px}}
.sum{font-size:13px;margin-top:10px}.done{border-color:#bfe0cb}.bt{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}
.bt .inf{flex:1;min-width:200px}.bt .cp{display:flex;gap:6px;align-items:center;font-size:13px}.bt .cp input{width:64px;padding:6px}
.rc{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:9px 0}.rc input{width:auto;margin-top:3px}.rc .inf{flex:1;min-width:0}
.lbWrap{overflow-x:auto;max-width:100%}
.lp{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}.lp .grid{grid-template-columns:repeat(3,1fr)}@media(max-width:640px){.lp .grid{grid-template-columns:1fr 1fr}}
.ck{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;margin:2px 0}.ck i{font-style:normal;width:16px;flex:0 0 16px}.warnbox{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.okbox{background:var(--green-bg);color:var(--green);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}.ambox{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.pg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pc{border:1px solid var(--line);border-radius:10px;padding:6px;width:156px;font-size:12px;background:#fff}.pc img{width:100%;height:110px;object-fit:contain;background:#f3ece9;border-radius:6px;display:block}.pc .acts{margin-top:4px;gap:4px}.pc .btn{padding:3px 8px;font-size:12px}.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
</style></head><body><div class="wrap">
<h1>Приёмка товара</h1>
<div class="sub">Скан накладной → проверка → фото оригинальной этикетки → сопоставление → партия → место хранения → маркировка.</div>
<div class="tabs" id="tabs"></div><div class="msg" id="msg"></div><div id="body"><div class="empty">Загрузка…</div></div>

    '<div class="acts"><button class="btn pri" onclick="printSel()"' + (nSel ? '' : ' disabled') + '>🏷 Печать выбранных' + (nSel ? ' (' + nSel + ')' : '') + '</button>' + (typeof MCBT !== 'undefined' && MCBT.supported() ? '<button class="btn" onclick="printSel(1)"' + (nSel ? '' : ' disabled') + '>📡 Bluetooth</button>' : '') + '<button class="btn" onclick="RSEL={};drawRecent()">Снять выбор</button></div>' +
    (list.length ? list.map(function (b) {
      var st = BST[b.status] || [b.statusRu || b.status || '', ''];
      return '<label class="rc"><input type="checkbox"' + (RSEL[b.batchId] ? ' checked' : '') + ' onchange="RSEL[\'' + esc(b.batchId) + '\']=this.checked;drawRecent()"><div class="inf"><div class="nm">' + esc(b.product) + ' <span class="meta">' + esc(b.qty) + '</span></div>' +
        '<div class="meta">№ ' + esc(b.batchId) + ' · принято ' + esc(b.received) + ' · годен до ' + (b.expiry ? esc(b.expiry) : '<b>не указан</b>') + ' · принял ' + esc(b.acceptedBy || '—') + (b.location ? ' · ' + esc(b.location) : '') + '</div>' +
        '<div class="meta">Накладная № ' + esc(b.doc) + ' · ' + esc(b.supplier) + ' · этикеток напечатано: ' + (b.printed || 0) + (b.lastPrint ? ' (последняя ' + esc(b.lastPrint) + ')' : '') + ' · <a target="_top" href="' + esc(cardUrl(b.batchId)) + '">карточка</a></div>' +
        (b.vsdNumber ? '<div class="meta">ВСД ' + esc(b.vsdNumber) + ' · <b>' + esc(b.vsdStatus) + '</b>' + (b.vsdCancelledAt ? ' · погашен ' + esc(b.vsdCancelledAt) + ' · ' + esc(b.vsdCancelledBy) : '') + '</div>' : '') + '</div>' +
        (st[0] ? '<span class="chip ' + st[1] + '">' + esc(st[0]) + '</span>' : '') + '</label>';
    }).join('') : '<div class="empty">' + (RECENT.length ? 'Ничего не найдено' : 'Приёмок с маркировкой ещё нет') + '</div>') + '</div>';
  var e = document.getElementById('rq'); if (e && RQ && document.activeElement !== e) { e.focus(); e.setSelectionRange(RQ.length, RQ.length); }
}
function printSel(bt) { lbPrint((RECENT || []).filter(function (b) { return RSEL[b.batchId]; }).map(function (b) { return { b: b, n: 1, kind: b.kind || 'receipt' }; }), printed, bt); }
