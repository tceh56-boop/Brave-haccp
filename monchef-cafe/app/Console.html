<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* ==========================================================================
   MON CHEF — работа при пропадании интернета.
   Встаёт между экраном и сервером (google.script.run):
   • ответы на чтение запоминаются на устройстве; без связи экран получает
     последние сохранённые данные (и сразу показывает их при следующем открытии);
   • записи журналов, проверок, бракеража, чек-листов, задач и медкнижек без
     связи складываются в очередь на устройстве и отправляются сами, как только
     связь вернётся. Время записи — время на устройстве, когда её сделали.
   Ограничение платформы Google: открыть приложение без интернета нельзя —
   страница должна быть загружена заранее (открыта на планшете/телефоне).
   ========================================================================== */
(function () {
  if (typeof google === 'undefined' || !google.script || !google.script.run || window.mcOffline) return;

  var Q_KEY = 'mc_offline_q', F_KEY = 'mc_offline_failed', RC = 'mc_rc_';

  var QUEUE = { addJournalEntry: 'Запись журнала', answerJournalCheck: 'Ответ на проверку',
    addSaleEntry: 'Продажа', addBactericidalLampReading: 'Бактерицидная лампа', saveChecklistExecution: 'Чек-лист',
    updateKanbanTask: 'Задача' };
  var READ = /^(get|ui|calculateKBZHU|mcGet)/, NO_CACHE = /^(getPhoto|getDocumentFile|getPrintJob)$/;
  var online = navigator.onLine !== false, flushing = false;

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function token() { return ls('mc_token') || ''; }
  function loadJ(k) { try { return JSON.parse(ls(k) || '[]'); } catch (e) { return []; } }
  function saveJ(k, v) { ls(k, JSON.stringify(v)); }

      message: 'Сохранено на устройстве. Это ещё не запись журнала — она появится после отправки на сервер.',
      date: n.d, time: n.t, cook: '—', braker: '—', sum: '—', seller: '—', accumulated: '—', remaining: '—', decision: 'не принято сервером — ждёт отправки', count: '—' });

  function appError(res) {
    if (res === null || res === undefined) return '';
    if (typeof res === 'string') {

      '.mcoff.off{display:block;background:#7a2a1a;color:#fff}.mcoff.wait{display:block;background:#b3893f;color:#fff}.mcoff.bad{display:block;background:#fff4dc;color:#7a5410;border:1px solid #e1c27a}' +
      '.mcoffp{position:fixed;left:12px;right:12px;bottom:calc(' + (window.MC_OFFLINE_BOTTOM || '16px') + ' + 44px);max-width:420px;max-height:60vh;overflow:auto;z-index:2147482001;background:#fffdf9;border:1px solid #eadfcf;border-radius:14px;box-shadow:0 10px 30px rgba(40,20,10,.25);padding:12px 14px;font:13px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#241c17;display:none}' +
      '.mcoffp.on{display:block}.mcoffp h4{margin:2px 0 8px;font-size:13px;color:#6e1423}.mcoffp .r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #eadfcf}.mcoffp small{color:#8a7b6a}.mcoffp button{border:1px solid #eadfcf;background:#fff;border-radius:9px;padding:5px 9px;font:inherit;cursor:pointer}' +

      : (q || flushing) ? '⟳ Отправка записей: ' + q : f ? '⚠ Не приняты: ' + f : '';

<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MON CHEF</title>
<style>
:root{
  --wine:#6e1423; --wine-d:#4a0c17; --wine-dd:#36080f; --wineghost:#f3e3e1;
  --gold:#b3893f; --gold-l:#e9d6ae; --bg:#f5efe6; --paper:#fffdf9; --ink:#241c17; --muted:#8a7b6a; --line:#eadfcf;
  --green:#2f7d4f; --green-bg:#e3f2e8; --amber:#a86a12; --amber-bg:#fbefd9; --red:#a8231f; --red-bg:#f8e1df;
  --blue:#2f5f9e; --blue-bg:#e2ecf8; --grey-bg:#efebe5;
  --shadow:0 10px 30px -18px rgba(60,30,20,.45); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fffaf2 0,#efe3d0 70%);z-index:50;padding:16px}
.login-card{width:min(360px,100%);text-align:center}
.login-card img{width:190px;max-width:70%}
.login-sub{color:var(--muted);margin:6px 0 18px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wine);display:block}
.pin-dots i.on{background:var(--wine)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto}
.pad button{height:62px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pad button:active{background:var(--wineghost)}
.pad .ghost{background:transparent;border:0;box-shadow:none;font-size:15px;color:var(--muted)}
.login-err{min-height:22px;color:var(--red);margin-top:12px;font-weight:600}

/* ---------- layout ---------- */
#app{display:none;min-height:100%}
.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:linear-gradient(180deg,var(--wine-d),var(--wine-dd));color:#f6e9e4;display:flex;flex-direction:column;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand img{width:56px;height:56px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.side .brand b{display:block;font:700 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.08em}
.side .brand small{display:block;color:var(--gold-l);font-size:11px;margin-top:3px}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#f1e1dc;padding:9px 12px;border-radius:10px;text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(233,214,174,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side .foot a{color:var(--gold-l);text-decoration:none;display:block;margin:3px 0}
.main{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(255,253,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px}
.burger svg{width:24px;height:24px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search input{border:0;outline:0;flex:1;font:inherit;background:none;min-width:0}
.search svg{width:16px;height:16px;opacity:.5}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.user b{display:block;font-size:13px}
.user small{display:block;color:var(--muted);font-size:12px}
.content{padding:22px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font:700 26px/1.15 Georgia,"Times New Roman",serif;color:var(--wine-d)}
.head .sub{color:var(--muted);margin-top:4px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.wine:before{background:var(--wine)}.kpi.red:before{background:var(--red)}.kpi.green:before{background:var(--green)}.kpi.gold:before{background:var(--gold)}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:700 30px/1.1 Georgia,serif;margin-top:4px}.kpi .v.vw{font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.kpi .h{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rdcard{margin-bottom:16px}.rdcard .ch{display:flex;justify-content:space-between;align-items:center;gap:10px}.rdnote{font-size:12px;color:var(--muted,#7d6b6e);margin:4px 0 8px}.rdrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line,#eadfdc);cursor:pointer}.rdrow:hover{background:rgba(110,20,35,.04)}.rdt{font-weight:650}.rdd{font-size:12px;color:var(--muted,#7d6b6e)}.rdb{font-size:11px;color:var(--red,#a8231f);font-weight:600}.rdmdl{padding:6px 4px}.rdmdl p{margin:8px 0;font-size:14px;word-break:break-word}.rdmdl .btn{display:inline-block;margin-top:8px}.rdft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted,#7d6b6e)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .ch h3{margin:0;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--muted);font-weight:600}

  /* ================= ЗАСТАВКА ВХОДА MON CHEF — логотип владельца =================
     Сначала появляется бокал, от него раскрываются мозг (влево) и схема (вправо),
     по логотипу проходит золотой блик, выплывает надпись. Затем шкала до 100%. */
  #mcxScreen{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;
    transition:opacity .5s ease;background:#f7f0e5;
    background-image:radial-gradient(120% 80% at 100% -10%,rgba(110,20,35,.10),transparent 55%),
      radial-gradient(90% 60% at -10% 0%,rgba(179,137,63,.14),transparent 50%),
      radial-gradient(60% 50% at 50% 42%,#fffaf1,transparent 70%)}

  @keyframes mcxL{to{clip-path:inset(0 59% 0 0)}}

  .mcx-parts{position:absolute;inset:0;animation:mcxOut .35s ease 2.45s forwards}
  @keyframes mcxOut{to{opacity:0}}
  .mcx-full{opacity:0;animation:mcxIn .35s ease 2.45s forwards,mcxGlow 2.8s ease-in-out 2.8s infinite}
  @keyframes mcxIn{to{opacity:1}}
  @keyframes mcxGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(179,137,63,0))}50%{filter:drop-shadow(0 0 14px rgba(179,137,63,.45))}}

/* ---------- login ---------- */
var PIN = '';
function drawPin() {
  var d = ''; for (var i = 0; i < 4; i++) d += '<i class="' + (i < PIN.length ? 'on' : '') + '"></i>';
  if (PIN.length > 4) for (var j = 4; j < PIN.length; j++) d += '<i class="on"></i>';
  document.getElementById('dots').innerHTML = d;
}
(function () {
  var keys = ['1','2','3','4','5','6','7','8','9','⌫','0','Войти'], h = '';
  keys.forEach(function (k) { h += '<button class="' + (k === '⌫' || k === 'Войти' ? 'ghost' : '') + '" data-k="' + k + '">' + k + '</button>'; });
  var pad = document.getElementById('pad'); pad.innerHTML = h;
  pad.addEventListener('click', function (e) {
    var k = e.target.getAttribute('data-k'); if (!k) return;
    document.getElementById('loginErr').textContent = '';
    if (k === '⌫') PIN = PIN.slice(0, -1);
    else if (k === 'Войти') submitPin();
    else if (PIN.length < 6) { PIN += k; if (PIN.length === 4) setTimeout(function () { if (PIN.length === 4) submitPin(); }, 600); }
    drawPin();
  });
  drawPin();
})();
document.addEventListener('keydown', function (e) {
  if (document.getElementById('login').style.display === 'none') return;
  if (/^\d$/.test(e.key) && PIN.length < 6) { PIN += e.key; drawPin(); if (PIN.length === 4) setTimeout(function () { if (PIN.length === 4) submitPin(); }, 600); }
  else if (e.key === 'Backspace') { PIN = PIN.slice(0, -1); drawPin(); }
  else if (e.key === 'Enter') submitPin();
});
function submitPin() {
  if (PIN.length < 4) return;
  var p = PIN; PIN = ''; drawPin();
  document.getElementById('loginErr').textContent = 'Проверка…';
  run('loginWithPin', [p, deviceId()], function (res) {
    var r = {}; try { r = JSON.parse(res); } catch (e) {}
    if (!r.ok || !r.token) { document.getElementById('loginErr').textContent = r.error || 'Неверный ПИН-код'; return; }
    TOKEN = r.token; window.__MC_TOKEN = TOKEN; try { localStorage.setItem('mc_token', TOKEN); } catch (e) {}
    // заставка с логотипом поверх; главный экран тем временем загружает данные
    mcxIntro();
    LAST_ACT = Date.now(); start(null);
  }, function () { document.getElementById('loginErr').textContent = 'Ошибка сети'; });
}
function logout() {
  if (!confirm('Выйти из системы?')) return;
  endSession('');
}
// общий планшет на кухне: «Сменить сотрудника» — без вопросов, сразу ПИН следующего

function endSession(msg) {
  window.__MC_TOKEN = ''; try { localStorage.removeItem('mc_token'); } catch (e) {}

/* ---------- render ---------- */
function tone(v) {
  var s = String(v).toLowerCase();
  if (s === 'закрыт') return 'r';
  if (s === 'открыт') return 'g';
  if (/^не требуется|^не применимо/.test(s)) return '';
  if (/^не |^нет |^нельзя/.test(s)) return 'r';
  if (/выполн|готов|в норме|активн|активен|утвержд|закрыт|выдано|отобрано|достаточно|норма|ok\b|прошёл/.test(s)) return 'g';
  if (/карантин|^брак|заблок/.test(s)) return 'r';
  if (/ждёт|повторн/.test(s)) return 'a';
  if (/работ|процесс|ожида|частич|истека|подготов|средн|на согласов|рекоменд|резерв|излиш|запланир/.test(s)) return 'a';
  if (/критич|просроч|дефицит|нехват|ниже мин|отклон|высок|недостач|^нет$|ошибк|не начато/.test(s)) return 'r';
  if (/полуфабрикат|черновик|низк|план/.test(s)) return 'b';
  return '';
}
function cell(c, v) {
  if (v === null || v === undefined) v = '';
  if (c.t === 'status') return v === '' ? '' : '<span class="chip ' + tone(v) + '">' + esc(v) + '</span>';
  if (c.t === 'pct') { var p = Math.max(0, Math.min(100, Number(v) || 0)); return '<div class="bar"><i><b style="width:' + p + '%"></b></i><span>' + p + '%</span></div>'; }
  if (c.t === 'date') { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); if (m) v = m[3] + '.' + m[2] + '.' + m[1]; }
  if (c.t === 'num' && v !== '' && !isNaN(v)) return esc(Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 }));
  return esc(v);
}
function actHtml(a) {
  if (a.fn) return '<button class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" onclick="' + esc(a.fn) + '(this)">' + esc(a.label) + '</button>';
  if (!a.module) return '';
  // единый интерфейс: модуль, ставший экраном главного окна, открывается здесь же, без перехода на другую страницу
  if (VIEWS[a.module]) return '<button class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" onclick="openView(\'' + esc(a.module) + '\')">' + esc(a.label) + '</button>';
  var href = APP_URL + '?' + a.module + '=1&token=' + encodeURIComponent(TOKEN);
  return '<a class="btn' + (/^\+/.test(a.label) ? ' pri' : '') + '" href="' + esc(href) + '" target="_top">' + esc(a.label) + '</a>';
}

  var acts = (d.actions || []).filter(function (a) { return a.fn || APP_URL; });

  h += '</div>';

      return '<div class="kpi ' + (k.tone || '') + (k.go ? ' clk" data-go="' + esc(JSON.stringify(k.go)) : '') + '"><div class="l">' + esc(k.label) + '</div><div class="v' + (/^[\d\s.,:%₽°+−-]*$/.test(String(k.value)) ? '' : ' vw') + '">' + esc(k.value) + '</div>' + (k.hint ? '<div class="h">' + esc(k.hint) + '</div>' : '') + (k.go ? '<div class="kgo">›</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  if (d.section === 'home' && d.readiness && d.readiness.items) h += readinessHtml(d.readiness);
  if (d.section === 'home' && d.tabs && d.tabs.length === 2) {
    h += '<div class="grid2">' + d.tabs.map(function (t, i) { return '<div class="card"><div class="ch"><h3>' + esc(t.title) + '</h3></div>' + tableHtml(t, '', i) + '</div>'; }).join('') + '</div>';
    document.getElementById('content').innerHTML = h; return;
  }
  h += '<div class="card"><div class="ch"><div class="tabs" id="tabs">' + (d.tabs || []).map(function (t, i) {
    return '<button data-i="' + i + '" class="' + (i === TAB ? 'on' : '') + '">' + esc(t.title) + (t.panel ? '' : ' <small style="opacity:.6">' + (t.lazy && !t._loaded ? (t.total || 0) : (t.rows || []).length) + '</small>') + '</button>';
  }).join('') + '</div><label class="filter"><input id="tfilter" placeholder="Поиск…" value="' + esc(FQ || document.getElementById('gsearch').value) + '"></label></div>' +
    (FQ ? '<div class="fqbar">Показано: «' + esc(FQ) + '» <button onclick="FQ=\'\';render()">× показать всё</button></div>' : '') + '<div id="tbody"></div></div>';

// вкладка может брать строки у соседней (одни и те же блюда не передаются дважды)

function tableHtml(t, q, ti) {

  var LIM = 200, shown = rows.slice(0, LIM);

  // строка ведёт к блюду / медкнижке / в раздел; остальные — открывают карточку со всеми данными

<script>
/* ---------- «Производство п/ф» и «Неделя» — панели разделов (перенесено из Mon Cher) ----------
   Вкладка раздела с полем panel рисуется здесь, а не таблицей. Все записи — прежними серверными
   функциями через шлюз (права, операция, аудит). Выпуск без обязательных ККТ сервер не проведёт. */
var PANELS = {}, PW = { week: null, off: 0, prod: null };
function pwBox() { return document.getElementById('tbody'); }
function pwErr(box, m) { box.innerHTML = '<div class="err">' + esc(m) + '</div>'; }
function pwJ(x) { try { return typeof x === 'string' ? JSON.parse(x) : x; } catch (e) { return { error: String(x) }; } }
function pwOk(j) { return j && !j.error && j.success !== false && j.ok !== false; }
function pwMsg(j) { return (j && j.error && (j.error.message || j.error)) || 'ошибка'; }
function pwQ(q, u) { return bqQty(q, u); }
function pwDay(iso) { var d = new Date(iso + 'T00:00:00'); return ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'][d.getDay()]; }
function pwExport(title, sheets, btn) {
  var old = btn.textContent; btn.disabled = true; btn.textContent = '… выгружаю';
  run('exportToSheet', [title, JSON.stringify(sheets)], function (url) {
    btn.disabled = false; btn.textContent = old;
    if (!url || String(url).indexOf('http') !== 0) { alert('Файл не создан' + (url ? ': ' + url : '')); return; }
    window.open(url, '_blank');
  }, function (e) { btn.disabled = false; btn.textContent = old; alert(String(e && e.message || e)); });
}

/* ===== Производство полуфабрикатов ===== */
PANELS.prod = function (box) {
  if (!PW.semis) run('uiDishList', [TOKEN], function (r) { PW.semis = r && r.ok ? r.dishes.filter(function (d) { return d.semi; }) : []; var dl = document.getElementById('pwAnyL'); if (dl) dl.innerHTML = PW.semis.map(function (d) { return '<option value="' + esc(d.name) + '">'; }).join(''); }, function () { PW.semis = []; });
  if (PW.prod) pwProdDraw(box); else box.innerHTML = '<div class="loading"><div class="spin"></div>Считаю потребность в п/ф по банкетам…</div>';
  run('uiProductionBoard', [TOKEN], function (r) { if (!r || !r.ok) return pwErr(box, r && r.error || 'Ошибка'); PW.prod = r; if (pwBox() === box) pwProdDraw(box); },
    function (e) { pwErr(box, String(e && e.message || e)); });
};
function pwProdReload() { PW.prod = null; var b = pwBox(); if (b) PANELS.prod(b); }
function pwProdDraw(box) {
  var r = PW.prod; if (!r.can) { box.innerHTML = '<div class="empty">' + esc(r.note) + '</div>'; return; }
  var h = '<div class="lblrow"><span>Произвести любой полуфабрикат</span><span class="lblr">ТТК пересчитывается на введённый вес</span></div>' +
    '<div class="bqo"><div style="flex:2"><label>Полуфабрикат</label><input id="pwAnyN" list="pwAnyL" placeholder="начните вводить название п/ф"><datalist id="pwAnyL">' + (PW.semis || []).map(function (d) { return '<option value="' + esc(d.name) + '">'; }).join('') + '</datalist></div>' +
    '<div><label>Вес</label><input id="pwAnyQ" type="number" min="0" step="any" placeholder="например 2000"></div><div><label>Ед.</label><select id="pwAnyU"><option>г</option><option>кг</option><option>мл</option><option>л</option><option>шт</option></select></div>' +
    '<button class="btn" onclick="pwAnyCalc(this)">Показать ТТК</button></div><div id="pwAnyBox"></div>';
  h += '<div class="lblrow"><span>Что произвести — потребность банкетов на 7 дней</span><span class="lblr">с учётом склада и уже запланированного</span></div>';
  h += r.suggest.length ? r.suggest.map(function (s, i) {
    return '<div class="irow"><span>' + esc(s.name) + '<small>нужно ' + pwQ(s.demand, s.unit) + ' · на складе ' + pwQ(s.stock, s.unit) + (s.planned > 0 ? ' · уже в плане ' + pwQ(s.planned, s.unit) : '') +
      '<br>для: ' + esc(s.forEvents.join(', ')) + '</small></span><span class="pwq"><input type="number" min="0" step="any" id="pwq_' + i + '" value="' + esc(s.toProduce) + '" onchange="pwRecalc(' + i + ')"><small>' + esc(s.unit) + '</small><button class="btn pri" onclick="pwPlan(' + i + ',this)">Запланировать</button></span></div><div id="pwt_' + i + '">' + pwPfTtkHtml(s.ttk, 'к производству') + '</div>';
  }).join('') : '<div class="empty">✓ На ближайшие 7 дней все п/ф для банкетов есть на складе или уже запланированы</div>';
  h += '<div class="lblrow"><span>Заказы в работе</span><span class="lblr">' + r.active.length + '</span></div>';
  h += r.active.length ? r.active.map(pwOrderHtml).join('') : '<div class="empty">Нет заказов в работе</div>';
  if (r.history.length) h += '<details class="draw"><summary>Последние выпуски и отмены (' + r.history.length + ')</summary>' + r.history.map(pwOrderHtml).join('') + '</details>';
  box.innerHTML = '<div class="pwwrap">' + h + '</div>';
}
/* ТТК п/ф, пересчитанная на запланированный вес: состав × (вес / выход карты); сырьё — с остатком склада. */
function pwPfTtkHtml(t, label) {
  if (!t) return '<div class="sub">ТТК не найдена или без выхода — пересчитать на вес нельзя</div>';
  var h = '<details class="draw pwttk"><summary>📋 ТТК на ' + pwQ(t.qty, t.unit) + (label ? ' · ' + esc(label) : '') + (t.short ? ' · <span style="color:var(--red)">не хватает ' + t.short + ' поз.</span>' : '') + '</summary>' +
    (t.warning ? '<div class="warn">' + esc(t.warning) + '</div>' : '') +
    '<div class="sub">Карта: выход ' + pwQ(t.cardYield, t.cardUnit) + ' → коэффициент × ' + String(t.factor).replace('.', ',') + '</div>' +
    '<table class="bqt"><thead><tr><th>Ингредиент</th><th class="n">Брутто</th><th class="n">Нетто</th></tr></thead><tbody>' + pwTtkLines(t.lines, 0) + '</tbody></table>' +

    (e.missing.length ? '<div class="warn">Без ТТК (в расчёт не вошли): ' + esc(e.missing.join(', ')) + '</div>' : '') +
    '<div class="ebar" style="flex-wrap:wrap"><button class="btn" onclick="openBanquet(\'' + id + '\')">Карточка и заказ</button><button class="btn" onclick="pwEvXls(\'' + id + '\',this)">⬇ Excel</button><button class="btn" onclick="pwEvTtk(\'' + id + '\',this)">📋 ТТК на Диск</button>' +
    (PW.week.canConsume ? '<button class="btn" onclick="pwConsume(\'' + id + '\',this)" title="Снять резерв и списать продукты со склада по факту производства">✅ Списать по факту</button>' : '') +
    (e.blank ? '<a class="btn" href="' + esc(e.blank) + '" target="_blank">📄 Бланк</a>' : '') + '</div>' +
    '<div class="lblrow"><span>Меню</span><span class="lblr">' + e.menu.length + ' блюд</span></div>' + e.menu.map(function (m) { return '<div class="irow' + (m.found ? ' clk' : '') + '"' + (m.found ? ' onclick="openDish(\'' + esc(m.code) + '\',' + (Number(m.qty) || 1) + ')"' : '') + '><span>' + esc(m.name) + (m.out ? '<small>выход ' + n2(m.out) + ' ' + esc(m.outUnit) + '</small>' : '') + '</span><b>' + n2(m.qty) + ' порц.</b></div>'; }).join('') +
    '<div class="lblrow"><span>ТТК на банкет</span><span class="lblr">состав × порции; п/ф раскрыты по своей карте</span></div>' + e.ttk.map(function (t) {
      return '<details class="draw"><summary>' + esc(t.name) + ' — ' + n2(t.qty) + ' порц.' + (t.doubled ? ' <span class="chip r">состав задвоен</span>' : '') + '</summary>' + (t.doubled ? '<div class="warn">Состав карты записан дважды подряд — сырьё удвоено. Исправьте карту (новая версия ТТК).</div>' : '') + '<table class="bqt"><thead><tr><th>Ингредиент</th><th class="n">Брутто</th><th class="n">Нетто</th></tr></thead><tbody>' + pwTtkLines(t.lines, 0) + '</tbody></table></details>';
    }).join('') +
    '<div class="lblrow"><span>Закупка на банкет</span><span class="lblr">сырьё по ТТК · ' + e.purchase.length + ' поз.</span></div>' +
    (e.pfFromStock.length ? '<div class="sub">✓ готовые п/ф со склада: ' + e.pfFromStock.map(function (p) { return esc(p.name) + ' ' + n2(p.qty) + ' ' + esc(p.unit); }).join(', ') + '</div>' : '') +
    '<table class="bqt"><tbody>' + e.purchase.map(function (p) { return '<tr><td>' + esc(p.name) + '</td><td class="n">' + n2(p.qty) + ' ' + esc(p.unit) + '</td></tr>'; }).join('') + '</tbody></table></div>';
}
function pwEvXls(id, btn) {
  var e = pwEv(id); if (!e) return;
  var blank = [['Поле', 'Значение'], ['Формат', e.name], ['Дата', bqDate(e.raw.date)], ['Время', e.time], ['Зал / место', e.place], ['Гостей', e.guests], ['Контакт', e.contact], ['Пожелания', e.comment], ['', ''], ['Позиция', 'Порций']]
    .concat(e.menu.map(function (m) { return [m.name, m.qty]; }));
  var ttk = [['Блюдо', 'Порций', 'Ингредиент', 'Брутто', 'Нетто', 'Ед.']];
  e.ttk.forEach(function (t) { (function rec(lines, lvl) { lines.forEach(function (l) { ttk.push([t.name, t.qty, (lvl ? '↳ ' : '') + l.name, l.brutto, l.netto, l.unit]); if (l.sub) rec(l.sub, lvl + 1); }); })(t.lines, 0); });
  pwExport('Банкет ' + e.name + ' ' + bqDate(e.raw.date), { 'Бланк банкета': blank, 'ТТК на банкет': ttk, 'Закупка': [['Продукт', 'Кол-во', 'Ед.']].concat(e.purchase.map(function (p) { return [p.name, p.qty, p.unit]; })) }, btn);
}
function pwEvTtk(id, btn) {
  var e = pwEv(id); if (!e) return;
  var old = btn.textContent; btn.disabled = true; btn.textContent = '… формирую ТТК';
  run('exportTTKBanquet', [JSON.stringify(e.raw), JSON.stringify(e.ttkAgg), TOKEN], function (x) {
    btn.disabled = false; btn.textContent = old; var j = pwJ(x);
    if (!j || j.error || j.success === false || !j.url) { alert('ТТК не сформирована: ' + pwMsg(j)); return; }
    window.open(j.url, '_blank');
  }, function (er) { btn.disabled = false; btn.textContent = old; alert(String(er && er.message || er)); });
}
function pwConsume(id, btn) {
  if (!confirm('Списать продукты этого банкета со склада по факту производства?\n\nРезерв снимется, вместо него появится реальный расход. Действие попадёт в журнал операций и аудит.')) return;
  var old = btn.textContent; btn.disabled = true; btn.textContent = '… списываю';
  run('consumeEventReservations', [id, TOKEN], function (x) {
    btn.disabled = false; btn.textContent = old; var j = pwJ(x);
    if (!pwOk(j)) { alert('Не списано: ' + pwMsg(j)); return; }
    alert('Списано позиций: ' + ((j.data && j.data.consumed) || 0)); PW.week = null; var b = pwBox(); if (b) PANELS.week(b);
  }, function (er) { btn.disabled = false; btn.textContent = old; alert(String(er && er.message || er)); });
}
function pwWeekXls(btn) {
  var w = PW.week, byDay = [['Дата', 'Банкет', 'Время', 'Гостей', 'Порций']];
  w.days.forEach(function (d) { d.events.forEach(function (e) { byDay.push([bqDate(d.date), e.name, e.time, e.guests, e.portions]); }); });
  pwExport('Закупка на неделю ' + bqDate(w.from) + '–' + bqDate(w.to), { 'Закупка на неделю': [['Продукт', 'Кол-во', 'Ед.']].concat(w.weekPurchase.map(function (p) { return [p.name, p.qty, p.unit]; })), 'Банкеты недели': byDay }, btn);
}
function pwReqXls(btn) {
  var w = PW.week;
  pwExport('Заявка на закупку ' + bqDate(w.from) + '–' + bqDate(w.to), { 'Заявка': [['Продукт', 'Купить', 'Ед.', 'На складе', 'Мин. запас', 'Почему']].concat(w.purchaseRequest.map(function (p) {
    return [p.name, p.qty, p.unit, p.stock.qty + ' ' + p.stock.unit, p.min ? p.min.qty + ' ' + p.min.unit : '', p.reason]; })) }, btn);
}

</script>
